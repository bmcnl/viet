S(27,{
 r:["Chính nhờ có cô","Chính nhờ cô giáo mà tôi yêu thích tiếng Việt. Không phải ai cũng kiên nhẫn như cô. Cô không chỉ dạy ngữ pháp mà còn dạy cả văn hóa. Chính vì vậy, đến tận bây giờ tôi vẫn nhớ cô.","C'est grâce à ma professeure que j'aime le vietnamien. Tout le monde n'est pas aussi patient qu'elle. Elle n'enseignait pas seulement la grammaire mais aussi la culture. C'est précisément pour cela que je pense encore à elle aujourd'hui.",
  [["Grâce à qui aime-t-il le vietnamien ?",["à sa professeure","à ses amis","à un livre"],0],["Elle enseignait :",["grammaire et culture","seulement le vocabulaire","les maths"],0],["« Chính » sert à :",["mettre en relief","nier","interroger"],0]]],
 l:["Chẳng những giỏi, anh ấy còn rất khiêm tốn. Chính anh ấy đã giúp tôi vượt qua kỳ thi. Nếu không có anh, tôi đã bỏ cuộc rồi.","Non seulement il est excellent, mais il est aussi très modeste. C'est lui qui m'a aidé à réussir l'examen. Sans lui, j'aurais abandonné.",
  [["Qualités :",["excellent et modeste","paresseux","timide"],0],["Il a aidé à :",["réussir l'examen","trouver un travail","déménager"],0],["Sans lui :",["abandon","réussite","voyage"],0]]],
 w:["Écris 3 phrases d'emphase avec « chính », « chẳng những... mà còn », « không chỉ... mà còn ».",["chính","không chỉ","mà còn"],"Chính bạn đã giúp tôi. Không chỉ giỏi mà còn tốt bụng. Bạn rất quan trọng với tôi.","C'est toi qui m'as aidé. Non seulement doué mais aussi gentil. Tu comptes beaucoup pour moi."],
 s:["Remercie à voix haute quelqu'un en insistant sur son rôle (« chính nhờ... »).",["chính nhờ","cảm ơn","giúp"],"Chính nhờ anh giúp mà tôi làm xong. Cảm ơn anh nhiều.","C'est grâce à ton aide que j'ai fini. Merci beaucoup."]
});
S(28,{
 r:["Báo cáo về giao thông","Theo khảo sát, số lượng xe máy tại thành phố tăng nhanh trong những năm qua. Do đó, tình trạng kẹt xe ngày càng nghiêm trọng. Tuy nhiên, chính quyền đã triển khai tuyến metro nhằm giảm áp lực cho đường phố. Nhìn chung, người dân ủng hộ giải pháp này.","Selon une enquête, le nombre de motos dans la ville a augmenté rapidement ces dernières années. Par conséquent, les embouteillages deviennent de plus en plus graves. Cependant, les autorités ont lancé une ligne de métro pour soulager les rues. Globalement, les habitants soutiennent cette solution.",
  [["Cause des embouteillages :",["trop de motos","la pluie","les trains"],0],["Solution :",["le métro","plus de routes","interdire les motos"],0],["Avis des habitants :",["favorables","opposés","indifférents"],0]]],
 l:["Do thiếu nước nên nông dân gặp nhiều khó khăn. Hơn nữa, giá phân bón tăng mạnh. Vì vậy, nhiều gia đình phải chuyển sang nghề khác.","À cause du manque d'eau, les paysans rencontrent des difficultés. De plus, le prix des engrais augmente fortement. C'est pourquoi beaucoup de familles doivent changer de métier.",
  [["Problème principal :",["manque d'eau","trop de pluie","guerre"],0],["Autre difficulté :",["prix des engrais","manque d'ouvriers","maladie"],0],["Conséquence :",["changement de métier","fête","émigration obligatoire"],0]]],
 w:["Écris un petit paragraphe formel avec « do đó », « tuy nhiên » et « nhìn chung ».",["do đó","tuy nhiên","nhìn chung"],"Giá nhà tăng nhanh. Do đó, nhiều người khó mua nhà. Tuy nhiên, chính phủ đã có chính sách hỗ trợ. Nhìn chung, tình hình đang cải thiện.","Les prix de l'immobilier augmentent vite. Par conséquent, beaucoup ont du mal à acheter. Cependant, le gouvernement a des mesures d'aide. Globalement la situation s'améliore."],
 s:["Présente une situation et sa conséquence avec « do đó » puis nuance avec « tuy nhiên ».",["do đó","tuy nhiên","giá"],"Giá tăng nhanh, do đó nhiều người khó mua. Tuy nhiên, có hỗ trợ.","Les prix augmentent vite, donc beaucoup ont du mal à acheter. Cependant il y a des aides."]
});
S(29,{
 r:["Việc học ngôn ngữ","Việc học một ngôn ngữ mới đòi hỏi sự kiên trì. Sự tiến bộ không đến trong một đêm. Nhờ việc luyện tập mỗi ngày, tôi đã nói được những câu đơn giản. Niềm vui khi giao tiếp với người bản xứ thật khó diễn tả.","Apprendre une nouvelle langue demande de la persévérance. Le progrès ne vient pas en une nuit. Grâce à l'entraînement quotidien, j'arrive à dire des phrases simples. La joie de communiquer avec des natifs est difficile à décrire.",
  [["Ce qu'il faut :",["persévérance","chance","argent"],0],["Progrès :",["en une nuit","graduel","impossible"],1],["Joie :",["difficile à décrire","petite","nulle"],0]]],
 l:["Sự thành công không phải là điều ngẫu nhiên. Việc đọc sách mỗi ngày đã thay đổi cách nghĩ của tôi. Niềm tin vào bản thân rất quan trọng.","Le succès n'est pas une affaire de hasard. Lire chaque jour a changé ma façon de penser. La confiance en soi est très importante.",
  [["Le succès :",["n'est pas le hasard","est le hasard","est impossible"],0],["Ce qui a changé sa pensée :",["lire chaque jour","voyager","dormir"],0],["Important :",["la confiance en soi","l'argent","la mode"],0]]],
 w:["Écris 3 phrases avec « việc », « sự » ou « niềm » pour nominaliser un verbe.",["việc","sự","niềm"],"Việc học tiếng Việt rất thú vị. Sự cố gắng được đền đáp. Niềm vui lớn nhất là nói chuyện với gia đình.","Apprendre le vietnamien est passionnant. L'effort est récompensé. La plus grande joie est de parler avec la famille."],
 s:["Dis à voix haute ce que représente pour toi « việc học tiếng Việt ».",["việc học","tiếng Việt","tôi"],"Việc học tiếng Việt giúp tôi hiểu gia đình hơn.","Apprendre le vietnamien m'aide à mieux comprendre ma famille."]
});
S(30,{
 r:["Vì lợi ích chung","Đối với cộng đồng, việc bảo vệ môi trường là trách nhiệm của tất cả mọi người. Theo quy định mới, các nhà máy phải xử lý nước thải trước khi xả ra sông. Ngoài ra, dưới sự hướng dẫn của chuyên gia, người dân có thể phân loại rác tại nhà.","Pour la communauté, la protection de l'environnement est la responsabilité de tous. Selon la nouvelle réglementation, les usines doivent traiter les eaux usées avant de les rejeter dans le fleuve. De plus, sous la conduite d'experts, les habitants peuvent trier leurs déchets chez eux.",
  [["Responsabilité de :",["tout le monde","seulement l'État","personne"],0],["Les usines doivent :",["traiter les eaux usées","fermer","payer plus d'impôts"],0],["Tri des déchets :",["à la maison","dans les usines","interdit"],0]]],
 l:["Về mặt kinh tế, dự án này mang lại nhiều lợi ích. Xét về lâu dài, nó góp phần tạo việc làm cho người dân. Đối với giới trẻ, đây là cơ hội lớn.","Sur le plan économique, ce projet apporte beaucoup d'avantages. À long terme, il contribue à créer des emplois. Pour les jeunes, c'est une grande opportunité.",
  [["Projet :",["avantageux économiquement","coûteux","inutile"],0],["À long terme :",["crée des emplois","détruit des emplois","est annulé"],0],["Pour les jeunes :",["opportunité","menace","ennui"],0]]],
 w:["Écris 3 phrases avec « đối với », « về mặt », « theo ».",["đối với","về mặt","theo"],"Đối với tôi, gia đình rất quan trọng. Về mặt sức khỏe, tập thể dục rất tốt. Theo bác sĩ, nên ngủ đủ.","Pour moi, la famille est très importante. Sur le plan de la santé, le sport est excellent. Selon le médecin, il faut dormir assez."],
 s:["Donne ton avis à voix haute avec « đối với tôi ».",["đối với tôi","quan trọng","vì"],"Đối với tôi, học tiếng Việt rất quan trọng vì gia đình.","Pour moi apprendre le vietnamien est très important car il y a ma famille."]
});
S(31,{
 r:["Càng ngày càng khó","Càng học tiếng Việt, tôi càng thấy nó thú vị. Càng nói nhiều, tôi càng tự tin. Tuy nhiên, ngữ pháp ngày càng khó. Bạn tôi nhanh hơn tôi nhiều, và cậu ấy học cũng chăm hơn.","Plus j'étudie le vietnamien, plus je le trouve passionnant. Plus je parle, plus j'ai confiance. Cependant, la grammaire devient de plus en plus difficile. Mon ami est beaucoup plus rapide que moi et étudie aussi avec plus d'application.",
  [["Plus il parle :",["plus il a confiance","moins il comprend","plus il se fâche"],0],["Grammaire :",["de plus en plus difficile","facile","absente"],0],["Son ami :",["plus rapide","plus lent","absent"],0]]],
 l:["Xe cộ ngày càng đông. Càng đi xa, đường càng xấu. Giá nhà đắt hơn rất nhiều so với mười năm trước.","Il y a de plus en plus de véhicules. Plus on va loin, plus la route est mauvaise. Le prix des maisons est beaucoup plus élevé qu'il y a dix ans.",
  [["Véhicules :",["de plus en plus nombreux","de moins en moins","stables"],0],["Plus on va loin :",["pire la route","meilleure la route","plus court"],0],["Prix :",["beaucoup plus chers","moins chers","identiques"],0]]],
 w:["Écris 3 phrases avec « càng... càng... » et « ngày càng ».",["càng","ngày càng","hơn"],"Càng ăn càng ngon. Trời ngày càng nóng. Cuộc sống ở đây đắt hơn.","Plus on mange, meilleur c'est. Il fait de plus en plus chaud. La vie ici est plus chère."],
 s:["Exprime à voix haute une progression (« càng... càng... »).",["càng","càng","học"],"Càng học tôi càng thích.","Plus j'étudie, plus j'aime."]
});
S(32,{
 r:["Món ăn này, tôi rất thích","Món bánh xèo thì tôi rất thích. Còn món bún mắm, nói thật, tôi ăn không quen. Chuyện học tiếng Việt thì tôi đang cố gắng. Cái xe này thì má mua cho tôi từ năm ngoái.","Quant au bánh xèo, je l'adore. Quant au bún mắm, honnêtement, je n'y suis pas habitué. Quant à l'apprentissage du vietnamien, j'y travaille. Cette moto, ma mère me l'a achetée l'an dernier.",
  [["Il aime :",["le bánh xèo","le bún mắm","le phở"],0],["Bún mắm :",["il n'y est pas habitué","il l'adore","il le cuisine"],0],["La moto :",["offerte par la mère","vendue","volée"],0]]],
 l:["Cái áo này, tôi mua hôm qua. Còn anh ấy thì tính chuyện chuyển nhà. Bữa ăn tối nay, mình ăn ở ngoài nha.","Cette chemise, je l'ai achetée hier. Quant à lui, il envisage de déménager. Le dîner de ce soir, mangeons dehors, d'accord ?",
  [["La chemise :",["achetée hier","vendue","perdue"],0],["Lui :",["pense à déménager","est malade","voyage"],0],["Ce soir :",["dîner dehors","dîner à la maison","pas de dîner"],0]]],
 w:["Écris 3 phrases où le thème est placé en tête (Món này thì..., Chuyện ... thì...).",["thì","chuyện","món"],"Món này thì tôi thích. Chuyện công việc thì tôi lo. Cái nhà đó thì đắt quá.","Ce plat-là, je l'aime. Quant au travail, je m'en inquiète. Cette maison-là est trop chère."],
 s:["Parle à voix haute d'un plat en le plaçant en thème.",["thì","món","thích"],"Món cơm tấm thì tôi rất thích.","Le cơm tấm, je l'adore."]
});
S(33,{
 r:["Thành phố xanh","Dân số thành phố tăng nhanh khiến ô nhiễm không khí ngày càng nặng. Nhiều người dân đã chuyển sang dùng xe điện để bảo vệ môi trường. Chính quyền cũng khuyến khích trồng thêm cây xanh và hạn chế rác thải nhựa.","L'augmentation rapide de la population urbaine aggrave la pollution de l'air. Beaucoup d'habitants sont passés aux véhicules électriques pour protéger l'environnement. Les autorités encouragent aussi la plantation d'arbres et la limitation des déchets plastiques.",
  [["Problème :",["la pollution de l'air","le manque d'eau","le bruit"],0],["Solution individuelle :",["véhicules électriques","plus de motos","moins d'arbres"],0],["Les autorités :",["encouragent les arbres","ignorent","interdisent les arbres"],0]]],
 l:["Biến đổi khí hậu làm mực nước biển dâng cao. Nhiều vùng ở đồng bằng sông Cửu Long bị nhiễm mặn. Nông dân phải thay đổi cách trồng lúa.","Le changement climatique fait monter le niveau de la mer. De nombreuses zones du delta du Mékong sont touchées par la salinisation. Les paysans doivent changer leur façon de cultiver le riz.",
  [["Cause :",["changement climatique","guerre","fête"],0],["Zone touchée :",["delta du Mékong","Hà Nội","Huế"],0],["Réaction :",["changer les cultures","quitter le pays","rien"],0]]],
 w:["Donne ton avis sur un problème d'environnement en 3 phrases.",["môi trường","rác","theo tôi"],"Theo tôi, bảo vệ môi trường rất quan trọng. Chúng ta nên giảm rác nhựa. Mỗi người đều có trách nhiệm.","À mon avis, protéger l'environnement est très important. Nous devrions réduire le plastique. Chacun a une responsabilité."],
 s:["Propose une action à voix haute pour réduire les déchets.",["rác","giảm","nên"],"Chúng ta nên giảm rác nhựa.","Nous devrions réduire les déchets plastiques."]
});
S(34,{
 r:["Cuộc họp tổ dân phố","Tối qua tổ dân phố họp về vấn đề rác thải. Chính ông tổ trưởng đã đề xuất lập quỹ mua thùng rác. Do đó, mọi hộ gia đình sẽ đóng góp một khoản nhỏ. Càng nhiều người tham gia, hiệu quả càng cao.","Hier soir le comité de quartier s'est réuni sur la question des déchets. C'est le chef du comité qui a proposé de créer un fonds pour acheter des poubelles. En conséquence, chaque foyer contribuera pour une somme modique. Plus il y a de participants, plus l'efficacité est grande.",
  [["Sujet :",["les déchets","la sécurité","la fête"],0],["Proposition :",["un fonds pour des poubelles","une taxe élevée","un nouveau marché"],0],["Plus de participants :",["plus d'efficacité","moins d'efficacité","aucun effet"],0]]],
 l:["Theo báo cáo, ô nhiễm nguồn nước đang gia tăng. Vì vậy, chính quyền đề nghị người dân hạn chế xả rác. Càng sớm hành động, càng tốt.","Selon le rapport, la pollution de l'eau augmente. C'est pourquoi les autorités demandent aux habitants de limiter les rejets. Plus tôt on agit, mieux c'est.",
  [["Pollution :",["augmente","diminue","disparaît"],0],["Demande :",["limiter les déchets","fermer les usines","payer"],0],["Mieux :",["agir tôt","attendre","oublier"],0]]],
 w:["Écris une courte note de synthèse (formelle) sur un problème de ton quartier.",["theo","do đó","nhìn chung"],"Theo khảo sát, ô nhiễm tăng. Do đó, cần hành động. Nhìn chung, người dân ủng hộ.","Selon l'enquête, la pollution augmente. Il faut donc agir. Globalement, les habitants soutiennent."],
 s:["Résume à voix haute un problème et sa solution en deux phrases formelles.",["do đó","giải pháp","vấn đề"],"Vấn đề là rác nhiều. Do đó, cần giải pháp mới.","Le problème est qu'il y a trop de déchets. Donc il faut une nouvelle solution."]
});

S(35,{
 r:["Hai cách nói","Với bạn bè, tôi nói: « Mày đi đâu vậy? Tao đi chợ nè ». Nhưng với giám đốc, tôi phải nói: « Thưa anh, anh đi đâu ạ? Tôi đang đi chợ ». Cùng một ý nhưng cách xưng hô và giọng điệu hoàn toàn khác nhau. Việc chọn đúng cách nói thể hiện sự tôn trọng.","Avec des amis je dis : « Tu vas où ? Je vais au marché, tiens ». Mais avec le directeur je dois dire : « Monsieur, où allez-vous ? Je vais au marché ». Même sens, mais le choix des pronoms et du ton est complètement différent. Choisir la bonne manière de parler montre le respect.",
  [["Avec les amis :",["mày/tao","thưa/tôi","kính/quý vị"],0],["Avec le directeur :",["mày/tao","thưa anh/tôi","tao/mày"],1],["Choisir le bon registre montre :",["du respect","de la colère","de la fatigue"],0]]],
 l:["Thưa quý vị, hôm nay tôi xin phép trình bày. Còn khi ở nhà, tôi chỉ nói: « Ê, ăn cơm chưa? ». Mỗi hoàn cảnh có một cách nói riêng.","Mesdames et Messieurs, aujourd'hui je me permets de présenter. Alors que chez moi, je dis simplement : « Eh, t'as déjà mangé ? ». Chaque situation a sa manière de parler.",
  [["Cadre formel :",["thưa quý vị","ê","mày"],0],["À la maison :",["langage familier","langage soutenu","silence"],0],["Idée principale :",["adapter le registre","parler vite","parler fort"],0]]],
 w:["Écris la même demande de 2 façons : très familière et très polie.",["xin","cho","nha"],"Cho tao mượn cây viết nha. / Thưa anh, xin anh cho tôi mượn cây viết ạ.","Passe-moi ton stylo. / Monsieur, puis-je vous emprunter votre stylo, je vous prie ?"],
 s:["Dis à voix haute la même phrase à un ami puis à un supérieur (ex : « Tu veux du café ? »).",["anh","có muốn","cà phê"],"Mày uống cà phê hông? / Thưa anh, anh có muốn dùng cà phê không ạ?","Tu veux du café ? / Monsieur, désirez-vous un café ?"]
});
S(36,{
 r:["Bài học của ông nội","Ông nội thường nói: « Có công mài sắt, có ngày nên kim ». Ông bảo tôi đừng nản lòng khi gặp khó khăn. Khi tôi thi rớt, ông nhắc: « Thất bại là mẹ thành công ». Câu nói đó đã theo tôi suốt nhiều năm.","Mon grand-père disait souvent : « À force de limer le fer, un jour on obtient une aiguille ». Il me disait de ne pas me décourager face aux difficultés. Quand j'ai échoué à un examen, il m'a rappelé : « L'échec est la mère du succès ». Cette phrase m'accompagne depuis des années.",
  [["Que dit le proverbe du grand-père ?",["la persévérance paie","l'argent fait tout","il faut dormir"],0],["Quand l'a-t-il rappelé ?",["après un échec","à un mariage","lors d'un voyage"],0],["« Thất bại là mẹ thành công » :",["l'échec mène au succès","l'échec est la fin","le succès est facile"],0]]],
 l:["Mẹ tôi hay nói: « Lá lành đùm lá rách ». Khi hàng xóm gặp khó khăn, cả xóm cùng giúp. Đó là tinh thần tương thân tương ái.","Ma mère dit souvent : « Les feuilles intactes protègent les déchirées ». Quand un voisin a des difficultés, tout le quartier l'aide. C'est l'esprit d'entraide.",
  [["Valeur transmise :",["solidarité","compétition","richesse"],0],["Quand aide-t-on ?",["quand quelqu'un est en difficulté","jamais","seulement à Tết"],0],["Qui aide ?",["tout le quartier","un seul voisin","l'État"],0]]],
 w:["Choisis un proverbe vietnamien et explique-le en 2 phrases.",["câu","nghĩa là","biết ơn"],"Câu « Uống nước nhớ nguồn » nghĩa là phải biết ơn người đi trước.","Le proverbe « Uống nước nhớ nguồn » signifie qu'il faut être reconnaissant envers ses prédécesseurs."],
 s:["Cite à voix haute un proverbe et dis ce qu'il signifie.",["câu","nghĩa là","ông bà"],"Ông bà ta có câu « Lá lành đùm lá rách », nghĩa là phải giúp đỡ nhau.","Nos ancêtres disent « Lá lành đùm lá rách », ce qui signifie qu'il faut s'entraider."]
});
S(37,{
 r:["Khi nào thì đi?","Nếu ngày mai trời không mưa, thì chúng tôi sẽ đi Đà Lạt. Còn nếu mưa lớn, thì chúng tôi sẽ ở lại Sài Gòn, bởi vì đường đèo rất nguy hiểm. Ba tôi nói rằng an toàn quan trọng hơn bất cứ điều gì.","Si demain il ne pleut pas, nous irons à Đà Lạt. Mais s'il pleut fort, nous resterons à Saigon, car la route de col est très dangereuse. Mon père dit que la sécurité compte plus que tout.",
  [["Condition pour partir :",["pas de pluie","du soleil seulement","un ami"],0],["S'il pleut fort :",["ils restent","ils partent quand même","ils annulent tout"],0],["Priorité du père :",["la sécurité","la vitesse","le budget"],0]]],
 l:["Người mà tôi gặp hôm qua là bác sĩ làm ở bệnh viện mà tôi từng đến. Bác kể rằng nơi bác làm việc rất bận, bởi vì dân số tăng nhanh.","La personne que j'ai rencontrée hier est un médecin qui travaille à l'hôpital où j'étais déjà allé. Il raconte que son lieu de travail est très chargé car la population augmente vite.",
  [["La personne rencontrée :",["un médecin","un enseignant","un chauffeur"],0],["Hôpital :",["très chargé","vide","fermé"],0],["Raison :",["la population augmente","la maladie","la pluie"],0]]],
 w:["Écris une phrase complexe avec une relative (mà) et une cause (bởi vì).",["mà","bởi vì"],"Người mà tôi gặp hôm qua rất tốt bụng, bởi vì anh ấy giúp tôi miễn phí.","La personne que j'ai rencontrée hier est très gentille, car elle m'a aidé gratuitement."],
 s:["Fais une phrase à voix haute avec une condition et une conséquence.",["nếu","thì","sẽ"],"Nếu mai trời đẹp thì tôi sẽ đi biển.","S'il fait beau demain, j'irai à la plage."]
});
S(38,{
 r:["Bài báo hôm nay","Cây cầu mới được khánh thành vào sáng nay. Nhiều người dân bị kẹt xe vì đường bị đóng. Chính nhờ cây cầu ấy mà thời gian đi lại được rút ngắn. Chưa bao giờ thành phố có công trình lớn như vậy.","Le nouveau pont a été inauguré ce matin. De nombreux habitants ont été bloqués dans les embouteillages car la route était fermée. C'est grâce à ce pont que le temps de trajet est raccourci. Jamais la ville n'avait eu un ouvrage aussi grand.",
  [["Que s'est-il passé ce matin ?",["un pont a été inauguré","une rue a été fermée définitivement","un marché a ouvert"],0],["Avantage du pont :",["trajet raccourci","plus de pollution","moins de voitures"],0],["« Chưa bao giờ... như vậy » :",["jamais auparavant","toujours","parfois"],0]]],
 l:["Anh bị phạt vì chạy quá tốc độ. Tiền phạt được nộp tại kho bạc. Không bao giờ tôi lặp lại sai lầm ấy.","Il a reçu une amende pour excès de vitesse. L'amende est payée au trésor. Jamais je ne referai cette erreur.",
  [["Raison de l'amende :",["excès de vitesse","stationnement","accident"],0],["Paiement :",["au trésor","en ligne","au marché"],0],["Conclusion :",["il ne recommencera plus","il recommencera","il s'en fiche"],0]]],
 w:["Écris 2 phrases passives (bị / được) et 1 phrase avec inversion emphatique (« Chưa bao giờ... »).",["bị","được","chưa bao giờ"],"Tôi bị phạt vì đi sai đường. Tôi được khen vì làm tốt. Chưa bao giờ tôi thấy vui như hôm nay.","J'ai eu une amende pour être passé par le mauvais chemin. J'ai été félicité pour mon bon travail. Jamais je n'ai été aussi heureux qu'aujourd'hui."],
 s:["Dis à voix haute une phrase avec « chưa bao giờ ».",["chưa bao giờ","tôi","thấy"],"Chưa bao giờ tôi thấy món này ngon như vậy.","Jamais je n'ai trouvé ce plat aussi bon."]
});
S(39,{
 r:["Nên hay không nên?","Nhiều người cho rằng trẻ em nên dùng điện thoại sớm. Tuy nhiên, theo tôi, điều đó có nhiều bất lợi. Thứ nhất, trẻ dễ mất tập trung. Thứ hai, thời gian vận động giảm. Do đó, cha mẹ cần giám sát chặt chẽ.","Beaucoup pensent que les enfants devraient utiliser un téléphone tôt. Cependant, à mon avis, cela présente beaucoup d'inconvénients. Premièrement, l'enfant perd facilement sa concentration. Deuxièmement, le temps d'activité physique diminue. Par conséquent, les parents doivent surveiller de près.",
  [["Opinion de l'auteur :",["défavorable","favorable","neutre"],0],["Premier argument :",["perte de concentration","argent","santé"],0],["Conclusion :",["il faut surveiller","il faut interdire","il faut offrir"],0]]],
 l:["Một mặt, du lịch giúp phát triển kinh tế. Mặt khác, nó gây ô nhiễm môi trường. Vì vậy, cần có sự cân bằng giữa lợi ích và hậu quả.","D'une part, le tourisme développe l'économie. D'autre part, il pollue l'environnement. C'est pourquoi il faut un équilibre entre avantages et conséquences.",
  [["Avantage du tourisme :",["économie","silence","pollution"],0],["Inconvénient :",["pollution","chômage","guerre"],0],["Conclusion :",["équilibre","interdire","ignorer"],0]]],
 w:["Écris un mini-argumentaire (3 phrases) avec « một mặt... mặt khác... » et « do đó ».",["một mặt","mặt khác","do đó"],"Một mặt, xe máy tiện lợi. Mặt khác, nó gây ô nhiễm. Do đó, nên phát triển xe buýt.","D'une part la moto est pratique. D'autre part elle pollue. Donc il faut développer les bus."],
 s:["Donne ton avis à voix haute sur un sujet avec « thứ nhất » et « thứ hai ».",["thứ nhất","thứ hai","theo tôi"],"Theo tôi, nên học ngoại ngữ. Thứ nhất, mở rộng cơ hội. Thứ hai, hiểu thêm văn hóa.","À mon avis, il faut apprendre des langues. Premièrement, cela ouvre des opportunités. Deuxièmement, cela fait comprendre d'autres cultures."]
});
S(40,{
 r:["Thương người như thể thương thân","Bà tôi sống giản dị nhưng rất rộng lượng. Bà thường nói « thương người như thể thương thân ». Khi hàng xóm có tang, bà nấu cơm, mang sang giúp. Với bà, lòng tốt như ngọn đèn: càng chia sẻ càng sáng.","Ma grand-mère vit simplement mais est très généreuse. Elle dit souvent « aime les autres comme toi-même ». Quand un voisin est en deuil, elle cuisine et apporte le repas. Pour elle, la bonté est comme une lampe : plus on la partage, plus elle brille.",
  [["Caractère de la grand-mère :",["généreuse","avare","colérique"],0],["Elle aide :",["les voisins en deuil","les touristes","les enfants"],0],["Métaphore :",["la bonté est une lampe","la bonté est un fleuve","la bonté est un mur"],0]]],
 l:["Cuộc đời như dòng sông, lúc êm đềm, lúc dữ dội. Người khôn biết bơi theo dòng nước. Người dại chống lại dòng chảy.","La vie est comme un fleuve, tantôt paisible tantôt violent. Le sage sait nager avec le courant. L'insensé lutte contre le courant.",
  [["La vie est comparée à :",["un fleuve","une montagne","une route"],0],["Le sage :",["suit le courant","résiste","s'enfuit"],0],["Morale :",["s'adapter","lutter toujours","fuir"],0]]],
 w:["Invente une métaphore (« X là Y ») pour décrire quelque chose que tu aimes.",["là","như","sông"],"Tiếng Việt là một con sông, càng đi càng sâu. Học tiếng Việt như leo núi.","Le vietnamien est un fleuve, plus on avance plus c'est profond. Apprendre le vietnamien, c'est comme escalader une montagne."],
 s:["Dis à voix haute une comparaison avec « như » pour décrire ton quartier.",["như","khu","tôi"],"Khu tôi sống yên tĩnh như một ngôi làng nhỏ.","Mon quartier est calme comme un petit village."]
});
S(41,{
 r:["Tết ở miền Nam","Tết ở miền Nam, nhà nào cũng có mai vàng và bánh tét. Gia đình sum họp, con cháu chúc Tết ông bà và được lì xì. Mâm cúng gồm thịt kho tàu, canh khổ qua và dưa hành. Những ngày đầu năm, mọi người kiêng quét nhà để giữ lộc.","Au Têt dans le Sud, chaque maison a des branches de mai jaune et du bánh tét. La famille se réunit, les petits-enfants présentent leurs vœux aux grands-parents et reçoivent des enveloppes rouges. Le plateau d'offrandes comprend du porc caramélisé aux œufs, de la soupe de margose et des oignons marinés. Les premiers jours de l'année, on évite de balayer pour garder la chance.",
  [["Fleur typique du Sud :",["mai vàng","hoa đào","lotus"],0],["Qui reçoit des lì xì ?",["les enfants","les grands-parents","les voisins"],0],["Interdit les premiers jours :",["balayer","manger","sortir"],0]]],
 l:["Trung thu là Tết của thiếu nhi. Trẻ em rước đèn lồng, ăn bánh trung thu và xem múa lân. Rằm tháng tám trăng tròn và sáng nhất.","La fête de la mi-automne est la fête des enfants. Les enfants portent des lanternes, mangent des gâteaux de lune et regardent la danse du lion. À la pleine lune du 8e mois, la lune est ronde et lumineuse.",
  [["Fête des enfants :",["Trung thu","Tết","Giỗ"],0],["Activité :",["lanternes et gâteaux","pêche","pique-nique à la mer"],0],["La lune :",["ronde et lumineuse","absente","rouge"],0]]],
 w:["Décris une fête vietnamienne que tu connais en 3 phrases.",["Tết","gia đình","ăn"],"Tết là dịp gia đình sum họp. Mọi người ăn bánh chưng và chúc nhau. Trẻ em được lì xì.","Le Têt est l'occasion de réunir la famille. Tout le monde mange du bánh chưng et échange des vœux. Les enfants reçoivent des lì xì."],
 s:["Souhaite la bonne année à voix haute à un aîné.",["chúc","năm mới","ông bà"],"Con chúc ông bà năm mới sức khỏe và hạnh phúc.","Je souhaite à mes grands-parents une bonne année, santé et bonheur."]
});
S(42,{
 r:["Một buổi tranh luận","Trong buổi tranh luận, chị Hà cho rằng việc làm thêm giúp sinh viên trưởng thành. Ngược lại, anh Tuấn nhận định học tập mới là ưu tiên. Dù ý kiến khác nhau, cả hai đều tôn trọng người nghe. Cuối cùng, họ đồng ý rằng cần có sự cân bằng.","Lors du débat, chị Hà estime que le travail à temps partiel aide les étudiants à mûrir. À l'inverse, anh Tuấn juge que les études sont la priorité. Bien que leurs avis diffèrent, les deux respectent l'auditoire. Finalement, ils s'accordent sur la nécessité d'un équilibre.",
  [["Opinion de Hà :",["le travail aide à mûrir","les études d'abord","il faut dormir"],0],["Opinion de Tuấn :",["les études d'abord","le travail d'abord","aucun avis"],0],["Conclusion :",["équilibre","victoire de Hà","victoire de Tuấn"],0]]],
 l:["Nếu không có chiến dịch này, rác thải sẽ nhiều hơn. Chính người dân đã góp sức làm sạch sông. Tuy mệt nhưng ai cũng tự hào.","Sans cette campagne, il y aurait plus de déchets. Ce sont les habitants qui ont contribué à nettoyer le fleuve. Bien que fatigués, tous sont fiers.",
  [["Sans la campagne :",["plus de déchets","moins de déchets","aucun changement"],0],["Qui a nettoyé ?",["les habitants","l'armée","les touristes"],0],["Sentiment :",["fierté","regret","colère"],0]]],
 w:["Écris un court paragraphe d'opinion avec concession et conclusion.",["tuy","do đó","theo tôi"],"Theo tôi, học online rất tiện. Tuy nhiên, nó thiếu tương tác. Do đó, nên kết hợp cả hai.","À mon avis, l'apprentissage en ligne est pratique. Cependant il manque d'interaction. Il faut donc combiner les deux."],
 s:["Défends à voix haute un avis en 3 phrases (opinion, concession, conclusion).",["theo tôi","tuy","do đó"],"Theo tôi, đi bộ tốt cho sức khỏe. Tuy hơi chậm. Do đó nên đi bộ mỗi ngày.","À mon avis, marcher est bon pour la santé. Bien que ce soit un peu lent. Donc il faut marcher chaque jour."]
});

S(43,{
 r:["Hình như trời sắp mưa","Hình như trời sắp mưa, chắc tôi nên mang dù. Bà tôi bảo: « Mưa đấy chứ, mây đen kéo tới rồi ». Tôi cười, vì bà luôn đoán đúng thời tiết. Đúng là « kinh nghiệm hơn lý thuyết ».","Il semble qu'il va pleuvoir, je ferais mieux d'emporter un parapluie. Ma grand-mère dit : « Mais si, il va pleuvoir, les nuages noirs arrivent ». Je souris car elle devine toujours bien le temps. C'est vrai que « l'expérience vaut mieux que la théorie ».",
  [["Qui prévoit la pluie ?",["la grand-mère","le narrateur seul","la radio"],0],["« Hình như » exprime :",["une incertitude","une certitude","un ordre"],0],["Conclusion :",["l'expérience vaut la théorie","la théorie est fausse","la pluie est rare"],0]]],
 l:["Chắc anh ấy đến muộn. Cơ mà tôi vẫn tin anh sẽ đến. Hình như anh ấy bị kẹt xe.","Il sera sans doute en retard. Mais je crois qu'il viendra quand même. Il semble qu'il soit coincé dans les embouteillages.",
  [["Hypothèse :",["il est en retard","il est absent","il est malade"],0],["Confiance :",["il viendra","il ne viendra pas","il a oublié"],0],["Cause :",["embouteillages","pluie","panne"],0]]],
 w:["Écris 3 phrases avec « chắc », « hình như » et « cơ mà ».",["chắc","hình như","cơ mà"],"Chắc trời sắp mưa. Hình như anh ấy không khỏe. Tôi muốn đi, cơ mà trời mưa.","Il va sûrement pleuvoir. Il semble qu'il ne va pas bien. Je voudrais y aller, mais il pleut."],
 s:["Exprime à voix haute une hypothèse prudente sur la météo ou un ami.",["hình như","chắc","trời"],"Hình như trời sắp mưa. Chắc tôi nên mang dù.","Il semble qu'il va pleuvoir. Je devrais sans doute prendre un parapluie."]
});
S(44,{
 r:["Giáo dục và gia đình","Phụ huynh đóng vai trò quan trọng trong giáo dục. Chính phủ khuyến khích học sinh nghiên cứu khoa học từ sớm. Trường học không chỉ truyền đạt kiến thức mà còn rèn luyện nhân cách. Do đó, sự phối hợp giữa gia đình và nhà trường rất cần thiết.","Les parents jouent un rôle important dans l'éducation. Le gouvernement encourage les élèves à faire de la recherche scientifique dès le plus jeune âge. L'école ne transmet pas seulement des connaissances mais forme aussi le caractère. Par conséquent, la coordination entre famille et école est indispensable.",
  [["« Phụ huynh » désigne :",["les parents d'élèves","les enseignants","les élèves"],0],["Rôle de l'école :",["connaissances et caractère","seulement connaissances","seulement sport"],0],["Conclusion :",["coordination nécessaire","séparation","aucun rôle"],0]]],
 l:["Chính sách giáo dục mới nhằm nâng cao chất lượng. Các nhà nghiên cứu đề xuất cải cách chương trình. Giáo viên cần được đào tạo thêm.","La nouvelle politique éducative vise à améliorer la qualité. Les chercheurs proposent une réforme du programme. Les enseignants doivent être davantage formés.",
  [["Objectif :",["améliorer la qualité","réduire le budget","fermer des écoles"],0],["Les chercheurs proposent :",["une réforme du programme","des vacances","des taxes"],0],["Enseignants :",["plus de formation","moins de salaire","aucun changement"],0]]],
 w:["Écris 3 phrases formelles avec des mots Hán Việt (giáo dục, chính phủ, nghiên cứu).",["giáo dục","chính phủ","nghiên cứu"],"Giáo dục là nền tảng của xã hội. Chính phủ đầu tư nhiều cho nghiên cứu. Người dân ủng hộ chính sách này.","L'éducation est le fondement de la société. Le gouvernement investit beaucoup dans la recherche. Les habitants soutiennent cette politique."],
 s:["Présente oralement l'importance de l'éducation en 2 phrases formelles.",["giáo dục","quan trọng","xã hội"],"Giáo dục rất quan trọng đối với xã hội.","L'éducation est très importante pour la société."]
});
S(45,{
 r:["Chợ nổi Cái Răng","Chợ nổi Cái Răng là nét văn hóa truyền thống của miền Tây. Từ sáng sớm, hàng trăm chiếc ghe tụ họp để mua bán trái cây và nông sản. Người bán treo sản phẩm lên cây sào để khách dễ nhìn. Tuy nhiên, các chợ nổi đang dần thu hẹp vì cầu và đường bộ phát triển.","Le marché flottant de Cái Răng est un trait de la culture traditionnelle de l'Ouest. Dès l'aube, des centaines de barques se rassemblent pour vendre fruits et produits agricoles. Les vendeurs accrochent leurs produits à une perche pour qu'ils soient visibles. Cependant, les marchés flottants diminuent à mesure que les ponts et routes se développent.",
  [["Où se trouve le marché ?",["dans l'Ouest (delta)","au Nord","dans les montagnes"],0],["Comment montre-t-on les produits ?",["à une perche","sur des tables","en vitrine"],0],["Pourquoi diminue-t-il ?",["développement des routes","pollution","guerre"],0]]],
 l:["Tuổi thơ tôi gắn liền với dòng sông. Mỗi sáng, ba chèo xuồng đưa tôi đi học. Giờ đây, nhiều con kênh đã bị lấp, tôi cảm thấy tiếc nuối.","Mon enfance est liée au fleuve. Chaque matin, papa ramait pour m'emmener à l'école. Aujourd'hui, beaucoup de canaux ont été comblés, j'éprouve de la nostalgie.",
  [["Moyen de transport :",["pirogue","moto","bus"],0],["Évolution :",["canaux comblés","plus d'eau","plus de poissons"],0],["Sentiment :",["nostalgie","joie","colère"],0]]],
 w:["Résume en 3 phrases un lieu traditionnel que tu aimerais visiter.",["truyền thống","tôi","muốn"],"Tôi muốn đi chợ nổi Cái Răng. Đó là nét truyền thống của miền Tây. Tôi sẽ ăn hủ tiếu trên ghe.","Je voudrais aller au marché flottant de Cái Răng. C'est une tradition de l'Ouest. Je mangerai du hủ tiếu sur la barque."],
 s:["Décris à voix haute un marché flottant ou un lieu traditionnel.",["truyền thống","chợ","miền tây"],"Chợ nổi là nét văn hóa truyền thống của miền Tây.","Le marché flottant est un trait culturel traditionnel de l'Ouest."]
});
S(46,{
 r:["Siêu thị và đa dạng sản phẩm","Siêu thị là nơi bán đa dạng sản phẩm. Quá trình công nghiệp hóa và hiện đại hóa đã làm thay đổi cách mua sắm. Nhiều tác giả cho rằng người tiêu dùng ngày càng khó tính. Phi thương mại hóa các dịch vụ công vẫn còn gây tranh cãi.","Le supermarché est un lieu qui vend des produits variés. Le processus d'industrialisation et de modernisation a changé la manière de faire ses achats. De nombreux auteurs pensent que les consommateurs sont de plus en plus exigeants. La non-commercialisation des services publics fait encore débat.",
  [["Supermarché :",["produits variés","un marché flottant","une école"],0],["Les consommateurs :",["plus exigeants","moins exigeants","absents"],0],["Sujet encore débattu :",["la non-commercialisation des services publics","la météo","le sport"],0]]],
 l:["Vô nghĩa không có nghĩa là vô ích. Bất công là điều xã hội cần giải quyết. Các nhà khoa học phi lợi nhuận đã đóng góp rất nhiều.","« Vô nghĩa » ne veut pas dire « inutile ». L'injustice est un problème que la société doit résoudre. Les scientifiques à but non lucratif ont beaucoup contribué.",
  [["« Vô nghĩa » :",["sans sens","inutile","exact"],0],["À résoudre :",["l'injustice","le froid","la fête"],0],["Les scientifiques :",["à but non lucratif","commerciaux","militaires"],0]]],
 w:["Forme 3 mots avec les affixes Hán Việt : vô-, bất-, phi-, -hóa, -giả.",["vô","bất","hóa"],"Vô nghĩa, bất công, hiện đại hóa. Đó là ba từ tôi vừa học.","Vô nghĩa, bất công, hiện đại hóa. Ce sont trois mots que je viens d'apprendre."],
 s:["Dis à voix haute 2 mots avec « -hóa » et leur sens.",["hóa","đô thị","công nghiệp"],"Đô thị hóa là quá trình thành phố mở rộng. Công nghiệp hóa là phát triển công nghiệp.","L'urbanisation est l'extension des villes. L'industrialisation est le développement industriel."]
});
S(47,{
 r:["Một đoạn lục bát","Trăng lên soi bóng dòng sông, / Thuyền ai lặng lẽ giữa dòng sương mơ. / Nàng ngồi đợi bến đò xưa, / Chàng đi biền biệt, bao giờ trở về? (Đoạn thơ lục bát minh họa, sáng tác cho bài học.)","La lune se lève et se reflète dans le fleuve, / une barque glisse silencieuse dans la brume rêveuse. / Elle attend l'ancien embarcadère, / lui est parti sans retour, quand reviendra-t-il ? (Extrait de poésie lục bát inventé pour la leçon.)",
  [["Mètre du poème :",["lục bát (6/8)","haïku","sonnet"],0],["Sentiment :",["attente / nostalgie","joie","colère"],0],["« Nàng / chàng » :",["elle / lui (littéraire)","moi / toi","eux / nous"],0]]],
 l:["Chàng đi xa, nàng ở lại. Dòng sông chảy mãi không ngừng. Biết bao giờ họ gặp lại nhau.","Lui est parti loin, elle est restée. Le fleuve coule sans cesse. Qui sait quand ils se reverront.",
  [["Qui reste ?",["elle","lui","personne"],0],["Le fleuve :",["coule sans cesse","est sec","est gelé"],0],["Ton :",["mélancolique","joyeux","comique"],0]]],
 w:["Écris 2 vers inspirés du lục bát (6 puis 8 syllabes) sur un fleuve ou une barque.",["sông","thuyền","trăng"],"Thuyền trôi trên dòng sông xa, / Trăng soi bóng nước, mẹ già đợi con.","La barque glisse sur le fleuve lointain, / la lune éclaire l'eau, la vieille mère attend son enfant."],
 s:["Lis à voix haute les deux vers du modèle en respectant le rythme.",["sông","trăng","thuyền"],"Thuyền trôi trên dòng sông xa, trăng soi bóng nước, mẹ già đợi con.","La barque glisse sur le fleuve lointain, la lune éclaire l'eau, la vieille mère attend son enfant."]
});
S(48,{
 r:["Tin kinh tế","Theo số liệu công bố, tổng sản phẩm quốc nội tăng 6,2% trong quý ba. Đáng chú ý, xuất khẩu nông sản đạt mức cao nhất từ đầu năm. Các chuyên gia đề xuất triển khai thêm chính sách hỗ trợ doanh nghiệp nhỏ. Tuy nhiên, lạm phát vẫn là mối quan ngại.","Selon les chiffres publiés, le produit intérieur brut a augmenté de 6,2 % au troisième trimestre. Fait notable, les exportations agricoles ont atteint leur plus haut niveau depuis le début de l'année. Les experts proposent de déployer de nouvelles mesures d'aide aux petites entreprises. Cependant, l'inflation reste une préoccupation.",
  [["Croissance :",["6,2 %","2,6 %","12 %"],0],["Record :",["exportations agricoles","importations","salaires"],0],["Préoccupation :",["l'inflation","le chômage","le climat"],0]]],
 l:["Chính quyền công bố kế hoạch xây dựng tuyến đường mới. Dự kiến công trình hoàn thành vào năm sau. Người dân hy vọng giao thông sẽ cải thiện.","Les autorités annoncent un plan de construction d'une nouvelle route. L'ouvrage devrait être achevé l'an prochain. Les habitants espèrent une amélioration de la circulation.",
  [["Annonce :",["nouvelle route","fermeture d'école","fête"],0],["Achèvement :",["l'an prochain","demain","dans 10 ans"],0],["Espoir :",["meilleure circulation","plus de taxes","plus de bruit"],0]]],
 w:["Rédige 3 phrases dans le style journalistique (theo..., cho biết..., đáng chú ý).",["theo","cho biết","đáng chú ý"],"Theo Bộ Giao thông, tuyến đường mới sẽ hoàn thành năm sau. Đáng chú ý, chi phí giảm 10%. Ông A cho biết kế hoạch đang đúng tiến độ.","Selon le ministère des Transports, la nouvelle route sera achevée l'an prochain. À noter, les coûts ont baissé de 10 %. M. A indique que le plan avance comme prévu."],
 s:["Présente oralement une brève nouvelle avec « theo... ».",["theo","cho biết","tăng"],"Theo số liệu mới, giá xăng tăng 3%. Chuyên gia cho biết sẽ ổn định.","Selon les nouveaux chiffres, le prix de l'essence a augmenté de 3 %. Les experts indiquent qu'il se stabilisera."]

S(49,{
 r:["Nghiên cứu học thuật","Trong nghiên cứu học thuật, người viết phải trích dẫn nguồn rõ ràng. Phương pháp nghiên cứu thường gồm khảo sát, phỏng vấn và phân tích dữ liệu. Kết quả được trình bày trong bảng và biểu đồ. Sau cùng, tác giả đưa ra kết luận và kiến nghị.","Dans la recherche académique, l'auteur doit citer clairement ses sources. La méthode comprend souvent enquêtes, entretiens et analyse de données. Les résultats sont présentés dans des tableaux et graphiques. Enfin, l'auteur formule conclusions et recommandations.",
  [["Obligation :",["citer les sources","copier","ignorer"],0],["Méthodes :",["enquêtes, entretiens, analyses","dessins","chansons"],0],["Fin du travail :",["conclusion et recommandations","remerciements","publicité"],0]]],
 l:["Giả thuyết nghiên cứu cần được kiểm chứng. Dữ liệu thu thập qua phỏng vấn sâu. Kết quả cho thấy sự khác biệt đáng kể giữa hai nhóm.","L'hypothèse de recherche doit être vérifiée. Les données sont recueillies par entretiens approfondis. Les résultats montrent une différence notable entre deux groupes.",
  [["L'hypothèse :",["doit être vérifiée","est certaine","est inutile"],0],["Données :",["entretiens approfondis","questionnaires seuls","images"],0],["Résultat :",["différence notable","aucune différence","erreur"],0]]],
 w:["Écris 3 phrases dans le style académique (nghiên cứu, kết quả, kết luận).",["nghiên cứu","kết quả","kết luận"],"Nghiên cứu này tập trung vào giáo dục. Kết quả cho thấy sự cải thiện. Kết luận, cần thêm dữ liệu.","Cette étude porte sur l'éducation. Les résultats montrent une amélioration. En conclusion, il faut plus de données."],
 s:["Présente oralement l'objectif d'une étude en une phrase académique.",["nghiên cứu","nhằm","giáo dục"],"Nghiên cứu này nhằm tìm hiểu tác động của giáo dục.","Cette étude vise à comprendre l'impact de l'éducation."]
});
S(50,{
 r:["Bản tin cuối ngày","Theo bản tin cuối ngày, chính phủ đã công bố chính sách giáo dục mới. Phụ huynh bày tỏ sự ủng hộ, tuy nhiên một số chuyên gia vẫn còn băn khoăn. Hình như phản ứng của dư luận sẽ còn kéo dài. Đáng chú ý, chiến dịch này được triển khai trên toàn quốc.","D'après le journal du soir, le gouvernement a annoncé une nouvelle politique éducative. Les parents expriment leur soutien, cependant certains experts ont encore des réserves. Il semble que la réaction de l'opinion publique va durer. À noter, cette campagne est déployée dans tout le pays.",
  [["Annonce :",["nouvelle politique éducative","réforme fiscale","fête nationale"],0],["Réaction des parents :",["soutien","refus","indifférence"],0],["Déploiement :",["dans tout le pays","à Saigon seulement","nulle part"],0]]],
 l:["Chắc nhiều người sẽ phản đối. Cơ mà tôi tin chính sách này sẽ có tác động tích cực. Xét về lâu dài, nó góp phần nâng cao chất lượng giáo dục.","Beaucoup s'y opposeront sans doute. Mais je crois que cette politique aura un impact positif. À long terme, elle contribue à améliorer la qualité de l'éducation.",
  [["Hypothèse :",["beaucoup s'opposeront","tous approuveront","personne ne sait"],0],["Impact :",["positif","négatif","nul"],0],["À long terme :",["amélioration de l'éducation","baisse des salaires","pollution"],0]]],
 w:["Écris un court résumé d'une actualité avec une nuance (chắc, hình như) et un connecteur (do đó).",["chắc","hình như","do đó"],"Hình như giá nhà sẽ tăng. Chắc nhiều người khó mua. Do đó, cần chính sách hỗ trợ.","Il semble que le prix des maisons va monter. Beaucoup auront sans doute du mal à acheter. Il faut donc des aides."],
 s:["Commente oralement une actualité avec une nuance d'incertitude.",["hình như","chắc","giá"],"Hình như giá xăng sẽ giảm. Chắc nhiều người vui.","Il semble que le prix de l'essence va baisser. Beaucoup seront sans doute contents."]
});

S(51,{
 r:["Mua nhà : nên hay không nên?","Tuy giá căn hộ khá cao, nhưng vợ chồng anh Dũng vẫn quyết định mua. Dù lãi suất có tăng đến đâu, họ cũng sẽ cố trả nợ đúng hạn. Chỉ có điều, nếu thu nhập giảm thì sẽ rất khó khăn. Chị Lan thì bình tĩnh hơn: miễn là cả hai còn việc làm ổn định thì không sao. Trừ phi công ty phá sản, họ vẫn yên tâm.","Bien que le prix de l'appartement soit élevé, le couple de Dũng décide d'acheter. Même si les taux d'intérêt montent, ils feront tout pour rembourser à temps. Seul problème, si les revenus baissent ce sera difficile. Chị Lan est plus sereine : du moment que les deux ont un emploi stable, ça ira. À moins que l'entreprise ne fasse faillite, ils restent confiants.",
  [["Pourquoi achètent-ils malgré le prix ?",["ils sont confiants","ils sont forcés","ils héritent"],0],["Risque évoqué :",["baisse des revenus","incendie","pluie"],0],["Condition posée par Lan :",["emploi stable","un prêt gratuit","un déménagement"],0]]],
 l:["Dù trời mưa, buổi lễ vẫn diễn ra như dự định. Tuy vậy, số người tham dự ít hơn mọi năm. Bất kể ai đến, ban tổ chức cũng đón tiếp chu đáo. Trừ phi bão lớn, họ sẽ không hủy sự kiện.","Malgré la pluie, la cérémonie a eu lieu comme prévu. Cependant, il y avait moins de monde que d'habitude. Peu importe qui venait, les organisateurs accueillaient chacun avec soin. À moins d'une grosse tempête, ils n'annuleraient pas l'événement.",
  [["La cérémonie :",["a eu lieu","a été annulée","a été reportée"],0],["Participants :",["moins nombreux","plus nombreux","absents"],0],["Annulation seulement si :",["grosse tempête","pluie légère","manque d'argent"],0]]],
 w:["Écris un petit texte (4 phrases) pesant le pour et le contre d'un projet avec « tuy », « dù », « miễn là », « trừ phi ».",["tuy","dù","miễn là","trừ phi"],"Tuy dự án khá tốn kém, tôi vẫn muốn thử. Dù khó khăn đến đâu, tôi cũng sẽ cố gắng. Miễn là có người ủng hộ thì tôi sẽ làm tiếp. Trừ phi hết vốn, tôi không bỏ cuộc.","Bien que le projet coûte cher, je veux essayer. Même si c'est difficile, je ferai de mon mieux. Du moment que j'ai du soutien, je continuerai. À moins de manquer de fonds, je n'abandonnerai pas."],
 s:["Explique à voix haute ta décision de déménager (ou voyager) en combinant concession et condition.",["tuy","miễn là","tôi"],"Tuy xa gia đình, tôi vẫn muốn đi. Miễn là có việc làm tốt thì tôi sẽ ở lại.","Bien qu'éloigné de ma famille, je veux partir. Du moment que j'ai un bon travail, je resterai."]
});
S(52,{
 r:["Ý kiến về làm việc từ xa","Theo tôi nghĩ, làm việc từ xa mang lại nhiều lợi ích. Không phủ nhận rằng nó giúp tiết kiệm thời gian, song xét cho cùng, nó cũng khiến nhân viên dễ bị cô lập. Ở một mức độ nào đó, giao tiếp trực tiếp vẫn không thể thay thế. Vì vậy, nhiều công ty chọn mô hình kết hợp. Tôi đồng tình với cách làm này, tuy chưa hẳn đã hoàn hảo.","À mon avis, le télétravail apporte beaucoup d'avantages. On ne peut nier qu'il fait gagner du temps, mais en fin de compte, il isole aussi les employés. Dans une certaine mesure, la communication en présentiel reste irremplaçable. C'est pourquoi de nombreuses entreprises choisissent un modèle hybride. Je suis d'accord avec cette approche, bien qu'elle ne soit pas forcément parfaite.",
  [["Avantage reconnu :",["gain de temps","salaire plus élevé","moins de réunions"],0],["Inconvénient :",["isolement","coûts","retards"],0],["Position finale :",["approbation du modèle hybride","refus total","indifférence"],0]]],
 l:["Tôi hiểu ý anh, nhưng chưa hẳn đúng. Ý kiến đó có phần cực đoan. Nói thẳng ra, tôi không đồng tình hoàn toàn. Tuy vậy, xét cho cùng, anh đã đưa ra lập luận khá thuyết phục.","Je comprends votre idée, mais ce n'est pas forcément vrai. Cette opinion est un peu extrême. Pour parler franchement, je ne suis pas totalement d'accord. Cependant, tout bien considéré, vous avez présenté un argument assez convaincant.",
  [["Le locuteur :",["nuance son désaccord","est d'accord","s'énerve"],0],["Il juge l'opinion :",["un peu extrême","parfaite","fausse"],0],["Au final :",["il reconnaît un argument convaincant","il rejette tout","il se tait"],0]]],
 w:["Écris un paragraphe d'opinion nuancée (4 phrases) sur les réseaux sociaux avec « không phủ nhận rằng », « có phần », « xét cho cùng ».",["không phủ nhận rằng","có phần","xét cho cùng"],"Không phủ nhận rằng mạng xã hội giúp kết nối. Tuy nhiên, nó có phần gây nghiện. Xét cho cùng, quan trọng là cách sử dụng. Theo tôi, cần giới hạn thời gian.","On ne peut nier que les réseaux sociaux connectent. Cependant, ils sont un peu addictifs. En fin de compte, l'important est l'usage. À mon avis, il faut limiter le temps."],
 s:["Contredis poliment à voix haute une opinion (« Tôi hiểu ý anh, nhưng chưa hẳn... »).",["chưa hẳn","tôi hiểu","tuy nhiên"],"Tôi hiểu ý anh, nhưng chưa hẳn vậy. Tuy nhiên, anh có lý một phần.","Je comprends votre idée, mais ce n'est pas forcément ainsi. Cependant, vous avez en partie raison."]
});
S(53,{
 r:["Giá mà","Phải chi hồi đó tôi nghe lời má, học tiếng Việt từ nhỏ thì giờ đã đỡ khổ. Đáng lẽ tôi nên đi học thêm vào mỗi cuối tuần. Biết vậy, tôi đã không bỏ dở lớp học. Nhưng thôi, hễ nghĩ nhiều là mệt. Lỡ như bây giờ tôi bỏ cuộc thì còn tệ hơn.","Si seulement à l'époque j'avais écouté maman et appris le vietnamien tout petit, ce serait plus facile aujourd'hui. J'aurais dû suivre des cours supplémentaires chaque week-end. Si j'avais su, je n'aurais pas abandonné le cours. Mais bon, dès que je réfléchis trop je me fatigue. Et si j'abandonnais maintenant, ce serait pire.",
  [["Regret principal :",["ne pas avoir appris tôt","avoir mal mangé","avoir voyagé"],0],["« Biết vậy » :",["si j'avais su","demain","jamais"],0],["Conclusion :",["il ne faut pas abandonner maintenant","il faut tout arrêter","il faut déménager"],0]]],
 l:["Giá như tôi biết trước thì đã đến sớm hơn. Đáng lẽ tôi phải gọi điện báo. Giả sử anh ấy không chờ thì sao? Hễ trễ giờ là anh ấy bực lắm.","Si j'avais su avant, je serais arrivé plus tôt. J'aurais dû téléphoner. Supposons qu'il n'ait pas attendu, que se passerait-il ? Dès qu'on est en retard il se fâche.",
  [["Regret :",["ne pas être venu plus tôt","avoir menti","avoir trop mangé"],0],["Ce qu'il aurait dû faire :",["téléphoner","écrire un mail","oublier"],0],["Réaction habituelle de l'ami :",["il se fâche en cas de retard","il rit","il dort"],0]]],
 w:["Écris 3 phrases de regret ou d'hypothèse (phải chi, đáng lẽ, lỡ như).",["phải chi","đáng lẽ","lỡ như"],"Phải chi tôi học sớm hơn. Đáng lẽ tôi nên luyện nghe mỗi ngày. Lỡ như tôi bỏ cuộc thì sao?","Si seulement j'avais appris plus tôt. J'aurais dû m'entraîner à écouter chaque jour. Et si j'abandonnais ?"],
 s:["Exprime à voix haute un regret et un conseil à toi-même.",["phải chi","đáng lẽ","nên"],"Phải chi tôi đi sớm hơn. Đáng lẽ tôi nên chuẩn bị kỹ.","Si seulement j'étais parti plus tôt. J'aurais dû mieux me préparer."]
});
S(54,{
 r:["Tin nhắn Zalo","— Mày hổng thích phim này hả?\n— Thích chớ! Hay dữ luôn đó. Mà hổng phải phim nào tao cũng khen đâu nghen.\n— Biết rồi mà. Nè, mai coi tiếp hen?\n— Ừa, nhưng mày trả tiền vé nha, chớ bộ tao trả hoài sao!","— Tu n'aimes pas ce film ?\n— Mais si j'aime ! Il est vraiment bien. Seulement je ne complimente pas tous les films, hein.\n— Je sais bien. Tiens, demain on regarde la suite, d'accord ?\n— Oui, mais tu paies le billet, tu croyais que c'était toujours moi ?",
  [["Opinion sur le film :",["il le trouve très bien","il le déteste","il s'ennuie"],0],["« Chớ bộ » exprime :",["une ironie / un reproche","une peur","un remerciement"],0],["Proposition finale :",["l'autre paie le billet","ils annulent","ils pleurent"],0]]],
 l:["Con có biết đâu! Chớ má nói con rồi mà. Thôi mà, đừng giận nữa. Ngon dữ chưa, nè con ăn thử đi.","Je ne savais pas du tout ! Pourtant maman te l'a dit. Allez, ne sois plus fâchée. C'est tellement bon, tiens, goûte.",
  [["Attitude du locuteur :",["il adoucit","il se fâche","il part"],0],["« Nè » :",["voilà / tiens","non","demain"],0],["Ambiance :",["réconciliation","conflit","tristesse"],0]]],
 w:["Écris un petit dialogue (4 répliques) avec au moins 3 particules différentes (chớ, đâu, nè, nghen, mà).",["chớ","đâu","nè"],"— Anh hổng biết đâu. — Nói rồi mà! — Chớ ai biết. — Nè, ăn đi nghen.","— Je ne sais pas du tout. — Je te l'ai déjà dit ! — Bien sûr que oui, qui le saurait. — Tiens, mange, d'accord ?"],
 s:["Réponds oralement avec une particule d'insistance « chớ » ou « đâu ».",["chớ","đâu","tui"],"Thích chớ! Tui đâu có nói vậy.","Mais si j'aime ! Je n'ai jamais dit ça."]
});
S(55,{
 r:["Cuối tuần của Tâm","Tâm kể: « Hôm qua tui đi nhậu với tụi bạn, vui quá trời luôn. Tụi nó xạo dữ lắm, nói chỉ ngồi sương sương mà nhậu tới khuya! Má tui mà biết là chèn ơi, la quá chừng ». Hôm sau Tâm ớn rượu, chỉ muốn nằm nhà.","Tâm raconte : « Hier je suis allé boire avec mes copains, c'était trop bien. Ils mentent vraiment : ils disaient qu'on resterait un petit peu, mais ça a duré jusqu'à tard ! Si ma mère le sait, oh là là, elle me grondera de ouf. » Le lendemain, Tâm n'a plus envie de boire et ne veut que rester couché.",
  [["Que dit Tâm à propos de ses amis ?",["ils mentent un peu","ils sont gentils","ils sont absents"],0],["« Sương sương » signifie ici :",["un petit peu (minimisation)","énormément","jamais"],0],["Le lendemain :",["il est dégoûté de l'alcool","il est en pleine forme","il travaille"],0]]],
 l:["Hết sảy luôn! Hôm qua đi chơi đã quá. Xạo quá, hông phải vậy đâu. Chèn ơi, cái đó bựa dữ ta.","Génial ! Hier on s'est éclatés. Tu mens, ce n'est pas comme ça du tout. Oh là là, c'est vraiment un peu lourd, ça.",
  [["Ambiance :",["enthousiaste et taquine","triste","formelle"],0],["« Xạo quá » :",["tu mens !","c'est super","à demain"],0],["Registre :",["argotique","soutenu","administratif"],0]]],
 w:["Écris 3 phrases entre amis avec de l'argot du Sud (quá trời, dữ, xạo, hết sảy...).",["quá trời","dữ","hết sảy"],"Hôm qua vui quá trời. Món này ngon dữ. Phim đó hết sảy luôn.","Hier c'était trop bien. Ce plat est vraiment bon. Ce film est génial."],
 s:["Dis à voix haute à un ami que ta journée était géniale, avec 2 mots d'argot.",["hết sảy","quá trời","hôm nay"],"Hôm nay vui quá trời, hết sảy luôn.","Aujourd'hui c'était trop bien, génial."]
});
S(56,{
 r:["Lời dạy của bà","Bà tôi thường nói: « Ăn quả nhớ kẻ trồng cây ». Mỗi lần tôi được điểm cao, bà lại bảo: « Có công mài sắt, có ngày nên kim ». Bà còn hát ca dao ru tôi ngủ: « Cần Thơ gạo trắng nước trong, ai đi đến đó lòng không muốn về ». Với tôi, mỗi câu đều là một bài học.","Ma grand-mère disait souvent : « Quand tu manges le fruit, pense à celui qui a planté l'arbre ». Chaque fois que j'avais une bonne note, elle disait : « À force de limer le fer, un jour on obtient une aiguille ». Elle me chantait aussi un ca dao pour m'endormir : « À Cần Thơ le riz est blanc et l'eau claire, qui y va n'a pas envie de repartir ». Pour moi, chaque phrase est une leçon.",
  [["Premier proverbe :",["gratitude envers ceux qui ont fait l'effort","argent","paresse"],0],["Après de bonnes notes :",["persévérance paie","dormir tôt","jouer"],0],["Le ca dao parle de :",["Cần Thơ","Hà Nội","Huế"],0]]],
 l:["Gần mực thì đen, gần đèn thì sáng. Hãy chọn bạn mà chơi. Lá lành đùm lá rách, đừng bỏ rơi người khó khăn. Đi một ngày đàng, học một sàng khôn.","Près de l'encre on noircit, près de la lampe on s'éclaire. Choisis bien tes amis. Les feuilles intactes protègent les déchirées, n'abandonne pas ceux qui sont en difficulté. Un jour de voyage, un panier de sagesse.",
  [["Premier conseil :",["choisir ses amis","manger beaucoup","voyager seul"],0],["Deuxième :",["aider ceux en difficulté","les ignorer","les payer"],0],["Dernier proverbe :",["voyager instruit","dormir instruit","travailler plus"],0]]],
 w:["Choisis un proverbe de l'unité et écris une situation (2 phrases) où tu pourrais le citer.",["ông bà","câu","hàng xóm"],"Ông bà ta có câu « Lá lành đùm lá rách ». Khi hàng xóm bị bão, cả xóm cùng giúp.","Nos ancêtres disent « Lá lành đùm lá rách ». Quand les voisins sont touchés par la tempête, tout le quartier aide."],
 s:["Cite à voix haute un proverbe en l'introduisant par « Ông bà ta có câu ».",["ông bà","có câu","uống nước"],"Ông bà ta có câu: uống nước nhớ nguồn.","Nos ancêtres disent : quand tu bois l'eau, souviens-toi de la source."]

S(57,{
 r:["Thư xin việc","Kính gửi anh Nam,\nTôi tên là Trần Mai, hiện đang làm kế toán tại công ty ABC. Tôi xin phép được ứng tuyển vị trí quản lý tài chính mà quý công ty đang đăng tuyển. Tôi xin gửi kèm CV. Rất mong nhận được phản hồi từ anh. Trân trọng, Trần Mai.","À l'attention de M. Nam,\nJe m'appelle Trần Mai et suis actuellement comptable chez ABC. Je me permets de postuler au poste de responsable financier que votre société recrute. Je joins mon CV. Dans l'attente de votre réponse. Cordialement, Trần Mai.",
  [["Poste visé :",["responsable financier","comptable","directeur"],0],["Document joint :",["CV","contrat","photo"],0],["Fin de lettre :",["Trân trọng","Nha","Tạm biệt"],0]]],
 l:["Kính thưa quý vị, hôm nay tôi xin trình bày kế hoạch năm mới. Trước hết, chúng tôi sẽ mở rộng thị trường. Cuối cùng, chúng tôi xin chân thành cảm ơn sự lắng nghe của quý vị.","Mesdames et Messieurs, aujourd'hui je me permets de présenter le plan de la nouvelle année. Tout d'abord, nous allons élargir le marché. Enfin, nous vous remercions sincèrement de votre écoute.",
  [["Contexte :",["présentation formelle","conversation amicale","dispute"],0],["Premier point :",["élargir le marché","réduire les coûts","licencier"],0],["Fin :",["remerciements","insultes","silence"],0]]],
 w:["Écris les 4 premières lignes d'un email formel pour demander une attestation.",["kính gửi","tôi xin","trân trọng"],"Kính gửi chị Lan,\nTôi xin phép được đề nghị cấp giấy xác nhận làm việc. Rất mong nhận được phản hồi của chị.\nTrân trọng,","À l'attention de Mme Lan,\nJe me permets de demander une attestation de travail. Dans l'attente de votre réponse.\nCordialement,"],
 s:["Présente-toi oralement de façon formelle à un recruteur.",["kính","tôi","xin"],"Kính chào quý vị. Tôi xin tự giới thiệu: tôi tên là Anna, tôi là bác sĩ.","Bonjour à tous. Permettez-moi de me présenter : je m'appelle Anna, je suis médecin."]

S(58,{
 r:["Biên bản cuộc họp","Cuộc họp ngày 12/11 bàn về việc triển khai dự án mới. Phía công ty đề xuất bắt đầu vào đầu tháng sau, tuy nhiên phía đối tác còn băn khoăn về ngân sách. Hai bên thống nhất xem xét lại thời hạn. Nếu phía đối tác đồng ý ký hợp đồng trước thì công ty sẽ giảm giá 5%. Biên bản được gửi đến các bên liên quan.","La réunion du 12/11 a porté sur le déploiement du nouveau projet. L'entreprise propose de commencer début du mois prochain, mais le partenaire a des réserves sur le budget. Les deux parties conviennent de revoir le délai. Si le partenaire accepte de signer le contrat d'abord, l'entreprise baissera le prix de 5 %. Le compte rendu est envoyé aux parties concernées.",
  [["Sujet :",["lancement d'un projet","fermeture d'agence","recrutement"],0],["Réserve du partenaire :",["le budget","le lieu","l'équipe"],0],["Condition de la remise :",["signer d'abord","payer cash","attendre un an"],0]]],
 l:["Phía chúng tôi đề xuất rút ngắn thời hạn. Về điểm này, bên đối tác còn băn khoăn. Chúng ta tạm thời chốt phương án một và xem xét lại vào tuần sau. Tôi sẽ gửi biên bản cuộc họp ngay chiều nay.","De notre côté nous proposons de raccourcir le délai. Sur ce point, le partenaire a encore des réserves. Nous arrêtons provisoirement l'option 1 et réexaminerons la semaine prochaine. J'enverrai le compte rendu cet après-midi.",
  [["Proposition :",["raccourcir le délai","augmenter le prix","annuler"],0],["Décision :",["option 1 provisoirement","rien","annulation totale"],0],["Suite :",["envoi du compte rendu","départ en vacances","grève"],0]]],
 w:["Rédige 3 phrases de négociation : proposition, condition, accord.",["đề xuất","nếu","chốt"],"Chúng tôi đề xuất giao hàng trong hai tuần. Nếu phía anh đồng ý thanh toán trước thì chúng tôi giảm giá. Vậy chúng ta chốt nhé.","Nous proposons la livraison sous deux semaines. Si vous acceptez de payer d'avance nous baissons le prix. Donc nous concluons."],
 s:["Fais à voix haute une proposition commerciale polie avec « nếu... thì ».",["đề xuất","nếu","giảm giá"],"Chúng tôi đề xuất giảm giá năm phần trăm nếu quý công ty ký hợp đồng sớm.","Nous proposons une remise de 5 % si votre société signe tôt le contrat."]
});

S(59,{
 r:["Một buổi khám bệnh","Bà Sáu đến phòng khám vì bị nhức đầu và chóng mặt từ hôm qua. Bác sĩ hỏi bà có sốt, có ói không. Bà trả lời không, nhưng bà bị dị ứng với hải sản. Bác sĩ đo huyết áp và cho bà đơn thuốc: uống ngày hai lần, sau khi ăn. Bà được dặn tái khám nếu triệu chứng không giảm.","Bà Sáu vient en consultation pour des maux de tête et des vertiges depuis hier. Le médecin demande si elle a de la fièvre, si elle vomit. Elle répond non, mais elle est allergique aux fruits de mer. Le médecin mesure la tension et lui prescrit une ordonnance : à prendre deux fois par jour, après les repas. On lui recommande de revenir si les symptômes ne diminuent pas.",
  [["Symptômes :",["maux de tête et vertiges","toux","douleur au ventre"],0],["Allergie :",["fruits de mer","pénicilline","pollen"],0],["Posologie :",["2 fois par jour après le repas","1 fois avant le repas","à volonté"],0]]],
 l:["Bác bị đau bụng từ khi nào? Dạ, từ sáng nay. Có ói không? Dạ có, hai lần. Có tiêu chảy không? Dạ không. Để tui xét nghiệm máu cho bác.","Depuis quand avez-vous mal au ventre ? Depuis ce matin. Vomissez-vous ? Oui, deux fois. Diarrhée ? Non. Je vais vous faire une prise de sang.",
  [["Douleur :",["au ventre depuis ce matin","à la tête depuis hier","au dos depuis une semaine"],0],["Vomissements :",["deux fois","jamais","cinq fois"],0],["Examen :",["prise de sang","radio","échographie"],0]]],
 w:["Écris 3 questions qu'un médecin poserait à un patient vietnamien.",["bị","từ khi nào","dị ứng"],"Bác bị đau ở đâu? Bác bị từ khi nào? Bác có dị ứng thuốc gì không?","Où avez-vous mal ? Depuis quand ? Êtes-vous allergique à un médicament ?"],
 s:["Joue le patient : dis à voix haute ton symptôme et depuis quand.",["bị","từ","hôm qua"],"Dạ, con bị nhức đầu từ hôm qua tới giờ.","Oui, j'ai mal à la tête depuis hier."]
});
S(60,{
 r:["Gia hạn thị thực","Anh Peter muốn gia hạn thị thực nên đến văn phòng xuất nhập cảnh. Nhân viên yêu cầu anh nộp hộ chiếu, đơn xin gia hạn và hai ảnh thẻ. Hồ sơ phải được bổ sung nếu thiếu giấy tờ. Theo quy định, hồ sơ được xử lý trong năm ngày làm việc kể từ ngày nhận đủ.","Peter veut prolonger son visa et se rend au bureau de l'immigration. L'employé lui demande de déposer son passeport, sa demande de prolongation et deux photos d'identité. Le dossier doit être complété s'il manque des papiers. Selon la réglementation, il est traité sous cinq jours ouvrés à compter de la réception du dossier complet.",
  [["Pièces demandées :",["passeport, demande, 2 photos","seulement passeport","une carte bancaire"],0],["Si des papiers manquent :",["compléter le dossier","tout recommencer","payer une amende"],0],["Délai :",["5 jours ouvrés","1 mois","24 h"],0]]],
 l:["Chị ơi, em cần làm căn cước công dân. Em phải nộp những giấy tờ gì? Chị cần mang giấy khai sinh, sổ hộ khẩu và hai tấm ảnh. Hồ sơ nộp tại ủy ban nhân dân phường.","Madame, je dois faire ma carte d'identité. Quels papiers dois-je déposer ? Il vous faut apporter l'acte de naissance, le livret de famille et deux photos. Le dossier se dépose à la mairie de quartier.",
  [["Démarche :",["carte d'identité","visa","permis"],0],["Pièces :",["acte de naissance, livret, 2 photos","passeport seul","aucune"],0],["Lieu :",["ủy ban nhân dân phường","banque","poste"],0]]],
 w:["Écris 3 phrases décrivant une démarche administrative (phải, nộp, trong thời hạn).",["phải","nộp","thời hạn"],"Tôi phải nộp hồ sơ tại ủy ban. Hồ sơ cần đầy đủ giấy tờ. Trong thời hạn năm ngày sẽ có kết quả.","Je dois déposer mon dossier à la mairie. Le dossier doit être complet. Sous cinq jours il y aura un résultat."],
 s:["Demande oralement à un guichet les papiers nécessaires pour renouveler un visa.",["giấy tờ","gia hạn","cần"],"Chị ơi, để gia hạn thị thực em cần những giấy tờ gì?","Madame, pour prolonger mon visa, quels papiers me faut-il ?"]
});
S(61,{
 r:["Tin buổi tối","Theo Tổng cục Thống kê, lạm phát trong quý ba tăng 3,2% so với cùng kỳ năm ngoái. Phóng viên cho biết giá thực phẩm là nguyên nhân chính. Các chuyên gia dự báo xu hướng này sẽ giảm vào cuối năm. Tuy nhiên, người dân vẫn lo lắng trước tin giả lan truyền trên mạng xã hội.","Selon l'Office des statistiques, l'inflation du troisième trimestre a augmenté de 3,2 % par rapport à la même période de l'an dernier. Le reporter indique que les prix alimentaires en sont la cause principale. Les experts prévoient que cette tendance diminuera en fin d'année. Cependant, les habitants s'inquiètent des fausses informations circulant sur les réseaux sociaux.",
  [["Taux d'inflation :",["3,2 %","6,2 %","0,3 %"],0],["Cause :",["prix alimentaires","carburant","logement"],0],["Inquiétude :",["fausses informations","chômage","guerre"],0]]],
 l:["Theo nguồn tin chính thức, chính phủ đã công bố kế hoạch hỗ trợ doanh nghiệp nhỏ. Đáng chú ý, gói hỗ trợ lên tới hai nghìn tỷ đồng. Các chuyên gia cho rằng việc triển khai nhanh là rất quan trọng.","Selon une source officielle, le gouvernement a annoncé un plan d'aide aux petites entreprises. À noter, l'enveloppe atteint deux mille milliards de dôngs. Les experts estiment qu'un déploiement rapide est très important.",
  [["Annonce :",["aide aux petites entreprises","hausse des taxes","fermeture de frontières"],0],["Montant :",["2 000 milliards de dôngs","20 milliards","200 millions"],0],["Selon les experts :",["il faut déployer vite","il faut attendre","il faut annuler"],0]]],
 w:["Rédige un mini-article de 3 phrases (titre + faits + source).",["theo","cho biết","tăng"],"Giá xăng tăng nhẹ. Theo Bộ Công Thương, mức tăng là 2%. Chuyên gia cho biết sẽ ổn định.","Le prix de l'essence augmente légèrement. Selon le ministère de l'Industrie et du Commerce, la hausse est de 2 %. Les experts indiquent que cela se stabilisera."],
 s:["Joue le présentateur : annonce à voix haute une brève nouvelle avec « theo... ».",["theo","cho biết","tin"],"Theo nguồn tin mới nhất, giá vàng tăng. Chuyên gia cho biết xu hướng này sẽ tiếp tục.","Selon les dernières informations, le prix de l'or augmente. Les experts indiquent que cette tendance se poursuivra."]
});
S(62,{
 r:["Bài nghị luận về học tập suốt đời","Học tập suốt đời không còn là lựa chọn mà là nhu cầu. Trước hết, kiến thức thay đổi nhanh nên ta cần cập nhật liên tục. Hơn nữa, học giúp ta thích nghi với công việc mới. Ví dụ như nhiều người ngoài năm mươi tuổi vẫn học ngoại ngữ. Tóm lại, học không bao giờ là muộn.","Apprendre tout au long de la vie n'est plus un choix mais un besoin. Tout d'abord, les connaissances changent vite et nous devons nous mettre à jour. De plus, apprendre aide à s'adapter à un nouveau métier. Par exemple, beaucoup de personnes de plus de cinquante ans apprennent encore des langues. En résumé, il n'est jamais trop tard pour apprendre.",
  [["Thèse :",["apprendre toute sa vie est un besoin","apprendre est inutile","il faut arrêter à 50 ans"],0],["Premier argument :",["les connaissances évoluent vite","l'argent","le temps libre"],0],["Conclusion :",["il n'est jamais trop tard","il faut abandonner","c'est impossible"],0]]],
 l:["Hôm nay tôi xin trình bày về tác động của mạng xã hội. Một mặt, nó giúp mọi người kết nối. Mặt khác, nó gây nghiện và lan truyền tin giả. Tóm lại, ta cần dùng mạng xã hội một cách có trách nhiệm.","Aujourd'hui je me propose de présenter l'impact des réseaux sociaux. D'une part, ils connectent les gens. D'autre part, ils créent une dépendance et propagent de fausses informations. En résumé, il faut utiliser les réseaux sociaux de façon responsable.",
  [["Sujet :",["les réseaux sociaux","le transport","l'école"],0],["Inconvénient :",["dépendance et fausses infos","coût élevé","absence de contacts"],0],["Conclusion :",["usage responsable","interdiction","abandon"],0]]],
 w:["Écris un court plan d'exposé (mở bài, 2 arguments, kết bài) sur un sujet de ton choix.",["trước hết","hơn nữa","tóm lại"],"Hôm nay tôi xin nói về việc học tiếng Việt. Trước hết, nó giúp giao tiếp. Hơn nữa, nó giúp hiểu văn hóa. Tóm lại, học tiếng Việt rất bổ ích.","Aujourd'hui je vais parler de l'apprentissage du vietnamien. D'abord, cela aide à communiquer. De plus, cela aide à comprendre la culture. En résumé, apprendre le vietnamien est très utile."],
 s:["Présente à voix haute un exposé de 30 secondes sur un sujet avec « trước hết... tóm lại ».",["trước hết","thứ hai","tóm lại"],"Trước hết, đọc sách giúp mở rộng kiến thức. Thứ hai, nó giúp thư giãn. Tóm lại, nên đọc sách mỗi ngày.","D'abord, lire élargit les connaissances. Deuxièmement, cela détend. En résumé, il faut lire chaque jour."]
});
S(63,{
 r:["Dòng sông quê tôi","Dòng sông quê tôi như dải lụa mềm lững lờ trôi giữa hai hàng dừa nước. Xa xa, một chiếc xuồng lặng lẽ trượt đi. Những chùm lục bình tím nhạt cứ thế trôi, như muốn kể chuyện về miền sông nước. Tôi nghe tiếng gió thì thầm, tiếng nước vỗ nhẹ vào mạn ghe, và thấy lòng mình bình yên lạ.","Le fleuve de mon village, comme un ruban de soie douce, coule paresseusement entre deux rangées de cocotiers d'eau. Au loin, une pirogue glisse en silence. Les grappes de jacinthes d'eau violet pâle dérivent comme pour raconter l'histoire du pays des fleuves. J'entends le vent chuchoter, l'eau claquer doucement contre le flanc de la barque, et mon cœur est étrangement paisible.",
  [["Comparaison du fleuve :",["un ruban de soie","un serpent","une route"],0],["Au loin :",["une pirogue silencieuse","un camion","un oiseau"],0],["Sentiment final :",["paix","angoisse","colère"],0]]],
 l:["Buổi chiều, mặt trời đỏ rực như quả trứng gà. Con thuyền thở dài giữa dòng nước. Bà ngồi bên bờ, đôi mắt xa xăm như đang tìm lại một thời đã mất.","Le soir, le soleil est rouge vif comme un jaune d'œuf. La barque soupire au milieu du courant. Grand-mère est assise au bord, le regard lointain, comme à la recherche d'un temps perdu.",
  [["Comparaison du soleil :",["un jaune d'œuf","une pomme","une lampe"],0],["Personnification :",["la barque soupire","le vent chante","l'eau dort"],0],["Grand-mère :",["regard lointain","pleure","court"],0]]],
 w:["Écris 3 phrases descriptives avec une comparaison (như), une personnification et un từ láy.",["như","lững lờ","gió"],"Dòng sông như dải lụa lững lờ trôi. Gió thì thầm bên tai. Cánh đồng xanh mơn mởn.","Le fleuve est comme un ruban de soie qui coule paresseusement. Le vent chuchote à l'oreille. Les champs sont d'un vert tendre."],
 s:["Décris à voix haute un paysage de campagne en 3 phrases littéraires.",["như","xa xa","lặng lẽ"],"Xa xa, một chiếc xuồng lặng lẽ trôi. Dòng sông như dải lụa.","Au loin, une pirogue glisse en silence. Le fleuve est comme un ruban de soie."]
});
S(64,{
 r:["Giọng nói ba miền","Gia đình tôi có người Bắc, người Trung và người Nam. Bà nội ở Huế nói « mô », « tê », « răng », « rứa ». Ba tôi ở Sài Gòn nói « hổng », « dìa », « trển ». Còn dì tôi ở Hà Nội nói « không », « về », « trên đó ». Lúc đầu tôi nghe không hiểu, nhưng sau vài tuần tôi bắt đầu quen và thấy rất thú vị.","Dans ma famille il y a des gens du Nord, du Centre et du Sud. Ma grand-mère de Huế dit « mô », « tê », « răng », « rứa ». Mon père de Saigon dit « hổng », « dìa », « trển ». Ma tante de Hà Nội dit « không », « về », « trên đó ». Au début je ne comprenais pas, mais après quelques semaines j'ai commencé à m'habituer et à trouver ça passionnant.",
  [["Origine de la grand-mère :",["Huế","Hà Nội","Sài Gòn"],0],["« Dìa » (Sud) = :",["về (rentrer)","đi (aller)","ăn (manger)"],0],["Attitude du narrateur :",["il finit par trouver ça passionnant","il refuse d'écouter","il déménage"],0]]],
 l:["Hổm rày tui bận quá, chiều nay mới dìa tới nhà. Trển có mưa hông? Bển hôm nay trời nắng dữ lắm. Mà ba mẹ ở nhà mô rứa?","Ces derniers jours j'étais très occupé, je rentre seulement cet après-midi. Il pleut là-haut ? Là-bas il fait très chaud aujourd'hui. Mais où sont papa et maman, au fait ?",
  [["Locuteur :",["du Sud (puis un mot du Centre)","du Nord","étranger"],0],["Météo là-bas :",["très chaud","pluie","neige"],0],["« Hổm rày » :",["ces derniers jours","demain","jamais"],0]]],
 w:["Écris 3 phrases avec des mots du Sud (hổng, dìa, hổm rày, tui) et donne leur équivalent « standard » entre parenthèses.",["hổng","dìa","hổm rày"],"Hổm rày tui bận quá (dạo này tôi bận). Chiều nay tui dìa (về) nhà. Hổng sao đâu (không sao đâu).","Ces derniers temps j'ai été occupé. Cet après-midi je rentre. Ce n'est pas grave."],
 s:["Dis à voix haute 3 phrases avec du vocabulaire sudiste.",["tui","dìa","hổng"],"Tui dìa nhà hổm rày hổng được. Hổng sao đâu nghen.","Ces derniers temps je n'ai pas pu rentrer. Ce n'est pas grave, d'accord ?"]
});
S(65,{
 r:["Cuộc sống số","Trong thập kỷ qua, chuyển đổi số đã thay đổi diện mạo của nhiều thành phố. Thương mại điện tử phát triển mạnh, việc giao hàng ngày càng nhanh. Càng nhiều ứng dụng tiện lợi, càng cần chú trọng an ninh mạng. Bên cạnh đó, đô thị hóa nhanh đặt ra thách thức về môi trường và phát triển bền vững.","Au cours de la décennie écoulée, la transformation numérique a changé le visage de nombreuses villes. Le commerce électronique prospère, la livraison est de plus en plus rapide. Plus il y a d'applications pratiques, plus il faut insister sur la cybersécurité. Par ailleurs, l'urbanisation rapide pose des défis environnementaux et de développement durable.",
  [["Changement majeur :",["transformation numérique","guerre","mode"],0],["Plus d'applications :",["plus de cybersécurité nécessaire","moins de sécurité","moins de commerce"],0],["Défi :",["environnement et durabilité","ennui","chômage"],0]]],
 l:["Nhiều bạn trẻ chọn khởi nghiệp thay vì làm việc cho công ty lớn. Thu nhập chưa ổn định nhưng họ có nhiều cơ hội phát triển. Trí tuệ nhân tạo cũng đang mở ra nhiều ngành nghề mới.","Beaucoup de jeunes choisissent de créer leur entreprise plutôt que de travailler pour une grande société. Leurs revenus ne sont pas encore stables mais ils ont de nombreuses opportunités. L'intelligence artificielle ouvre aussi de nombreux nouveaux métiers.",
  [["Choix des jeunes :",["créer leur entreprise","émigrer","étudier plus"],0],["Inconvénient :",["revenus instables","manque de temps","pas de diplôme"],0],["L'IA :",["ouvre de nouveaux métiers","supprime tous les métiers","est inutile"],0]]],
 w:["Écris 3 phrases sur un enjeu contemporain (technologie, environnement ou économie).",["ngày càng","phát triển","việc"],"Công nghệ ngày càng phát triển. Việc học trực tuyến trở nên phổ biến. Chúng ta cần bảo vệ môi trường.","La technologie se développe de plus en plus. Apprendre en ligne devient courant. Nous devons protéger l'environnement."],
 s:["Donne ton opinion à voix haute sur l'intelligence artificielle en 2 phrases.",["trí tuệ nhân tạo","theo tôi","vừa"],"Theo tôi, trí tuệ nhân tạo vừa có lợi vừa có rủi ro.","À mon avis, l'intelligence artificielle présente à la fois des avantages et des risques."]
});
S(66,{
 r:["Một ngày ở Sài Gòn (bài tổng hợp)","Tuy mới sống ở Sài Gòn ba tháng, chị Anna đã làm quen với nhịp sống nơi đây. Phải chi chị học tiếng Việt sớm hơn thì giờ đã thoải mái hơn. Hễ rảnh là chị đi chợ nổi, ăn hủ tiếu và nói chuyện với người bản xứ. Không những giỏi giao tiếp, chị còn hiểu cả tục ngữ. Xét cho cùng, kinh nghiệm này đã thay đổi cách chị nhìn cuộc sống. Miễn là chị còn kiên trì, chị sẽ tiến bộ nhiều.","Bien qu'elle ne vive à Saigon que depuis trois mois, chị Anna s'est déjà habituée au rythme de vie. Si seulement elle avait appris le vietnamien plus tôt, elle serait plus à l'aise aujourd'hui. Dès qu'elle est libre, elle va au marché flottant, mange du hủ tiếu et discute avec les gens du pays. Non seulement elle communique bien, mais elle comprend même les proverbes. En fin de compte, cette expérience a changé sa manière de voir la vie. Tant qu'elle persévère, elle progressera beaucoup.",
  [["Depuis combien de temps à Saigon ?",["trois mois","trois ans","un mois"],0],["Regret :",["ne pas avoir appris plus tôt","avoir quitté son pays","avoir trop mangé"],0],["Condition de progrès :",["persévérer","payer plus","déménager"],0]]],
 l:["Dù khó đến đâu, tôi cũng sẽ cố gắng. Chưa hẳn mọi người đều đồng tình, nhưng xét cho cùng, đó là lựa chọn của tôi. Giá như tôi biết sớm hơn. Ông bà ta có câu: có công mài sắt có ngày nên kim.","Même si c'est très difficile, je ferai de mon mieux. Tout le monde n'est pas forcément d'accord, mais en fin de compte c'est mon choix. Si seulement j'avais su plus tôt. Nos ancêtres disent : à force de limer le fer on obtient une aiguille.",
  [["Attitude :",["détermination","abandon","colère"],0],["Les autres :",["pas tous d'accord","tous d'accord","absents"],0],["Conclusion :",["la persévérance paie","il faut renoncer","il faut dormir"],0]]],
 w:["Rédige un paragraphe de bilan (5 phrases) sur ton apprentissage du vietnamien en utilisant des structures du niveau C1.",["tuy","phải chi","xét cho cùng","miễn là"],"Tuy học tiếng Việt chưa lâu, tôi đã tiến bộ nhiều. Phải chi tôi bắt đầu sớm hơn. Xét cho cùng, việc học này rất ý nghĩa. Miễn là tôi kiên trì thì tôi sẽ thành công. Tôi cảm ơn gia đình đã giúp tôi.","Bien que j'apprenne le vietnamien depuis peu, j'ai beaucoup progressé. Si seulement j'avais commencé plus tôt. En fin de compte, cet apprentissage a beaucoup de sens. Du moment que je persévère, je réussirai. Je remercie ma famille de m'avoir aidé."],
 s:["Fais un bilan oral de 30 secondes sur ton apprentissage, en utilisant « tuy », « xét cho cùng » et « miễn là ».",["tuy","xét cho cùng","miễn là"],"Tuy học chưa lâu nhưng tôi đã nói được nhiều. Xét cho cùng, học tiếng Việt là niềm vui. Miễn là còn kiên trì, tôi sẽ tiến bộ.","Même si j'étudie depuis peu, je parle déjà beaucoup. En fin de compte, apprendre le vietnamien est une joie. Tant que je persévère, je progresserai."]
});
