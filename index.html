<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiếng Việt Miền Nam — Apprendre le vietnamien du Sud</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A3D3A">
<meta name="description" content="Apprendre le vietnamien du Sud — vocabulaire, grammaire, audio et exercices, du niveau débutant au niveau C1.">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiếng Việt">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --card:#fff;--ok-bg:#E4F3E7;--bad-bg:#FBE6E5;--head:#0A3D3A;
  --paper:#F5EFDD;
  --paper-2:#EDE4C8;
  --river:#0F5C56;
  --river-dark:#0A3D3A;
  --river-light:#3E8C82;
  --turmeric:#E0A526;
  --turmeric-light:#F2C55C;
  --clay:#B4502E;
  --ink:#1F2A24;
  --ink-soft:#4A5750;
  --ok:#2E7D46;
  --bad:#B4302E;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Be Vietnam Pro',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Fraunces',serif;
  color:var(--head);
  letter-spacing:-0.01em;
}
.mono{font-family:'JetBrains Mono',monospace;}

.topbar{
  background:linear-gradient(180deg,var(--river-dark),var(--river));
  color:var(--paper);
  padding:22px 24px 30px;
  position:relative;
  overflow:hidden;
}
.topbar::after{
  content:"";
  position:absolute;left:0;right:0;bottom:0;height:16px;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 16'><path d='M0 8 Q 12 0 24 8 T 48 8 V16 H0 Z' fill='black'/></svg>") repeat-x;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 16'><path d='M0 8 Q 12 0 24 8 T 48 8 V16 H0 Z' fill='black'/></svg>") repeat-x;
  background:var(--paper);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1180px;margin:0 auto;}
.brand h1{color:var(--paper);font-size:1.7rem;margin:0;font-weight:600;}
.brand p{margin:4px 0 0;color:var(--turmeric-light);font-size:.92rem;}
.menu-btn{
  display:none;background:var(--turmeric);color:var(--head);border:none;
  padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;
}

.layout{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}
.sidebar{
  width:280px;flex-shrink:0;padding:26px 14px 60px 6px;position:sticky;top:0;
  max-height:100vh;overflow-y:auto;
}
.level-label{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--river);
  font-weight:700;margin:22px 0 8px 18px;
}
.level-label:first-child{margin-top:0;}
.river-track{position:relative;padding-left:26px;}
.river-track::before{
  content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;
  background:linear-gradient(var(--river-light),var(--paper-2));
  border-radius:3px;
}
.unit-item{
  position:relative;display:block;width:100%;text-align:left;background:none;border:none;
  font-family:inherit;padding:9px 10px 9px 6px;margin-bottom:2px;border-radius:10px;cursor:pointer;
  color:var(--ink-soft);font-size:.86rem;line-height:1.25;
}
.unit-item::before{
  content:"";position:absolute;left:-21px;top:14px;width:11px;height:11px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--river-light);
}
.unit-item.done::before{background:var(--river);border-color:var(--river);}
.unit-item.active{background:var(--turmeric-light);color:var(--head);font-weight:600;}
.unit-item.active::before{background:var(--turmeric);border-color:var(--clay);width:13px;height:13px;left:-22px;top:13px;}
.unit-item small{display:block;color:var(--ink-soft);font-weight:400;font-size:.75rem;}
.unit-item.active small{color:var(--head);}
.unit-check{position:absolute;right:8px;top:10px;font-size:.72rem;color:var(--river);}

main{flex:1;padding:34px 30px 90px;min-width:0;}
.unit-header{margin-bottom:26px;}
.eyebrow{
  display:inline-block;background:var(--river-dark);color:var(--turmeric-light);
  padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:10px;
}
.unit-header h2{font-size:2rem;margin:0 0 6px;}
.unit-header .sub{color:var(--ink-soft);font-size:1rem;margin:0;}

section.block{
  background:var(--card);border:1px solid var(--paper-2);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:22px;
}
section.block h3{
  margin:0 0 14px;font-size:1.15rem;display:flex;align-items:center;gap:8px;
}
section.block h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--clay);}

.vocab-table{width:100%;border-collapse:collapse;font-size:.93rem;}
.vocab-table th{
  text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--river);padding:6px 10px;border-bottom:2px solid var(--paper-2);
}
.vocab-table td{padding:9px 10px;border-bottom:1px solid var(--paper-2);vertical-align:top;}
.vocab-table tr:last-child td{border-bottom:none;}
.vn-cell{display:flex;align-items:center;gap:7px;}
.vn-word{font-weight:600;color:var(--head);}
.ipa{color:var(--clay);font-size:.84rem;}
.note{color:var(--ink-soft);font-size:.81rem;}
.audio-btn{
  border:none;background:var(--paper);color:var(--river);width:26px;height:26px;border-radius:50%;
  cursor:pointer;font-size:.85rem;flex-shrink:0;line-height:1;
}
.audio-btn:hover{background:var(--turmeric-light);color:var(--head);}
.audio-note{
  background:var(--paper);border-left:3px solid var(--river-light);padding:9px 14px;
  border-radius:0 8px 8px 0;font-size:.83rem;color:var(--ink-soft);margin-bottom:16px;
}

.grammar-body p{line-height:1.6;margin:0 0 12px;}
.grammar-body ul{line-height:1.6;padding-left:20px;margin:0 0 12px;}
.callout{
  background:var(--paper);border-left:3px solid var(--turmeric);
  padding:10px 14px;border-radius:0 8px 8px 0;font-size:.9rem;margin:12px 0;
}

.dialogue-line{display:flex;gap:10px;margin-bottom:12px;align-items:baseline;flex-wrap:wrap;}
.speaker{flex-shrink:0;width:64px;font-weight:700;color:var(--clay);font-size:.85rem;}
.dialogue-line .vn{font-weight:600;display:flex;align-items:center;gap:6px;}
.dialogue-line .fr{color:var(--ink-soft);font-size:.86rem;width:100%;padding-left:74px;}

.exercise{margin-bottom:20px;padding-bottom:18px;border-bottom:1px dashed var(--paper-2);}
.exercise:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.exercise .q{font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.options{display:flex;flex-direction:column;gap:8px;}
.opt-btn{
  text-align:left;padding:10px 14px;border-radius:9px;border:1.5px solid var(--paper-2);
  background:var(--paper);cursor:pointer;font-family:inherit;font-size:.92rem;color:var(--ink);
}
.opt-btn:hover{border-color:var(--river-light);}
.opt-btn.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600;}
.opt-btn.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
.opt-btn:disabled{cursor:default;}
.fill-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.fill-row input{
  padding:9px 12px;border-radius:9px;border:1.5px solid var(--paper-2);font-family:inherit;
  font-size:.92rem;min-width:180px;
}
.fill-row input.correct{border-color:var(--ok);background:var(--ok-bg);}
.fill-row input.wrong{border-color:var(--bad);background:var(--bad-bg);}
.check-btn{
  background:var(--river);color:#fff;border:none;padding:9px 16px;border-radius:9px;
  cursor:pointer;font-family:inherit;font-weight:600;font-size:.88rem;
}
.check-btn:hover{background:var(--river-dark);}
.check-btn:disabled{background:var(--paper-2);color:var(--ink-soft);cursor:not-allowed;}
.fb{font-size:.85rem;margin-top:6px;font-weight:600;}
.fb.ok-fb{color:var(--ok);}
.fb.bad-fb{color:var(--bad);}
.big-audio-btn{
  border:none;background:var(--river);color:#fff;padding:8px 16px;border-radius:9px;
  cursor:pointer;font-family:inherit;font-weight:600;font-size:.88rem;margin-bottom:12px;
}
.big-audio-btn:hover{background:var(--river-dark);}

.score-bar{
  display:flex;justify-content:space-between;align-items:center;background:var(--river-dark);
  color:var(--paper);padding:14px 20px;border-radius:var(--radius);margin-top:6px;
}
.score-bar .num{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--turmeric-light);}

@media(max-width:880px){
  .layout{flex-direction:column;}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;background:var(--paper);z-index:20;
    transform:translateX(-100%);transition:transform .25s ease;width:82%;max-width:320px;
    box-shadow:4px 0 18px rgba(0,0,0,.15);padding-top:70px;
  }
  .sidebar.open{transform:translateX(0);}
  .menu-btn{display:inline-block;}
  main{padding:24px 16px 80px;}
  .dialogue-line .fr{padding-left:0;}
}
.passage{background:var(--paper);border-left:3px solid var(--river-light);padding:14px 18px;border-radius:0 10px 10px 0;line-height:1.75;font-size:1rem;margin-bottom:12px;}
.passage .ptitle{font-family:'Fraunces',serif;color:var(--head);font-weight:600;margin-bottom:6px;}
.passage-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.ghost-btn{border:1.5px solid var(--river-light);background:var(--card);color:var(--head);padding:7px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.84rem;}
.ghost-btn:hover{background:var(--turmeric-light);}
.ghost-btn:disabled{opacity:.5;cursor:default;}
details.fold{margin:6px 0 14px;font-size:.92rem;}
details.fold summary{cursor:pointer;color:var(--river);font-weight:600;}
details.fold .fold-body{background:var(--paper);padding:10px 14px;border-radius:8px;margin-top:8px;line-height:1.65;}
.skill-tag{display:inline-block;background:var(--turmeric-light);color:var(--head);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:12px;margin-left:8px;}
textarea.write-area{width:100%;min-height:110px;padding:10px 12px;border-radius:9px;border:1.5px solid var(--paper-2);font-family:inherit;font-size:.95rem;line-height:1.5;resize:vertical;}
.keys-result{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.kbadge{padding:3px 10px;border-radius:14px;font-size:.8rem;font-weight:600;}
.kbadge.ok{background:var(--ok-bg);color:var(--ok);}
.kbadge.ko{background:var(--bad-bg);color:var(--bad);}
.rec-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;}
.rec-status{font-size:.85rem;color:var(--ink-soft);margin:6px 0;min-height:1.2em;}
.rec-btn{background:var(--clay);color:#fff;border:none;padding:8px 15px;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.86rem;}
.rec-btn.on{background:var(--bad);}
.self-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.mini{font-size:.8rem;color:var(--ink-soft);}
.sub-h{font-weight:700;color:var(--clay);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 10px;}
audio.rec-audio{height:34px;max-width:100%;}
@media(max-width:880px){
  .layout{align-items:stretch;}
  main{width:100%;max-width:100vw;overflow-x:hidden;}
  section.block{padding:18px 16px;}
  .vocab-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .vocab-table td,.vocab-table th{min-width:90px;}
  .rec-btn,.ghost-btn,.big-audio-btn{font-size:.82rem;}
  .fill-row input{min-width:0;flex:1;}
}
.res-btn{display:block;width:calc(100% - 12px);margin:0 0 14px 6px;text-align:left;background:var(--river-dark);color:var(--turmeric-light);border:none;border-radius:10px;padding:11px 14px;font-family:inherit;font-weight:700;font-size:.88rem;cursor:pointer;}
.res-btn.active{background:var(--turmeric);color:var(--head);}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.res-card{border:1px solid var(--paper-2);border-radius:12px;padding:14px 16px;background:var(--paper);}
.res-card h4{margin:0 0 4px;font-family:'Fraunces',serif;color:var(--head);font-size:1.02rem;}
.res-card p{margin:0 0 8px;font-size:.86rem;line-height:1.5;color:var(--ink-soft);}
.res-card a{color:var(--river);font-weight:600;font-size:.84rem;}
.res-tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--turmeric-light);color:var(--head);margin-bottom:6px;}
.res-tag.free{background:var(--ok-bg);color:var(--ok);}
.res-plan li{margin-bottom:6px;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.chip{border:1.5px solid var(--river-light);background:var(--card);color:var(--head);padding:7px 14px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.84rem;}
.chip.on{background:var(--river);color:#fff;border-color:var(--river);}
.res-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
.res-top .res-tag{margin-bottom:0;}
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.start-step{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:12px;padding:12px 14px;font-size:.9rem;line-height:1.45;}
.start-step b:first-child{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--river);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.9rem;}
table.plan-table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:.88rem;}
table.plan-table th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--river);padding:6px 10px;border-bottom:2px solid var(--paper-2);}
table.plan-table td{padding:10px;border-bottom:1px solid var(--paper-2);vertical-align:top;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.stat{background:var(--card);border:1px solid var(--paper-2);border-radius:12px;padding:12px 14px;text-align:center;}
.stat b{display:block;font-family:'Fraunces',serif;font-size:1.7rem;color:var(--head);}
.stat span{font-size:.76rem;color:var(--ink-soft);}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.set-grid label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--river);}
.set-grid select{padding:9px 10px;border-radius:9px;border:1.5px solid var(--paper-2);font-family:inherit;font-size:.9rem;background:var(--card);}
.flashcard{background:var(--card);border:1px solid var(--paper-2);border-radius:18px;padding:34px 22px;min-height:230px;text-align:center;box-shadow:0 6px 20px rgba(10,61,58,.08);cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;}
.card-vn{font-family:'Fraunces',serif;font-size:1.9rem;color:var(--head);font-weight:600;line-height:1.25;}
.card-fr{font-size:1.15rem;margin-top:6px;line-height:1.4;}
.flashcard .card-front .card-fr{font-size:1.5rem;font-family:'Fraunces',serif;color:var(--head);}
.card-sep{width:60%;border:none;border-top:1px dashed var(--paper-2);margin:20px 0;}
.card-progress{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:.85rem;font-weight:600;color:var(--river);}
.card-progress .bar{flex:1;height:8px;background:var(--paper-2);border-radius:6px;overflow:hidden;}
.card-progress .bar i{display:block;height:100%;background:var(--turmeric);}
.grade-row{display:flex;gap:10px;margin-top:14px;}
.grade{flex:1;border:none;border-radius:12px;padding:12px 6px;font-family:inherit;font-weight:700;font-size:.92rem;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;}
.grade small{font-weight:400;font-size:.72rem;opacity:.9;}
.grade.g0{background:var(--bad);}.grade.g1{background:var(--river);}.grade.g2{background:var(--turmeric);color:var(--head);}
.struct-wrap{margin-top:18px;border-top:1px dashed var(--paper-2);padding-top:14px;}
.struct-wrap h4{margin:0 0 10px;font-size:.95rem;color:var(--head);}
.struct{background:var(--paper);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.struct-formula{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--river);font-weight:600;margin-bottom:8px;}
.struct-parts{display:flex;flex-wrap:wrap;gap:6px;}
.sp{display:inline-flex;flex-direction:column;align-items:center;background:var(--card);border:1.5px solid var(--river-light);border-radius:9px;padding:5px 9px;text-align:center;}
.sp b{font-size:.98rem;color:var(--head);}
.sp i{font-size:.68rem;color:var(--ink-soft);font-style:normal;margin-top:2px;max-width:130px;}
.struct-fr{margin-top:8px;font-size:.88rem;color:var(--ink-soft);}
.search-box{width:100%;padding:11px 13px;border:1.5px solid var(--paper-2);border-radius:10px;font-family:inherit;font-size:1rem;background:var(--card);box-sizing:border-box;}
.srch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--paper-2);border-radius:12px;padding:10px 14px;margin-top:8px;}
.lv-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.84rem;}
.lv-row span{width:92px;flex-shrink:0;font-weight:600;color:var(--river);}
.lv-row .bar{flex:1;height:10px;background:var(--paper-2);border-radius:6px;overflow:hidden;}
.lv-row .bar i{display:block;height:100%;background:var(--river);}
.lv-row b{width:44px;text-align:right;font-size:.8rem;}
.wk-row{display:flex;gap:8px;justify-content:space-between;}
.wk{flex:1;text-align:center;font-size:.75rem;color:var(--ink-soft);}
.wk i{display:block;height:34px;border-radius:8px;background:var(--paper-2);margin-bottom:4px;}
.wk.on i{background:var(--turmeric);}
.wotd{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,var(--turmeric-light),var(--turmeric));color:#1F2A24;border-radius:14px;padding:12px 16px;margin-bottom:18px;}
.wotd-tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.8;}
.wotd-vn{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:600;margin-top:2px;}
.wotd-fr{font-size:.9rem;}
.wotd .chip{flex-shrink:0;background:rgba(255,255,255,.7);color:#0A3D3A;border-color:transparent;}
.wotd .audio-btn{background:rgba(255,255,255,.7)!important;color:#0A3D3A!important;}
.sidebar .wotd{flex-direction:column;align-items:flex-start;gap:8px;margin:0 0 14px;padding:11px 13px;}
.sidebar .wotd-vn{font-size:1.15rem;}
.sidebar .wotd .chip{padding:4px 10px;font-size:.76rem;}
.goal{background:var(--card);border:1px solid var(--paper-2);border-radius:12px;padding:10px 12px;margin:0 0 14px;font-size:.82rem;}
.goal-top{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:600;color:var(--river);}
.goal .bar{height:8px;background:var(--paper-2);border-radius:6px;overflow:hidden;}
.goal .bar i{display:block;height:100%;background:var(--turmeric);}
.card-ex{margin-top:14px;padding:10px 12px;background:var(--paper);border-radius:10px;text-align:left;font-size:.95rem;width:100%;}
.res-lvl{display:inline-block;font-size:.74rem;font-weight:700;color:var(--river);background:var(--paper);border-radius:8px;padding:2px 8px;margin:2px 0 6px;}
.nb-list{margin:10px 0 14px;max-height:340px;overflow-y:auto;border:1px solid var(--paper-2);border-radius:10px;}
.nb-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--paper-2);font-size:.9rem;cursor:pointer;}
.nb-row small{margin-left:auto;color:var(--ink-soft);font-size:.72rem;}

<script>
function speak(text, rate){
  if(!('speechSynthesis' in window)){ alert("La synthèse vocale n'est pas disponible sur ce navigateur."); return; }
  const synth = window.speechSynthesis;
  synth.cancel();
  const voices = synth.getVoices();
  const viVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('vi'));
  // On découpe en phrases : certains navigateurs coupent les longs textes
  const parts = String(text).split(/(?<=[.!?…])\s+/).map(s=>s.trim()).filter(Boolean);
  (parts.length?parts:[String(text)]).forEach(p=>{
    const u = new SpeechSynthesisUtterance(p);
    u.lang = 'vi-VN';
    u.rate = rate || 0.85;
    if(viVoice) u.voice = viVoice;
    synth.speak(u);
  });
}

    <ul>
      <li><b>tr / ch</b> — distingués au Sud (<span class="mono">tr</span> = son rétroflexe proche de « tch » appuyé), alors qu'au Nord les deux se prononcent « ch ».</li>
      <li><b>s / x</b> — distingués au Sud (<span class="mono">s</span> = son chuintant, proche du « sh »), fusionnés au Nord.</li>
      <li><b>d / gi / r</b> — au Sud, souvent prononcés proches d'un « y » français, et non « z » comme au Nord.</li>
      <li><b>v</b> — en parlé familier du Sud, tend aussi vers ce même « y ».</li>
      <li><b>finales -n/-ng et -t/-c</b> — tendent à se confondre au Sud selon la voyelle précédente.</li>
      <li><b>tons</b> — le Sud ne distingue que 5 tons à l'oral : le <i>hỏi</i> (ả) et le <i>ngã</i> (ã) se prononcent de la même façon, contre 6 tons au Nord.</li>

    <p>L'adjectif se place directement après le nom, sans copule (pas de « être ») : <i>Cô ấy đẹp.</i> (Elle est belle.)</p>

      <li><b>Comparatif de supériorité :</b> <span class="mono">A + adjectif + hơn + B</span> — <i>Anh cao hơn em.</i> (Il est plus grand que moi.)</li>
      <li><b>Superlatif :</b> <span class="mono">adjectif + nhất</span> — <i>Cô ấy đẹp nhất.</i> (Elle est la plus belle.)</li>
      <li><b>Égalité :</b> <span class="mono">A + adjectif + bằng + B</span> — <i>Nó cao bằng tui.</i> (Il est aussi grand que moi.)</li>

{
  id:12, level:2,
  title:"Thì trong câu",
  sub:"Marqueurs temporels : đã, đang, sẽ...",

  grammar:`
    <p>Sans conjugaison, le vietnamien exprime le temps avec des marqueurs placés <b>avant le verbe</b> (sauf « rồi » et « chưa » qui se placent en fin de phrase).</p>
    <ul>
      <li><span class="mono">đã</span> = passé accompli ; <span class="mono">đang</span> = action en cours ; <span class="mono">sẽ</span> = futur.</li>
      <li><span class="mono">Đã ăn chưa?</span> (« As-tu déjà mangé ? ») appelle la réponse <i>Rồi.</i> (« Oui, déjà. ») ou <i>Chưa.</i> (« Pas encore. »).</li>
      <li><span class="mono">Từng</span> marque une expérience vécue au moins une fois, sans préciser quand : <i>Tui từng ăn phở.</i> (« J'ai déjà mangé du phở [dans ma vie]. »)</li>
    </ul>

  ],
  grammar:`
    <p>Le vietnamien utilise souvent des connecteurs par paires, qui s'emploient ensemble dans la même phrase :</p>
    <ul>
      <li><b>Cause/conséquence :</b> <span class="mono">Vì...nên...</span> — <i>Vì trời mưa nên tui ở nhà.</i> (Parce qu'il pleut, donc je reste à la maison.)</li>
      <li><b>Condition :</b> <span class="mono">Nếu...thì...</span> — <i>Nếu rảnh thì đi chơi.</i> (Si t'es libre, alors on sort.)</li>
      <li><b>Concession :</b> <span class="mono">Tuy...nhưng...</span> — <i>Tuy mắc nhưng ngon.</i> (Bien que ce soit cher, c'est bon.)</li>
      <li><b>Simultanéité :</b> <span class="mono">Vừa...vừa...</span> — <i>Vừa ăn vừa nói chuyện.</i> (Manger tout en discutant.)</li>
    </ul>
    <div class="callout">« Hoặc » relie deux choix dans une affirmation, « hay » s'utilise surtout dans une question : <i>Đi xe máy hay xe buýt?</i> (En moto ou en bus ?)</div>

{

  intro:"Le vietnamien n'a pas de passif grammatical au sens strict, mais deux mots-outils très fréquents, « bị » et « được », permettent d'exprimer qu'on subit une action — l'un avec une nuance négative, l'autre positive.",

  grammar:`
    <p>Ces locutions prépositionnelles introduisent généralement un point de vue, une base ou une source d'information en tête de phrase.</p>
    <ul>
      <li><span class="mono">Đối với + personne/sujet, ...</span> introduit un point de vue : <i>Đối với người miền Tây, chợ nổi là một phần cuộc sống.</i> (Pour les gens du Sud-Ouest, le marché flottant fait partie de la vie.)</li>

      <li><span class="mono">Ngày càng + adjectif</span> exprime une évolution progressive dans le temps : <i>Thành phố ngày càng đông đúc.</i> (La ville devient de plus en plus surpeuplée.)</li>

      <li><i>Còn về giá cả thì hơi mắc.</i> (Quant au prix, c'est un peu cher.)</li>

    </ul>

{

  title:"Câu bị động nâng cao & đảo ngữ",

  intro:"Au-delà du passif simple bị/được (niveau 3), ce niveau explore des nuances plus fines de la voix passive et l'inversion de l'ordre des mots pour mettre en relief un élément.",
  vocab:[
    {vn:"bị/được + verbe + bởi",ipa:"",fr:"passif avec agent explicite",note:"registre plus soutenu, rare à l'oral"},
    {vn:"chịu",ipa:"",fr:"subir, endurer (nuance de résignation)",note:"proche de « bị » mais insiste sur l'endurance"},
    {vn:"mắc phải",ipa:"",fr:"être atteint de, contracter (problème, maladie)",note:""},
    {vn:"cái này thì",ipa:"",fr:"structure d'inversion emphatique (objet en tête)",note:"Cái này thì tui thích. = Ça, j'aime bien."},
    {vn:"chính vì...mà",ipa:"",fr:"c'est justement parce que...que",note:"combine cause et mise en relief"},
    {vn:"sở dĩ...là vì",ipa:"",fr:"si...c'est parce que (structure explicative soutenue)",note:""}
  ],
  grammar:`
    <p>Le passif avec agent explicite est plus fréquent à l'écrit : <i>Dự án được thực hiện bởi một nhóm chuyên gia.</i> (Le projet a été réalisé par une équipe d'experts.)</p>
    <ul>
      <li><span class="mono">chịu</span> ajoute une nuance d'endurance/résignation à « bị » : <i>Anh ấy phải chịu nhiều áp lực.</i> (Il doit endurer beaucoup de pression.)</li>
      <li>Inversion emphatique : placer l'objet en tête de phrase suivi de « thì » met en relief cet élément : <i>Cái này thì tui không biết.</i> (Ça, par contre, je ne sais pas.)</li>
      <li><span class="mono">Sở dĩ...là vì...</span> est une structure explicative soutenue, plus élaborée que « vì...nên » : <i>Sở dĩ nó nghỉ học là vì bị bệnh.</i> (S'il a arrêté l'école, c'est parce qu'il était malade.)</li>

{
  id:43, level:6,
  title:"Sắc thái tình thái",
  sub:"Nuances modales et particules expressives avancées",
  intro:"Au niveau avancé, de petites particules en fin de phrase expriment des nuances fines — hésitation, regret, évidence rhétorique — souvent intraduisibles mot à mot.",
  vocab:[

    {vn:"chắc",ipa:"",fr:"probablement, sans doute",note:"marque une supposition"},
    {vn:"hình như",ipa:"",fr:"il semble que, on dirait que",note:""}

  grammar:`
    <p>Ces particules ne changent pas le sens propositionnel mais l'attitude du locuteur envers ce qu'il dit — un des aspects les plus subtils et les plus tardifs à maîtriser.</p>
    <ul>
      <li><span class="mono">chăng / ru / thay</span> appartiennent à un registre littéraire, poétique ou classique — on les rencontre en littérature, chansons anciennes, rarement à l'oral courant.</li>
      <li><span class="mono">cơ mà</span> et <span class="mono">đấy chứ</span> corrigent gentiment une supposition erronée de l'interlocuteur : <i>Tui thích món đó đấy chứ!</i> (Mais si, j'aime bien ce plat, figure-toi !)</li>
      <li><span class="mono">chắc</span> et <span class="mono">hình như</span> expriment un degré d'incertitude : <i>Chắc trời sắp mưa.</i> (Il va sans doute pleuvoir.) vs <i>Hình như trời sắp mưa.</i> (On dirait qu'il va pleuvoir — plus incertain encore.)</li>
    </ul>
    <div class="callout">« Chăng », « ru » et « thay » sont surtout utiles pour lire de la poésie ou des textes classiques vietnamiens — ils sont quasi absents du parler quotidien du Sud aujourd'hui.</div>

      <li>Les mots Hán Việt sont souvent composés de deux syllabes sino-vietnamiennes, chacune porteuse de sens : <span class="mono">giáo dục</span> = « enseigner » + « nourrir/former ».</li>

    <p>Ces affixes sino-vietnamiens sont très productifs : une fois reconnus, ils permettent de déduire le sens de mots composés inconnus.</p>
    <ul>
      <li><span class="mono">vô- / bất- / phi-</span> forment tous une négation, mais avec des nuances : vô- (absence), bất- (contraire), phi- (registre scientifique/officiel).</li>
      <li><span class="mono">-hóa</span> transforme un adjectif/nom en verbe de transformation : <i>công nghiệp hóa</i> (industrialiser), <i>toàn cầu hóa</i> (mondialiser).</li>
      <li><span class="mono">-giả / -viên</span> désignent une personne selon son rôle : <i>tác giả</i> (l'auteur), <i>diễn giả</i> (l'orateur), <i>nhân viên</i> (l'employé).</li>
    </ul>
    <div class="callout">Un bon réflexe de lecture avancée : face à un mot Hán Việt inconnu, chercher s'il contient un de ces préfixes/suffixes pour en déduire au moins la catégorie de sens.</div>
  `,

    <p>La poésie classique vietnamienne, notamment le mètre « lục bát » (vers alternés de 6 et 8 syllabes), utilise des pronoms et un vocabulaire différents du vietnamien courant.</p>
    <ul>
      <li><span class="mono">ta</span> remplace « tui/tôi » dans un registre grandiose ou intime-poétique ; <span class="mono">nàng/chàng</span> remplacent « cô ấy/anh ấy » pour évoquer des amants dans un contexte littéraire.</li>
      <li>Ce vocabulaire n'est presque plus utilisé à l'oral aujourd'hui, sauf dans les chansons (đờn ca tài tử du Sud, boléro) et les récitations classiques.</li>
      <li>Les figures de style comme <span class="mono">ẩn dụ</span> (métaphore) et <span class="mono">nhân hóa</span> (personnification) sont essentielles pour analyser un texte littéraire vietnamien.</li>
    </ul>
    <div class="callout">Le boléro et le đờn ca tài tử, genres musicaux très populaires dans le Sud, empruntent énormément à ce vocabulaire poétique classique — les reconnaître aide à comprendre les paroles de chansons.</div>

  grammar:`
    <p>Voici un court extrait de style journalistique. Lisez-le et repérez les structures des unités précédentes.</p>
    <div class="callout">
      <p style="margin:0 0 8px;"><b>Đô thị hóa ở miền Nam: cơ hội và thách thức</b></p>
      <p style="margin:0 0 8px;">Theo thống kê gần đây, tốc độ đô thị hóa ở các tỉnh miền Nam đã gia tăng đáng kể trong thập kỷ qua. Một mặt, quá trình này thúc đẩy phát triển kinh tế; mặt khác, nó cũng đặt ra nhiều vấn đề cấp bách như ô nhiễm môi trường và thiếu nhà ở. Xét cho cùng, sở dĩ nhiều địa phương gặp khó khăn là vì thiếu một chiến lược phát triển bền vững ngay từ đầu. Do đó, các chuyên gia đề xuất rằng chính quyền cần triển khai chính sách một cách đồng bộ hơn.</p>
      <p style="margin:0;font-size:.85rem;color:var(--ink-soft);"><i>Traduction : Selon des statistiques récentes, la vitesse d'urbanisation dans les provinces du Sud a considérablement augmenté au cours de la dernière décennie. D'un côté, ce processus stimule le développement économique ; d'un autre côté, il pose aussi de nombreux problèmes urgents comme la pollution environnementale et le manque de logements. Tout compte fait, si de nombreuses localités rencontrent des difficultés, c'est parce qu'il leur manquait une stratégie de développement durable dès le départ. C'est pourquoi les experts proposent que les autorités mettent en œuvre une politique plus cohérente.</i></p>
    </div>
    <ul>
      <li>Repérez : một mặt...mặt khác (unité 39), sở dĩ...là vì (unité 38), xét cho cùng (unité 39), do đó (unité 28), et plusieurs mots Hán Việt/affixes (đô thị hóa, bền vững, đề xuất).</li>
    </ul>
  `,

  ],

    <p>Récapitulatif des points clés du niveau 2 :</p>

  intro:"Au niveau C1, on ne se contente plus d'aligner des idées : on les nuance. Les structures de concession (« bien que », « même si »), de restriction (« sauf », « à moins que ») et de condition minimale (« pourvu que ») permettent de défendre un point de vue sans le caricaturer.",

  grammar:`
    <p><b>1. Concession.</b> <span class="mono">Tuy / Mặc dù + A, (nhưng) B</span> : <i>Tuy nhà hơi xa, (nhưng) giá rất hợp lý.</i> (Bien que la maison soit un peu loin, le prix est très raisonnable.) Contrairement au français, « nhưng » est facultatif mais très fréquent à l'oral.</p>
    <p><b>2. Concession hypothétique.</b> <span class="mono">Dù / Cho dù + A, B + cũng / vẫn</span> : <i>Dù giá có rẻ đến đâu, tui cũng hông mua.</i> (Même si c'était bon marché, je n'achèterais pas.) Le motif « có ... đến đâu » = « aussi ... que ce soit ».</p>
    <p><b>3. Exception et condition.</b></p>
    <ul>

      <li><span class="mono">Bất kể + mot interrogatif, ... đều / cũng</span> : <i>Bất kể ai hỏi, anh cũng nói vậy.</i></li>
    </ul>
    <div class="callout">Au C1 on combine souvent deux nuances : <i>Tuy vậy, chỉ có điều là...</i> pour signaler une réserve polie avant une critique.</div>

  grammar:`

    <p><b>2. Concéder puis contrer</b> : <span class="mono">Không phủ nhận rằng A, song / nhưng B</span>. <i>Không phủ nhận rằng xe máy tiện, nhưng nó gây ô nhiễm nhiều.</i></p>

  grammar:`
    <p>Les particules finales se combinent et se modulent : <i>Hổng phải vậy đâu nghen!</i> = « Ce n'est vraiment pas ça, hein ! ».</p>
    <ul>
      <li><b>chớ / chứ</b> : <i>Ngon chớ!</i> (Mais bien sûr que c'est bon !) ; <i>Con biết chớ.</i> (Bien sûr que je sais.)</li>
      <li><b>đâu</b> après une négation : <i>Tui đâu có nói vậy.</i> (Je n'ai jamais dit ça.) <i>Có sao đâu.</i> (Ce n'est pas grave du tout.)</li>
      <li><b>mà</b> final = reproche doux ou justification : <i>Thì tui nói rồi mà.</i> (Mais je te l'avais dit.)</li>
      <li><b>nè</b> : accompagne un geste : <i>Cơm nè!</i> (Voilà le riz !) <i>Coi nè!</i> (Regarde !)</li>
      <li><b>nghen / hen / hén</b> : <i>Mai gặp nghen.</i> (À demain, hein.)</li>
    </ul>
    <div class="callout">Les particules s'empilent rarement plus de deux : « đâu nghen », « mà nha », « chớ bộ ». À l'écrit formel, on les supprime presque toutes.</div>

    <p><b>Décrire un symptôme :</b> <span class="mono">bị + symptôme</span> ou <span class="mono">đau/nhức + partie du corps</span>. <i>Tui bị sốt hai ngày rồi.</i> (J'ai de la fièvre depuis deux jours.) <i>Con đau bụng từ hồi sáng.</i></p>
    <p><b>Durée :</b> <span class="mono">từ + moment / + durée + rồi</span> : <i>từ hôm qua</i> (depuis hier), <i>ba ngày rồi</i> (depuis trois jours).</p>

    <p><b>Plan standard</b> : <i>Mở bài</i> (présente le sujet) → <i>Thân bài</i> (2 ou 3 arguments, chacun avec un dẫn chứng) → <i>Kết bài</i> (résumé + ouverture).</p>
    <p><b>Enchaîner :</b> <i>Trước hết... Thứ hai... Cuối cùng...</i> ; <i>Hơn nữa... Ngoài ra...</i> ; <i>Một mặt..., mặt khác...</i>.</p>
    <p><b>Intensifier :</b> <span class="mono">Không những A mà còn B</span> : <i>Học tiếng Việt không những giúp giao tiếp mà còn giúp hiểu văn hóa.</i></p>
    <p><b>Conclure :</b> <i>Tóm lại... / Có thể nói rằng... / Từ những điều trên, có thể thấy...</i></p>
    <div class="callout">Exemple d'accroche pour un exposé : <i>Hôm nay tôi xin trình bày về...</i> Pour clore : <i>Xin cảm ơn quý vị đã lắng nghe.</i></div>

    {sp:"B",vn:"Vâng ạ. Cuối cùng, em sẽ tóm lại bằng một câu thật ngắn.",fr:"D'accord. Enfin, je résumerai en une phrase bien courte."}

      <li><b>Nhân hóa</b> : <i>Con thuyền thở dài giữa trưa.</i> (La barque soupire en plein midi.) — attribue un trait humain.</li>

    <p><b>Rythme :</b> la prose littéraire joue sur les <i>từ láy</i> (lững lờ, mênh mông, rì rầm) et sur des phrases brèves en cascade. Les verbes sensoriels abondent : <i>nghe, thấy, ngửi thấy</i>.</p>

/* ===== Unités de vocabulaire thématiques (exercices générés automatiquement) ===== */
function autoEx(vocab){
  const clean=s=>String(s).replace(/\s*\(.*?\)/g,'').trim();
  const shortFr=s=>{const t=clean(s); return t.length>46? t.slice(0,44)+'…' : t;};
  const n=vocab.length, mcq=[], listen=[], fill=[];
  const step=Math.max(1,Math.floor(n/5));
  for(let i=0;i<5;i++){
    const k=(i*step+1)%n; const v=vocab[k];
    const d1=vocab[(k+3)%n], d2=vocab[(k+7)%n];
    const opts=[shortFr(d1.fr),shortFr(d2.fr)]; const pos=i%3; opts.splice(pos,0,shortFr(v.fr));
    mcq.push({q:'« '+v.vn+' » signifie :',options:opts,a:pos});
  }
  for(let i=0;i<3;i++){
    const k=(i*step+2)%n; const v=vocab[k];
    const d1=vocab[(k+4)%n], d2=vocab[(k+9)%n];
    const opts=[shortFr(d1.fr),shortFr(d2.fr)]; const pos=(i+1)%3; opts.splice(pos,0,shortFr(v.fr));
    listen.push({word:v.vn.split(' / ')[0],options:opts,a:pos});
  }
  const fillPool=vocab.filter(v=>v.vn.split(/\s*\/\s*/)[0].trim().split(/\s+/).length<=2);
  for(let i=0;i<4 && fillPool.length;i++){
    const v=fillPool[(i*3+1)%fillPool.length];
    const a=v.vn.split(/\s*\/\s*/)[0].trim();
    fill.push({sentence:'« '+shortFr(v.fr)+' » se dit en vietnamien : ___',answer:a,hint:a.charAt(0)+'… ('+a.split(/\s+/).length+' mot'+(a.split(/\s+/).length>1?'s':'')+')'});
  }
  return {mcq,listen,fill};
}
const V=(id,level,title,sub,intro,tip,rows,dialogue)=>{
  const vocab=rows.map(r=>({vn:r[0],ipa:"",fr:r[1],note:r[2]||""}));
  const notes=vocab.filter(v=>v.note).slice(0,6).map(v=>`<li><b>${v.vn}</b> — ${v.note}</li>`).join('');
  units.push({id,level,vocabUnit:true,title,sub,intro,vocab,
    grammar:`<p>${tip}</p>${notes?'<p><b>À retenir :</b></p><ul>'+notes+'</ul>':''}<div class="callout">Méthode : lis la liste à voix haute en cliquant sur 🔊, puis passe aux exercices. Ajoute ensuite ces mots à tes <b>cartes mémoire</b> (menu à gauche) pour les retenir durablement.</div>`,
    dialogue,ex:autoEx(vocab)});
};

V(75,3,"Thiên nhiên & động vật miền Tây","Fleuves, vergers, fruits et animaux du Delta du Mékong",

S(1,{
 r:["Giọng Sài Gòn","Tôi tên là Minh. Tôi sống ở Sài Gòn. Người Sài Gòn nói « hông » thay cho « không », và nói « dạ » khi trả lời người lớn. Buổi sáng, tôi uống cà phê sữa đá với bạn. Chúng tôi nói chuyện rất vui.","Je m'appelle Minh. Je vis à Saigon. Les gens de Saigon disent « hông » au lieu de « không » et « dạ » pour répondre aux aînés. Le matin, je bois un cà phê sữa đá avec un ami. Nous discutons avec joie.",

 l:["Chào anh. Tôi tên là Lan. Tôi là người miền Nam. Tôi thích ăn phở và uống trà đá.","Bonjour. Je m'appelle Lan. Je suis du Sud. J'aime manger du phở et boire du thé glacé.",

S(2,{
 r:["Gặp gỡ trong gia đình","Hôm nay tôi gặp ba mẹ của bạn gái. Tôi chào « Dạ, con chào bác, con chào cô ». Mẹ bạn tôi cười và nói « Chào con, vô nhà ngồi chơi nha ». Tôi gọi người lớn là « bác, cô, chú » và gọi mình là « con ».","Aujourd'hui je rencontre les parents de ma petite amie. Je dis « Bonjour (bác), bonjour (cô) ». Sa mère sourit et dit « Bienvenue, entre t'asseoir ». J'appelle les aînés « bác, cô, chú » et je m'appelle « con ».",

 l:["Chào chị. Em là Hùng. Em học ở Sài Gòn. Chị tên là gì ạ? Dạ, em rất vui được gặp chị.","Bonjour grande sœur. Je suis Hùng. J'étudie à Saigon. Comment vous appelez-vous ? Je suis ravi de vous rencontrer.",

});
S(3,{
 r:["Ở chợ Bến Thành","Chị Hoa đi chợ mua trái cây. Cô bán hàng nói: « Xoài này hai mươi lăm ngàn một ký ». Chị Hoa trả giá: « Hai mươi ngàn đi cô ». Cuối cùng chị mua hai ký xoài với giá bốn mươi hai ngàn.","Chị Hoa va au marché acheter des fruits. La vendeuse dit : « Ces mangues coûtent 25 000 le kilo ». Chị Hoa marchande : « 20 000, allez ». Finalement elle achète deux kilos de mangues pour 42 000.",

S(4,{
 r:["Hai người hai miền","Lan là người Hà Nội, còn Thảo là người Sài Gòn. Lan nói « lợn », « thìa », « bát ». Thảo nói « heo », « muỗng », « chén ». Hai người cười vì mỗi người dùng một từ khác nhau.","Lan est de Hà Nội, Thảo de Saigon. Lan dit « lợn », « thìa », « bát ». Thảo dit « heo », « muỗng », « chén ». Elles rient car chacune emploie un mot différent.",

S(6,{
 r:["Quán cơm tấm","Tôi vào quán cơm tấm gần nhà. Tôi gọi một dĩa cơm sườn trứng và một ly trà đá. Anh chủ quán hỏi: « Con ăn thêm gì nữa không? ». Tôi nói: « Dạ hông, cho con tính tiền ». Hết bốn mươi lăm ngàn.","J'entre dans un restaurant de cơm tấm près de chez moi. Je commande une assiette de riz brisé avec côtelette et œuf, et un thé glacé. Le patron demande : « Tu veux autre chose ? ». Je dis : « Non, l'addition s'il vous plaît ». 45 000.",
  [["Qu'a-t-il commandé ?",["un phở","du riz brisé avec côtelette","une soupe"],1],["Il boit :",["du thé glacé","du café","de la bière"],0],["Total :",["25 000","45 000","65 000"],1]]],
 l:["Cho tôi một tô phở bò và một ly cà phê sữa đá. Phở bò hông hành nha. Bao nhiêu tiền vậy anh?","Donnez-moi un bol de phở au bœuf et un café au lait glacé. Le phở sans oignons, s'il vous plaît. Combien ça fait ?",
  [["Le client commande :",["du phở au bœuf","des nouilles sautées","du riz"],0],["Il ne veut pas :",["d'oignons","de viande","de glace"],0],["Il demande :",["l'addition","le menu","l'adresse"],0]]],
 w:["Écris ta commande dans un quán : un plat, une boisson, et demande l'addition.",["cho","một","tính tiền"],"Cho con một dĩa cơm và một ly trà đá. Cho con tính tiền nha.","Je voudrais une assiette de riz et un thé glacé. L'addition, s'il vous plaît."],
 s:["Commande à voix haute un phở et un café, puis demande l'addition.",["phở","cà phê","tính tiền"],"Cho con một tô phở và một ly cà phê. Cho con tính tiền.","Un phở et un café, l'addition."]
});
S(7,{
 r:["Gia đình tôi","Gia đình tôi có năm người: ba, má, anh hai, chị ba và tôi. Anh hai làm bác sĩ, chị ba làm giáo viên. Cuối tuần cả nhà ăn cơm chung. Má nấu món canh chua cá lóc rất ngon.","Ma famille compte cinq personnes : papa, maman, mon frère aîné (anh hai), ma sœur (chị ba) et moi. Le grand frère est médecin, ma sœur est enseignante. Le week-end toute la famille mange ensemble. Maman cuisine une soupe aigre au poisson très bonne.",
  [["Combien de personnes ?",["trois","cinq","sept"],1],["Que fait « anh hai » ?",["médecin","enseignant","cuisinier"],0],["Quel plat prépare la mère ?",["phở","canh chua cá lóc","bánh mì"],1]]],
 l:["Ông nội tôi sáu mươi lăm tuổi. Bà nội sống với chúng tôi. Ông bà có ba người con và năm đứa cháu.","Mon grand-père paternel a 65 ans. Ma grand-mère vit avec nous. Ils ont trois enfants et cinq petits-enfants.",
  [["Âge du grand-père :",["55","65","75"],1],["Combien d'enfants ont-ils ?",["deux","trois","quatre"],1],["Combien de petits-enfants ?",["trois","cinq","sept"],1]]],
 w:["Décris ta famille en 3 phrases (qui, combien, métiers).",["gia đình","người","làm"],"Gia đình tôi có bốn người. Ba tôi làm kỹ sư. Mẹ tôi làm giáo viên.","Ma famille a quatre personnes. Mon père est ingénieur. Ma mère est enseignante."],
 s:["Présente ta famille à quelqu'un au marché : combien de personnes.",["gia đình","người","có"],"Gia đình con có bốn người.","Ma famille compte quatre personnes."]
});
S(8,{
 r:["Một ngày của Nam","Nam thức dậy lúc sáu giờ rưỡi. Bảy giờ anh đi làm bằng xe máy. Mười hai giờ trưa anh ăn cơm. Sáu giờ chiều anh về nhà. Thứ bảy và chủ nhật, anh nghỉ ngơi.","Nam se réveille à 6 h 30. À 7 h il va travailler à moto. À midi il mange. À 18 h il rentre. Le samedi et le dimanche, il se repose.",
  [["Heure du réveil :",["6 h","6 h 30","7 h"],1],["Il se déplace :",["à moto","à vélo","en bus"],0],["Quand se repose-t-il ?",["lundi","samedi et dimanche","tous les jours"],1]]],
 l:["Hôm nay là thứ ba, ngày mười lăm tháng mười một. Sáng nay tôi họp lúc chín giờ. Chiều tôi đi khám bệnh lúc ba giờ.","Aujourd'hui c'est mardi 15 novembre. Ce matin, j'ai une réunion à 9 h. L'après-midi, un rendez-vous médical à 15 h.",
  [["Jour :",["lundi","mardi","jeudi"],1],["Réunion à :",["9 h","10 h","3 h"],0],["L'après-midi :",["un voyage","un rendez-vous médical","un cours"],1]]],
 w:["Écris ta journée en 3 phrases avec des heures.",["giờ","tối","tôi"],"Tôi thức dậy lúc bảy giờ. Tám giờ tôi đi làm. Sáu giờ tối tôi về nhà.","Je me réveille à 7 h. À 8 h je vais travailler. À 18 h je rentre."],
 s:["Dis à voix haute l'heure à laquelle tu te lèves et tu manges.",["giờ","thức","ăn"],"Tôi thức dậy lúc bảy giờ. Tôi ăn trưa lúc mười hai giờ.","Je me lève à 7 h. Je déjeune à midi."]
});
S(9,{
 r:["Trong nhà bếp","Trong nhà bếp có cái bàn, cái tủ lạnh và cái nồi. Trên bàn có đĩa, muỗng và đũa. Má đang nấu cơm. Con mèo nằm dưới ghế.","Dans la cuisine il y a une table, un frigo et une casserole. Sur la table, des assiettes, des cuillères et des baguettes. Maman cuisine le riz. Le chat dort sous la chaise.",
  [["Où est le chat ?",["sur la table","sous la chaise","dehors"],1],["Que fait la mère ?",["elle dort","elle cuisine le riz","elle lit"],1],["Sur la table il y a :",["des livres","des assiettes et des baguettes","un ordinateur"],1]]],
 l:["Xin lỗi, nhà vệ sinh ở đâu? Ở cuối hành lang bên trái. Cảm ơn nha. Không có chi.","Excusez-moi, où sont les toilettes ? Au bout du couloir à gauche. Merci. Je vous en prie.",
  [["On cherche :",["la cuisine","les toilettes","la gare"],1],["Où ?",["à gauche au bout du couloir","à droite","en haut"],0],["Réponse finale :",["je vous en prie","non","demain"],0]]],
 w:["Décris ta chambre : 3 objets et leur place.",["trong","có","trên"],"Trong phòng tôi có một cái giường. Trên bàn có cái laptop. Dưới ghế có đôi dép.","Dans ma chambre il y a un lit. Sur le bureau un ordinateur. Sous la chaise des tongs."],
 s:["Demande où se trouve la cuisine et réponds « en haut ».",["ở đâu","nhà bếp","trên"],"Nhà bếp ở đâu vậy? Dạ, ở trên lầu.","Où est la cuisine ? En haut."]
});
S(10,{
 r:["Tuần đầu ở Sài Gòn","Tuần đầu ở Sài Gòn, tôi ở nhà của bác Tư. Mỗi sáng tôi ăn bánh mì và uống cà phê. Bác Tư nói: « Con học tiếng Việt chăm quá! ». Tôi mua trái cây ở chợ và tập trả giá. Tôi rất vui.","Ma première semaine à Saigon, je loge chez bác Tư. Chaque matin je mange un bánh mì et bois un café. Bác Tư dit : « Tu étudies le vietnamien avec beaucoup d'application ! ». J'achète des fruits au marché et m'exerce à marchander. Je suis très heureux.",
  [["Chez qui loge-t-il ?",["bác Tư","cô Hoa","anh Nam"],0],["Au petit-déjeuner :",["phở","bánh mì et café","riz"],1],["Il s'exerce à :",["marchander","conduire","chanter"],0]]],
 l:["Chào bà. Cho tôi hai ký chuối. Hai ký bao nhiêu tiền? Bốn mươi ngàn. Dạ, cảm ơn bà.","Bonjour madame. Deux kilos de bananes. Combien pour deux kilos ? 40 000. Merci madame.",
  [["Combien de kilos ?",["un","deux","trois"],1],["Prix :",["30 000","40 000","50 000"],1],["Le client est :",["poli","fâché","pressé"],0]]],
 w:["Résume ta journée type en 4 phrases (réveil, repas, famille, plaisir).",["tôi","ăn","gia đình"],"Tôi thức dậy lúc sáu giờ. Tôi ăn sáng với gia đình. Tôi đi chợ mua trái cây. Tôi thích buổi tối.","Je me réveille à 6 h. Je prends le petit déjeuner en famille. Je vais au marché. J'aime la soirée."],
 s:["Présente-toi, dis ta famille et ce que tu manges le matin.",["tên","gia đình","ăn"],"Con tên là Anna. Gia đình con có bốn người. Sáng con ăn bánh mì.","Je m'appelle Anna. Ma famille a quatre personnes. Le matin je mange du pain."]
});

S(11,{
 r:["Hai căn nhà","Nhà của bác Năm to hơn nhà của chú Sáu, nhưng nhà chú Sáu đẹp hơn. Nhà bác Năm cũ và hơi tối, còn nhà chú Sáu mới và rất sáng. Ai cũng nói căn nhà đẹp nhất xóm là nhà chú Sáu.","La maison de bác Năm est plus grande que celle de chú Sáu, mais celle de chú Sáu est plus belle. Celle de bác Năm est vieille et un peu sombre, alors que celle de chú Sáu est neuve et très lumineuse. Tout le monde dit que la plus belle maison du quartier est celle de chú Sáu.",
  [["Quelle maison est la plus grande ?",["chú Sáu","bác Năm","les deux"],1],["Quelle maison est la plus lumineuse ?",["bác Năm","chú Sáu","aucune"],1],["La plus belle du quartier :",["bác Năm","chú Sáu","cô Ba"],1]]],
 l:["Chị Mai cao hơn em gái, nhưng em gái chị Mai nhanh nhẹn hơn. Hai chị em đều có mái tóc dài và đen. Chị Mai hiền, còn em gái thì hơi nghịch.","Chị Mai est plus grande que sa petite sœur, mais celle-ci est plus vive. Les deux ont des cheveux longs et noirs. Chị Mai est douce, sa sœur un peu espiègle.",
  [["Qui est la plus grande ?",["Mai","sa sœur","toutes deux"],0],["Comment est la sœur ?",["douce","espiègle","timide"],1],["Les cheveux sont :",["courts","longs et noirs","blonds"],1]]],
 w:["Compare deux personnes ou deux objets (plus grand, plus beau, plus cher) en 2–3 phrases.",["hơn","nhất","đẹp"],"Căn nhà này lớn hơn căn nhà kia. Căn nhà đó đẹp nhất. Giá của nó mắc hơn.","Cette maison est plus grande que l'autre. Celle-là est la plus belle. Son prix est plus élevé."],
 s:["Compare deux plats que tu aimes en disant lequel est meilleur.",["hơn","ngon","nhất"],"Phở ngon hơn bún, nhưng cơm tấm ngon nhất.","Le phở est meilleur que le bún, mais le cơm tấm est le meilleur."]
});
S(12,{
 r:["Ngày hôm qua, hôm nay, ngày mai","Hôm qua tôi đã đi chợ. Hôm nay tôi đang học tiếng Việt. Ngày mai tôi sẽ đi thăm bà ngoại. Tôi chưa gặp bà ba tháng rồi. Tôi sắp mua vé xe đò rồi.","Hier je suis allé au marché. Aujourd'hui j'étudie le vietnamien. Demain j'irai voir ma grand-mère maternelle. Je ne l'ai pas vue depuis trois mois. Je vais bientôt acheter un billet de car.",
  [["Que fait-il en ce moment ?",["il va au marché","il étudie le vietnamien","il voyage"],1],["Demain :",["il visite sa grand-mère","il travaille","il dort"],0],["Depuis combien de temps ne l'a-t-il pas vue ?",["un mois","trois mois","un an"],1]]],
 l:["Tôi đã làm việc ở đây ba năm. Bây giờ tôi đang chuẩn bị chuyển sang công ty khác. Tháng sau tôi sẽ bắt đầu công việc mới.","Je travaille ici depuis trois ans. Maintenant je me prépare à changer d'entreprise. Le mois prochain je commencerai un nouveau travail.",
  [["Depuis combien d'années ?",["deux","trois","cinq"],1],["En ce moment :",["il se prépare à partir","il est en vacances","il est malade"],0],["Quand le nouveau travail ?",["la semaine prochaine","le mois prochain","l'an prochain"],1]]],
 w:["Écris ce que tu as fait hier, ce que tu fais maintenant et ce que tu feras demain (đã, đang, sẽ).",["đã","đang","sẽ"],"Hôm qua tôi đã đi làm. Bây giờ tôi đang ăn cơm. Ngày mai tôi sẽ đi chơi.","Hier je suis allé travailler. Maintenant je mange. Demain j'irai me promener."],
 s:["Dis à voix haute ce que tu fais maintenant et ce que tu feras demain.",["đang","sẽ","ngày mai"],"Bây giờ tôi đang học bài. Ngày mai tôi sẽ đi chợ.","Maintenant j'étudie. Demain j'irai au marché."]
});
S(13,{
 r:["Đi tới Chợ Lớn","Từ nhà tôi đến Chợ Lớn đi bằng xe buýt khoảng bốn mươi phút. Xuống xe, bạn đi thẳng, rẽ phải ở ngã tư, rồi đi thêm trăm mét là tới. Nếu đi taxi thì nhanh hơn nhưng mắc hơn.","De chez moi à Chợ Lớn il faut environ quarante minutes en bus. En descendant, allez tout droit, tournez à droite au carrefour, puis marchez cent mètres. En taxi c'est plus rapide mais plus cher.",
  [["Durée en bus :",["20 min","40 min","60 min"],1],["Au carrefour :",["à gauche","à droite","tout droit"],1],["Taxi :",["plus lent et moins cher","plus rapide et plus cher","gratuit"],1]]],
 l:["Xin lỗi, bến xe ở đâu ạ? Anh đi thẳng, tới đèn đỏ thì quẹo trái. Bến xe nằm bên phải, gần ngân hàng.","Excusez-moi, où est la gare routière ? Allez tout droit, au feu rouge tournez à gauche. La gare est à droite, près de la banque.",
  [["Que cherche-t-on ?",["la gare routière","la poste","l'école"],0],["Au feu rouge :",["à droite","à gauche","tout droit"],1],["Près de :",["la banque","l'hôpital","le marché"],0]]],
 w:["Explique à un touriste comment aller de ton quartier au marché (3 indications).",["đi thẳng","rẽ","gần"],"Anh đi thẳng, rẽ phải ở ngã tư, chợ ở gần ngân hàng.","Allez tout droit, tournez à droite au carrefour, le marché est près de la banque."],
 s:["Demande ton chemin à un passant pour aller à la poste.",["xin lỗi","bưu điện","ở đâu"],"Xin lỗi, bưu điện ở đâu vậy anh?","Excusez-moi, où est la poste ?"]
});
S(14,{
 r:["Chuyến đi bị hỏng","Sáng nay tôi định đi Vũng Tàu chơi, nhưng trời mưa to. Vì vậy, tôi ở nhà và nấu ăn. Sau đó, bạn gọi điện rủ tôi đi cà phê. Cuối cùng, hai đứa ngồi trong quán suốt buổi chiều.","Ce matin je comptais aller à Vũng Tàu, mais il pleuvait à verse. Donc je suis resté cuisiner. Ensuite un ami m'a appelé pour un café. Finalement nous sommes restés au café tout l'après-midi.",
  [["Pourquoi n'est-il pas allé à Vũng Tàu ?",["il pleuvait","il était fatigué","il était malade"],0],["Que fait-il d'abord ?",["il cuisine","il dort","il part"],0],["À la fin :",["il va à Vũng Tàu","il passe l'après-midi au café","il rentre chez sa mère"],1]]],
 l:["Tôi thích Sài Gòn vì thức ăn ngon và người dân thân thiện. Tuy nhiên, giao thông ở đây hơi hỗn loạn. Dù vậy, tôi vẫn muốn sống ở đây lâu dài.","J'aime Saigon parce que la nourriture est bonne et les gens sont chaleureux. Cependant, la circulation est un peu chaotique. Malgré cela, j'ai envie d'y vivre longtemps.",
  [["Pourquoi aime-t-il Saigon ?",["nourriture et gens","le climat froid","les montagnes"],0],["Inconvénient :",["la circulation","les prix","la langue"],0],["Il veut :",["partir","y rester longtemps","changer de pays"],1]]],
 w:["Raconte un petit événement avec « vì vậy », « sau đó », « cuối cùng ».",["vì vậy","sau đó","cuối cùng"],"Hôm qua trời mưa, vì vậy tôi ở nhà. Sau đó tôi nấu cơm. Cuối cùng tôi xem phim.","Hier il pleuvait, donc je suis resté chez moi. Ensuite j'ai cuisiné. Enfin j'ai regardé un film."],
 s:["Raconte à voix haute ce que tu as fait ce week-end avec « sau đó » et « cuối cùng ».",["sau đó","cuối cùng","cuối tuần"],"Cuối tuần tôi đi chợ. Sau đó tôi nấu ăn. Cuối cùng tôi nghỉ ngơi.","Ce week-end je suis allé au marché. Ensuite j'ai cuisiné. Enfin je me suis reposé."]
});
S(15,{
 r:["Lời khuyên của má","Má dặn tôi: « Con nhớ mặc áo ấm, đừng đi trễ. Đi cẩn thận nghen. Về tới nhà thì gọi điện cho má ». Tôi nói: « Dạ, con biết rồi ». Má cười: « Thôi đi đi, kẻo trễ giờ ».","Maman me recommande : « N'oublie pas de mettre un vêtement chaud, ne sois pas en retard. Fais attention, hein. Appelle-moi en arrivant. » Je réponds : « Oui, je sais. » Maman sourit : « Allez, vas-y, sinon tu seras en retard. »",
  [["Que demande la mère ?",["d'être prudent","de rester à la maison","de dormir"],0],["Elle veut un appel :",["en partant","en arrivant","jamais"],1],["« Đừng » signifie :",["ne... pas (interdiction)","maintenant","peut-être"],0]]],
 l:["Đừng quên khóa cửa nha. Nhớ tắt đèn nữa. Mình đi nào, trễ rồi.","N'oublie pas de fermer la porte. Pense aussi à éteindre la lumière. Allons-y, on est en retard.",
  [["Que ne faut-il pas oublier ?",["fermer à clé","acheter du pain","appeler un taxi"],0],["Aussi :",["éteindre la lumière","ouvrir la fenêtre","cuisiner"],0],["Le locuteur :",["est pressé","dort","est malade"],0]]],
 w:["Écris 3 conseils à un ami qui visite ta ville (đừng..., nhớ..., hãy...).",["đừng","nhớ","hãy"],"Đừng quên mang nón. Nhớ uống nhiều nước. Hãy thử món phở.","N'oublie pas ton chapeau. Pense à boire de l'eau. Essaie le phở."],
 s:["Donne à voix haute un conseil à un ami fatigué.",["hãy","nghỉ","đừng"],"Hãy nghỉ ngơi đi. Đừng làm việc nhiều quá.","Repose-toi. Ne travaille pas trop."]
});
S(16,{
 r:["Tôi biết nấu ăn","Tôi biết nấu vài món Việt Nam như canh chua và cá kho. Tôi chưa biết nấu món cuốn. Bác Tư nói tôi có thể học nếu có thời gian. Bác cho phép tôi vào bếp nghịch thoải mái.","Je sais cuisiner quelques plats vietnamiens comme la soupe aigre et le poisson au caramel. Je ne sais pas encore faire les rouleaux. Bác Tư dit que je peux apprendre si j'ai le temps. Il me permet d'entrer en cuisine à ma guise.",
  [["Il ne sait pas faire :",["la soupe","les rouleaux","le poisson"],1],["Bác Tư :",["interdit l'accès","autorise","est absent"],1],["Condition pour apprendre :",["de l'argent","du temps","un diplôme"],1]]],
 l:["Anh có thể giúp tôi một chút được không? Dạ được. Tôi không biết dùng máy này. Để tôi chỉ cho.","Pouvez-vous m'aider un peu ? Oui, bien sûr. Je ne sais pas utiliser cette machine. Laissez-moi vous montrer.",
  [["On demande :",["de l'aide","de l'argent","un taxi"],0],["Réponse :",["oui","non","peut-être"],0],["Pourquoi ?",["il ne sait pas utiliser la machine","il est malade","il est en retard"],0]]],
 w:["Écris ce que tu sais faire et ce que tu ne sais pas encore faire en vietnamien.",["biết","chưa biết","có thể"],"Tôi biết nấu cơm. Tôi chưa biết nấu phở. Tôi có thể học.","Je sais cuisiner le riz. Je ne sais pas encore faire le phở. Je peux apprendre."],
 s:["Demande poliment la permission d'entrer et de t'asseoir.",["cho","được không","vào"],"Cho con vào được không ạ?","Puis-je entrer ?"]
});
S(17,{
 r:["Buổi sáng của Hoa","Hoa dậy sớm, tập thể dục rồi tắm. Sau đó cô ăn sáng và đi làm bằng xe buýt. Buổi tối, cô nấu cơm, xem phim và đọc sách. Cuối tuần, Hoa thường đi cà phê với bạn bè.","Hoa se lève tôt, fait du sport puis se douche. Ensuite elle prend son petit-déjeuner et va travailler en bus. Le soir elle cuisine, regarde un film et lit. Le week-end elle va souvent au café avec des amis.",
  [["Comment va-t-elle travailler ?",["en bus","à moto","à pied"],0],["Le soir :",["elle cuisine et lit","elle sort","elle dort"],0],["Le week-end :",["café avec amis","travail","sport"],0]]],
 l:["Mỗi sáng tôi uống một ly cà phê. Buổi trưa tôi ngủ trưa mười lăm phút. Buổi tối tôi thích đi dạo ở công viên.","Chaque matin je bois un café. À midi je fais une sieste de quinze minutes. Le soir j'aime me promener au parc.",

S(18,{
 r:["Ngày nghỉ ở miền Tây","Cuối tuần trước, gia đình tôi đã đi Cần Thơ chơi. Chúng tôi thuê một chiếc ghe và đi chợ nổi Cái Răng từ sáng sớm. Chúng tôi ăn hủ tiếu trên ghe và mua trái cây từ những chiếc xuồng nhỏ. Tuy mệt nhưng ai cũng vui.","Le week-end dernier ma famille est allée à Cần Thơ. Nous avons loué une barque et visité le marché flottant de Cái Răng dès l'aube. Nous avons mangé du hủ tiếu sur la barque et acheté des fruits aux petites pirogues. Même fatigués, tout le monde était heureux.",
  [["Où sont-ils allés ?",["Hà Nội","Cần Thơ","Huế"],1],["Ils ont mangé :",["du hủ tiếu","du phở","du riz frit"],0],["Comment était l'ambiance ?",["tristesse","joie malgré la fatigue","ennui"],1]]],
 l:["Ngày mai tôi sẽ đi Vũng Tàu bằng xe đò. Xe chạy lúc sáu giờ sáng. Nếu trời không mưa, tôi sẽ đi tắm biển.","Demain j'irai à Vũng Tàu en car. Le car part à 6 h du matin. S'il ne pleut pas, j'irai me baigner à la mer.",
  [["Destination :",["Vũng Tàu","Cần Thơ","Đà Lạt"],0],["Départ :",["6 h","8 h","10 h"],0],["Condition pour se baigner :",["pas de pluie","beaucoup de soleil","un ami"],0]]],
 w:["Raconte un week-end (où, avec qui, ce que tu as mangé) en 4 phrases.",["đã","cùng","ăn"],"Cuối tuần tôi đã đi Đà Lạt cùng gia đình. Chúng tôi ăn bánh tráng nướng. Chúng tôi rất vui.","Ce week-end je suis allé à Đà Lạt en famille. Nous avons mangé du bánh tráng nướng. Nous étions très contents."],
 s:["Raconte brièvement où tu es allé et ce que tu as fait le week-end dernier.",["đã","đi","cuối tuần"],"Cuối tuần trước tôi đã đi chợ nổi và ăn hủ tiếu.","Le week-end dernier je suis allé au marché flottant et j'ai mangé du hủ tiếu."]

S(19,{
 r:["Xui xẻo một ngày","Hôm qua tôi bị mất ví ở chợ và bị mưa ướt hết. Nhưng cũng may, tôi được một người lạ cho mượn dù và được bác bảo vệ giúp gọi taxi. Má tôi bắt tôi uống trà gừng cho đỡ lạnh.","Hier j'ai perdu mon portefeuille au marché et je me suis fait tremper par la pluie. Mais heureusement, un inconnu m'a prêté son parapluie et le gardien m'a aidé à appeler un taxi. Maman m'a fait boire du thé au gingembre pour me réchauffer.",
  [["Que lui est-il arrivé de mauvais ?",["il a perdu son portefeuille","il s'est cassé la jambe","il a raté son avion"],0],["Qui a prêté un parapluie ?",["un inconnu","sa mère","un ami"],0],["« Bắt tôi uống » exprime :",["une contrainte (causatif)","un passé","une question"],0]]],
 l:["Con bé bị cảm nên được mẹ cho nghỉ học. Mẹ bắt con uống thuốc và ngủ sớm. Mai con sẽ được đi học lại nếu hết sốt.","La petite a un rhume, sa mère lui permet donc de ne pas aller à l'école. Elle lui fait prendre des médicaments et dormir tôt. Demain elle pourra retourner à l'école si la fièvre tombe.",
  [["Pourquoi reste-t-elle à la maison ?",["rhume","vacances","punition"],0],["La mère :",["oblige à prendre des médicaments","l'envoie jouer","la gronde"],0],["Condition pour retourner à l'école :",["plus de fièvre","un certificat","la pluie"],0]]],
 w:["Raconte une mésaventure avec « bị » et un moment de chance avec « được ».",["bị","được","nhưng"],"Hôm qua tôi bị trễ xe buýt. Nhưng tôi được bạn chở đi làm.","Hier j'ai raté le bus. Mais un ami m'a emmené au travail."],
 s:["Dis à voix haute une chose désagréable (bị) puis une bonne chose (được) arrivée cette semaine.",["bị","được","tuần"],"Tuần này tôi bị cảm. Nhưng tôi được nghỉ ở nhà.","Cette semaine j'ai attrapé un rhume. Mais j'ai pu rester à la maison."]
});
S(20,{
 r:["Lời nhắn từ bác","Bác Hai nói với tôi rằng tuần sau bác sẽ ghé thăm. Bác hỏi tôi có thích ăn bánh xèo không. Bác dặn tôi đừng mua thêm đồ vì bác sẽ mang theo. Tôi trả lời rằng tôi sẽ chờ bác ở nhà.","Bác Hai m'a dit qu'il passerait me voir la semaine prochaine. Il m'a demandé si j'aimais le bánh xèo. Il m'a recommandé de ne rien acheter de plus car il apporterait tout. J'ai répondu que je l'attendrais à la maison.",
  [["Quand vient bác Hai ?",["la semaine prochaine","demain","hier"],0],["Il demande :",["si j'aime le bánh xèo","où je vis","mon âge"],0],["Il recommande :",["de ne pas acheter de plus","d'acheter beaucoup","de cuisiner"],0]]],
 l:["Cô giáo bảo chúng em rằng ngày mai sẽ có bài kiểm tra. Cô dặn em nhớ ôn bài kỹ. Bạn Lan hỏi cô có cho phép dùng từ điển không, cô nói không.","La professeure nous a dit que demain il y aurait un contrôle. Elle nous a recommandé de bien réviser. Lan a demandé si le dictionnaire était autorisé, elle a dit non.",
  [["Demain :",["un contrôle","des vacances","une fête"],0],["Dictionnaire :",["autorisé","interdit","obligatoire"],1],["Conseil :",["réviser","dormir","partir"],0]]],
 w:["Rapporte une conversation : « Il m'a dit que... et il m'a demandé si... »",["nói rằng","hỏi","tôi"],"Bạn tôi nói rằng ngày mai anh ấy bận. Anh ấy hỏi tôi có rảnh không.","Mon ami m'a dit que demain il était occupé. Il m'a demandé si j'étais libre."],
 s:["Rapporte à voix haute ce qu'un collègue t'a dit ce matin.",["nói rằng","hỏi","sáng nay"],"Sáng nay đồng nghiệp nói rằng chiều nay có họp. Anh ấy hỏi tôi có đi không.","Ce matin un collègue m'a dit qu'il y avait réunion cet après-midi. Il m'a demandé si j'y allais."]

S(21,{
 r:["Chiều ở quê","Buổi chiều ở quê thật yên tĩnh. Gió thổi nhè nhẹ, lúa xanh mơn mởn. Bà ngồi lặng lẽ bên hiên, tay đan chiếc nón. Trẻ con chạy nhảy tung tăng, tiếng cười vang rộn ràng cả xóm.","Le soir à la campagne est très paisible. Le vent souffle doucement, le riz est tendre et vert. Grand-mère est assise en silence sous la véranda et tresse un chapeau. Les enfants gambadent, leurs rires résonnent dans tout le hameau.",
  [["Ambiance :",["paisible","bruyante","triste"],0],["Que fait la grand-mère ?",["elle tresse un chapeau","elle cuisine","elle dort"],0],["Les enfants :",["gambadent","pleurent","étudient"],0]]],
 l:["Trời hôm nay nóng hừng hực. Em bé khóc oe oe suốt buổi sáng. Chị ấy vui vẻ, nói chuyện huyên thuyên với bạn bè.","Il fait une chaleur torride aujourd'hui. Le bébé a pleuré toute la matinée. Elle, joyeuse, a bavardé sans arrêt avec ses amis.",
  [["Météo :",["torride","froide","pluvieuse"],0],["Le bébé :",["pleure","rit","dort"],0],["Elle :",["bavarde joyeusement","se fâche","dort"],0]]],
 w:["Décris un lieu avec au moins 2 mots redoublés (từ láy).",["xanh","nhè nhẹ","gió"],"Sáng nay trời mát, gió thổi nhè nhẹ. Cánh đồng xanh mơn mởn.","Ce matin il fait frais, le vent souffle doucement. Les champs sont d'un vert tendre."],
 s:["Décris à voix haute ton quartier avec « vui vẻ » ou « yên tĩnh ».",["yên tĩnh","vui vẻ","khu"],"Khu tôi sống rất yên tĩnh và mọi người vui vẻ.","Mon quartier est très calme et les gens sont joyeux."]
});
S(22,{
 r:["Làm xong rồi","Hôm nay tôi đã ăn hết bát cơm, làm xong bài tập và dọn sạch nhà. Tôi đi ra sân, nhìn lên thấy mây đen kéo tới. Tôi chạy vào nhà, đóng kỹ cửa, rồi ngồi xuống nghỉ.","Aujourd'hui j'ai fini mon bol de riz, terminé mes devoirs et nettoyé la maison à fond. Je sors dans la cour, je lève les yeux et je vois arriver des nuages noirs. Je rentre en courant, ferme bien la porte, puis m'assois pour me reposer.",
  [["Il a nettoyé :",["la maison","la voiture","le jardin"],0],["Il voit :",["des nuages noirs","un arc-en-ciel","un oiseau"],0],["Il :",["ferme la porte et se repose","sort","dort dehors"],0]]],
 l:["Tôi tìm thấy chìa khóa rồi. Em nhìn ra cửa sổ thì thấy xe đã tới. Chị đứng dậy, bước ra ngoài, mở cửa cho khách.","J'ai trouvé les clés. En regardant par la fenêtre, j'ai vu que la voiture était arrivée. Elle se lève, sort et ouvre la porte aux invités.",
  [["On a trouvé :",["les clés","un portefeuille","un livre"],0],["On voit :",["la voiture arrivée","la pluie","un voisin"],0],["Elle :",["ouvre la porte","ferme la fenêtre","cuisine"],0]]],
 w:["Décris une action terminée avec « xong », « hết » ou « được » et une direction (ra, vào, lên, xuống).",["xong","ra","vào"],"Tôi làm xong bài rồi đi ra ngoài. Sau đó tôi chạy vào nhà.","J'ai fini mon travail puis je suis sorti. Ensuite je suis rentré en courant."],
 s:["Raconte à voix haute que tu as fini un travail puis que tu es sorti.",["xong","đi ra","rồi"],"Tôi làm xong rồi đi ra ngoài.","J'ai fini puis je suis sorti."]
});
S(23,{
 r:["Hẹn gặp nhé","Lan hỏi: « Mai anh rảnh phải không? ». Nam trả lời: « Ừ, rảnh. Mình đi ăn bún bò nhé? ». Lan cười: « Ngon mà, đúng không? ». « Đúng rồi, quán đó ngon lắm, phải không? » Hai người hẹn gặp lúc bảy giờ.","Lan demande : « Tu es libre demain, n'est-ce pas ? ». Nam répond : « Oui, libre. On va manger du bún bò, d'accord ? ». Lan sourit : « C'est bon, non ? ». « Exact, ce restaurant est excellent, hein ? ». Ils se donnent rendez-vous à sept heures.",
  [["Que proposent-ils de manger ?",["bún bò","phở","cơm"],0],["Heure du rendez-vous :",["7 h","9 h","11 h"],0],["« Phải không ? » demande :",["une confirmation","un refus","un ordre"],0]]],
 l:["Anh là người Pháp phải không? Dạ đúng. Anh học tiếng Việt lâu chưa? Mới ba tháng thôi. Giỏi quá, đúng không cô?","Vous êtes français, n'est-ce pas ? Oui. Vous apprenez le vietnamien depuis longtemps ? Seulement trois mois. Très bien, non madame ?",
  [["Nationalité :",["française","vietnamienne","chinoise"],0],["Durée d'apprentissage :",["trois mois","trois ans","un mois"],0],["On félicite :",["son niveau","son voyage","son repas"],0]]],
 w:["Écris 3 questions de confirmation à un ami (phải không ? đúng không ? nhỉ ?).",["phải không","đúng không","nhé"],"Anh ở Sài Gòn phải không? Quán này ngon, đúng không? Mai đi ăn nhé?","Tu habites à Saigon, n'est-ce pas ? Ce restaurant est bon, non ? On mange demain, d'accord ?"],
 s:["Demande à voix haute à un collègue s'il est libre demain avec « phải không ».",["rảnh","phải không","mai"],"Mai anh rảnh phải không?","Tu es libre demain, n'est-ce pas ?"]
});
S(24,{
 r:["Một buổi sáng bận rộn","Sáng nay tôi dậy sớm, đi ra chợ mua rau, mang về nấu cơm cho cả nhà. Sau đó tôi đến văn phòng làm việc, ngồi nói chuyện với đồng nghiệp rồi viết báo cáo. Tôi cố gắng làm cho kịp giờ.","Ce matin je me lève tôt, vais au marché acheter des légumes, les rapporte et cuisine le riz pour toute la famille. Puis je vais au bureau, bavarde avec mes collègues et rédige le rapport. Je m'efforce de finir à temps.",
  [["Il va d'abord :",["au marché","au bureau","au cinéma"],0],["Il cuisine pour :",["toute la famille","ses collègues","un ami"],0],["Au bureau :",["il rédige un rapport","il dort","il joue"],0]]],
 l:["Tôi lấy xe đi làm. Chị ấy ngồi xuống uống nước rồi nói với tôi. Anh ta mở cửa bước vào, cầm theo một túi trái cây.","Je prends ma moto pour aller travailler. Elle s'assoit, boit de l'eau puis me parle. Il ouvre la porte et entre, apportant un sac de fruits.",
  [["Moyen de transport :",["moto","bus","vélo"],0],["Elle :",["boit de l'eau puis parle","pleure","part"],0],["Il apporte :",["des fruits","du riz","un livre"],0]]],
 w:["Écris une phrase avec 3 verbes en série (đi, mua, mang về...).",["đi","mua","về"],"Tôi đi chợ mua rau mang về nấu cơm.","Je vais au marché acheter des légumes et les rapporter pour cuisiner."],
 s:["Décris ta matinée en un enchaînement de verbes.",["đi","mua","về"],"Sáng nay tôi đi chợ, mua rau, mang về nấu cơm.","Ce matin je suis allé au marché, ai acheté des légumes et les ai rapportés pour cuisiner."]
});
S(25,{
 r:["Một tuần nhiều cảm xúc","Tuần này tôi hơi căng thẳng vì công việc nhiều. Nhưng thứ sáu tôi được khen nên rất vui. Tối đó tôi gọi cho mẹ, mẹ lo lắng hỏi han, rồi tôi thấy nhẹ nhõm. Cuối tuần tôi cảm thấy bình yên.","Cette semaine j'étais un peu stressé car j'avais beaucoup de travail. Mais vendredi j'ai reçu des compliments et j'étais très heureux. Le soir j'ai appelé ma mère, qui s'est inquiétée et a pris de mes nouvelles ; je me suis senti soulagé. Le week-end j'ai ressenti de la paix.",
  [["Pourquoi stressé ?",["beaucoup de travail","maladie","dispute"],0],["Vendredi :",["il est félicité","il est malade","il voyage"],0],["À la fin :",["il se sent en paix","il est fâché","il est triste"],0]]],
 l:["Tôi buồn vì bạn thân chuyển đi. Nhưng tôi cũng mừng vì bạn có công việc tốt. Tôi hy vọng chúng tôi sẽ gặp lại sớm.","Je suis triste car mon meilleur ami déménage. Mais je suis aussi content qu'il ait un bon travail. J'espère que nous nous reverrons bientôt.",
  [["Il est triste car :",["son ami déménage","il est malade","il a perdu son travail"],0],["Il est aussi :",["content pour son ami","fâché","indifférent"],0],["Il espère :",["se revoir","oublier","partir"],0]]],
 w:["Décris ton état d'esprit cette semaine en 3 phrases avec des émotions.",["vui","lo","tôi"],"Tuần này tôi hơi lo vì kỳ thi. Nhưng tôi vui vì được nghỉ cuối tuần.","Cette semaine je suis un peu inquiet à cause de l'examen. Mais je suis content d'avoir un week-end de repos."],
 s:["Dis à voix haute comment tu te sens aujourd'hui et pourquoi.",["cảm thấy","vì","hôm nay"],"Hôm nay tôi cảm thấy vui vì trời đẹp.","Aujourd'hui je me sens heureux car il fait beau."]
});
S(26,{
 r:["Một ngày xui và may","Sáng nay tôi bị trễ xe buýt, được chị hàng xóm cho đi nhờ. Chị nói rằng chiều nay sẽ có mưa to nên dặn tôi mang dù. Tôi làm xong báo cáo, vui vẻ về nhà. Tối đó, tôi nhờ mẹ nấu canh chua, ăn hết cả nồi!","Ce matin j'ai raté le bus, une voisine m'a déposé. Elle m'a dit qu'il y aurait de la grosse pluie cet après-midi et m'a recommandé d'emporter un parapluie. J'ai fini mon rapport et suis rentré content. Le soir j'ai demandé à ma mère de cuisiner de la soupe aigre, j'ai tout mangé !",
  [["Qui l'a déposé ?",["une voisine","un taxi","un ami"],0],["Elle dit :",["qu'il pleuvra","qu'il fera beau","qu'il neigera"],0],["Il mange :",["toute la soupe","un peu de riz","rien"],0]]],
 l:["Hôm qua anh ấy đã bị mất điện thoại. Chị bảo anh đi báo công an rồi mua cái mới. Tuy buồn nhưng anh vẫn bình tĩnh.","Hier il a perdu son téléphone. Elle lui a dit d'aller le déclarer à la police puis d'en acheter un neuf. Bien que triste, il est resté calme.",
  [["Il a perdu :",["son téléphone","son portefeuille","ses clés"],0],["Conseil :",["déclarer puis racheter","attendre","pleurer"],0],["Son attitude :",["calme","colérique","désespérée"],0]]],
 w:["Écris un court récit (4 phrases) mêlant passif, discours rapporté et émotions.",["bị","nói rằng","vui"],"Hôm qua tôi bị mất ví. Bạn nói rằng nên báo công an. Tôi buồn nhưng cuối cùng tôi tìm lại được và rất vui.","Hier j'ai perdu mon portefeuille. Mon ami a dit qu'il fallait le déclarer à la police. J'étais triste mais finalement je l'ai retrouvé et j'étais très content."],
 s:["Raconte brièvement une journée où tout s'est bien passé malgré un petit problème.",["tuy","nhưng","cuối cùng"],"Tuy bị trễ xe nhưng cuối cùng tôi vẫn đến kịp giờ.","Bien que j'aie raté le bus, finalement je suis arrivé à l'heure."]
});
