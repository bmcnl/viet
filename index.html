S(67,{
 r:["Quán cơm tấm đầu hẻm","Mỗi sáng, chú Tư mở quán cơm tấm đầu hẻm. Khách gọi cơm tấm sườn, có người gọi hủ tiếu hoặc bánh mì. Chú nêm nước mắm rất vừa, bày thêm rau thơm và ớt. Ai cũng uống trà đá hoặc cà phê sữa đá cho mát.","Chaque matin, chú Tư ouvre son restaurant de cơm tấm au bout de la ruelle. Les clients commandent du cơm tấm à la côtelette, d'autres du hủ tiếu ou un bánh mì. Il assaisonne le nước mắm juste comme il faut et sert des herbes et du piment. Tout le monde boit du thé glacé ou un café glacé au lait pour se rafraîchir.",
  [["Que vend chú Tư ?",["du cơm tấm, du hủ tiếu et du bánh mì","seulement du phở","des vêtements"],0],["Ce qu'il sert avec les plats :",["rau thơm et ớt","de la glace","du chocolat"],0],["Les clients boivent :",["trà đá ou cà phê sữa đá","de la bière","de l'eau chaude"],0]]],
 l:["Tối nay má nấu canh chua và cá kho tộ. Con làm gỏi cuốn với chả giò cho bữa tiệc. Sau bữa ăn, cả nhà ăn chè mát lạnh.","Ce soir maman cuisine une soupe aigre et du poisson en cocotte. Je prépare des rouleaux frais et des nems pour le repas de fête. Après le repas, toute la famille mange un chè bien frais.",
  [["Plats de maman :",["canh chua et cá kho tộ","phở et bánh xèo","bún mắm"],0],["L'enfant prépare :",["gỏi cuốn et chả giò","du chè","du café"],0],["Dessert :",["chè","bánh mì","fruits"],0]]],
 w:["Écris ce que tu manges aujourd'hui (matin, midi, soir) avec des plats du Sud.",["ăn","cơm tấm","trà đá"],"Sáng nay tôi ăn bánh mì. Trưa tôi ăn cơm tấm. Tối tôi uống trà đá và ăn chè.","Ce matin je mange un bánh mì. À midi du cơm tấm. Le soir je bois du thé glacé et mange un chè."],
 s:["Commande à voix haute un plat et une boisson du Sud.",["cho","cơm tấm","cà phê"],"Cho tui một dĩa cơm tấm và một ly cà phê sữa đá.","Un cơm tấm et un café glacé au lait pour moi."]
});
S(68,{
 r:["Đi khám ở phòng mạch","Bé Mai bị đau bụng và nhức đầu từ sáng. Mẹ sờ trán thấy nóng, rồi đưa bé đi khám. Bác sĩ nhìn họng và nghe tim, sau đó dặn bé mặc áo ấm và mang dép, đội nón khi ra ngoài.","La petite Mai a mal au ventre et à la tête depuis ce matin. Sa mère touche son front et le trouve chaud, puis l'emmène consulter. Le médecin regarde sa gorge et écoute son cœur, puis lui dit de mettre un vêtement chaud, de porter des sandales et un chapeau en sortant.",
  [["Symptômes de Mai :",["mal au ventre et à la tête","mal au dos","toux"],0],["La mère touche :",["le front","la main","le pied"],0],["Conseil du médecin :",["s'habiller chaudement","rester nue","courir"],0]]],
 l:["Anh Nam đau lưng và đau vai vì ngồi nhiều. Bác sĩ bảo anh đi bơi và tập duỗi tay chân mỗi ngày.","Anh Nam a mal au dos et à l'épaule parce qu'il reste beaucoup assis. Le médecin lui dit d'aller nager et de faire des étirements des bras et des jambes chaque jour.",
  [["Douleur :",["dos et épaule","tête","dents"],0],["Cause :",["rester assis longtemps","trop manger","le froid"],0],["Conseil :",["nager et s'étirer","dormir","manger moins"],0]]],
 w:["Décris les vêtements que tu portes aujourd'hui (3 phrases).",["tôi","mặc","áo"],"Hôm nay tôi mặc áo trắng và quần đen. Tôi mang dép. Tôi đội nón vì trời nắng.","Aujourd'hui je porte une chemise blanche et un pantalon noir. Je porte des sandales. Je mets un chapeau car il y a du soleil."],
 s:["Dis à voix haute où tu as mal (3 parties du corps).",["đau","đầu","bụng"],"Tôi đau đầu, đau bụng và đau lưng.","J'ai mal à la tête, au ventre et au dos."]
});
S(69,{
 r:["Mùa mưa ở Sài Gòn","Ở Sài Gòn, mùa mưa bắt đầu từ tháng năm. Buổi sáng trời nắng và nóng, nhưng chiều thường có mưa to và gió lớn. Không khí ẩm nên mọi người hay mang áo mưa màu vàng. Qua mùa khô, trời mát và dễ chịu hơn.","À Sài Gòn, la saison des pluies commence en mai. Le matin il fait soleil et chaud, mais l'après-midi il pleut souvent fort avec beaucoup de vent. L'air est humide, alors on porte souvent un imperméable jaune. Passée la saison sèche, le temps est plus frais et agréable.",
  [["Début de la saison des pluies :",["mai","janvier","décembre"],0],["L'après-midi :",["pluie forte et vent","neige","brouillard"],0],["Couleur de l'imperméable :",["jaune","noir","rouge"],0]]],
 l:["Cái áo này mới, màu xanh lá. Nó nhẹ và mát nên mặc ngày nắng rất hợp. Cái kia màu đen, nặng hơn.","Cette chemise est neuve, de couleur verte. Elle est légère et fraîche, parfaite pour les jours de soleil. L'autre est noire et plus lourde.",
  [["Couleur de la chemise :",["vert","rouge","jaune"],0],["Elle est :",["légère et fraîche","lourde","trop petite"],0],["L'autre :",["noire et plus lourde","blanche","petite"],0]]],
 w:["Décris le temps qu'il fait aujourd'hui et ce que tu portes (3 phrases).",["trời","nắng","tôi"],"Hôm nay trời nắng và nóng. Tôi mặc áo trắng. Chiều chắc có mưa.","Aujourd'hui il fait soleil et chaud. Je porte une chemise blanche. Cet après-midi il pleuvra sans doute."],
 s:["Décris à voix haute le temps de ta ville en deux phrases.",["trời","mưa","nóng"],"Ở đây trời nóng và ẩm. Chiều thường có mưa.","Ici il fait chaud et humide. L'après-midi il pleut souvent."]
});
S(70,{
 r:["Một ngày của em","Sáng em dậy, ăn cơm, uống cà phê rồi đi học. Ở lớp em nghe, viết và đọc bài. Em hiểu hầu hết, nhưng đôi khi quên từ mới. Chiều em mua sách, tìm quán ăn, rồi về nhà.","Le matin je me lève, mange, bois un café puis vais en cours. En classe j'écoute, j'écris et je lis. Je comprends presque tout, mais j'oublie parfois les mots nouveaux. L'après-midi j'achète des livres, je cherche un restaurant puis je rentre.",
  [["Que fait-il au cours ?",["écouter, écrire, lire","dormir","cuisiner"],0],["Difficulté :",["oublier des mots","trop parler","être en retard"],0],["L'après-midi :",["acheter des livres","faire du sport","voyager"],0]]],
 l:["Anh ơi, mở cửa giúp em, em đang lấy đồ. Rồi đóng cửa lại nha. Anh nhớ đợi em, em đi mua nước rồi về.","Mon cher, ouvre-moi la porte, je prends mes affaires. Puis referme-la, d'accord. N'oublie pas de m'attendre, je vais acheter de l'eau et je reviens.",
  [["Ce qu'on demande :",["ouvrir puis refermer la porte","acheter du pain","appeler un taxi"],0],["Elle va :",["acheter de l'eau","dormir","lire"],0],["Il doit :",["l'attendre","partir","cuisiner"],0]]],
 w:["Raconte ta matinée avec 4 verbes de l'unité (ăn, uống, đọc, đi...).",["tôi","ăn","đi"],"Sáng nay tôi ăn bánh mì và uống cà phê. Tôi đọc tin tức rồi đi làm.","Ce matin j'ai mangé un bánh mì et bu un café. J'ai lu les actualités puis je suis allé travailler."],
 s:["Dis à voix haute ce que tu sais faire en vietnamien (nói, đọc, hiểu...).",["tôi","biết","nói"],"Tôi biết nói, đọc và hiểu một ít tiếng Việt.","Je sais parler, lire et comprendre un peu de vietnamien."]
});
S(71,{
 r:["Căn nhà trong hẻm","Nhà chị Lan ở trong hẻm, lầu hai. Nhà có hai phòng, một nhà bếp và một nhà tắm nhỏ. Cửa sổ nhìn ra sân. Gần nhà có chợ, công viên và bệnh viện, nên đi lại rất tiện.","La maison de chị Lan est dans une ruelle, au deuxième étage. Elle a deux chambres, une cuisine et une petite salle de bain. La fenêtre donne sur la cour. Près de chez elle il y a un marché, un parc et un hôpital, c'est donc très pratique.",
  [["Étage :",["le deuxième","le premier","le troisième"],0],["Pièces :",["deux chambres, cuisine, salle de bain","un seul salon","quatre chambres"],0],["Alentours :",["marché, parc, hôpital","mer","montagne"],0]]],
 l:["Anh đi thẳng, qua cầu, tới ngã tư thì quẹo trái. Công viên nằm bên phải, gần ngân hàng.","Allez tout droit, passez le pont, au carrefour tournez à gauche. Le parc est à droite, près de la banque.",
  [["Au carrefour :",["à gauche","à droite","tout droit"],0],["On passe :",["un pont","un tunnel","une gare"],0],["Le parc est :",["à droite","à gauche","derrière"],0]]],
 w:["Décris ton logement (pièces, étage, quartier) en 3 phrases.",["nhà","phòng","gần"],"Nhà tôi có hai phòng và một nhà bếp. Nhà ở lầu ba. Gần nhà có chợ và công viên.","Ma maison a deux chambres et une cuisine. Elle est au troisième étage. Près de chez moi il y a un marché et un parc."],
 s:["Explique à voix haute comment aller de chez toi au marché.",["đi thẳng","quẹo","chợ"],"Anh đi thẳng, quẹo phải ở ngã tư, chợ ở bên trái.","Allez tout droit, tournez à droite au carrefour, le marché est à gauche."]
});
S(72,{
 r:["Chuyến đi Phú Quốc","Gia đình Hoa đặt vé máy bay đi Phú Quốc. Ở sân bay, họ gửi hành lý rồi lên chuyến bay buổi sáng. Khách sạn gần bãi biển có phòng đôi rất đẹp. Họ thuê xe máy đi tham quan và chụp hình điểm tham quan nổi tiếng.","La famille de Hoa réserve des billets d'avion pour Phú Quốc. À l'aéroport, ils enregistrent leurs bagages et prennent le vol du matin. L'hôtel près de la plage a une très belle chambre double. Ils louent une moto pour visiter et prendre en photo les sites célèbres.",
  [["Destination :",["Phú Quốc","Hà Nội","Huế"],0],["Hôtel :",["près de la plage","en ville","à la montagne"],0],["Pour se déplacer :",["louer une moto","prendre le train","marcher"],0]]],
 l:["Xin lỗi, bến xe đi Cần Thơ ở đâu ạ? Xe đò chạy lúc bảy giờ sáng. Vé giá một trăm ngàn, trả tiền mặt hoặc chuyển khoản.","Excusez-moi, où est la gare routière pour Cần Thơ ? Le car part à 7 h du matin. Le billet coûte 100 000, payable en espèces ou par virement.",
  [["Destination :",["Cần Thơ","Đà Lạt","Huế"],0],["Départ :",["7 h","9 h","11 h"],0],["Paiement :",["espèces ou virement","seulement carte","gratuit"],0]]],
 w:["Écris une demande de réservation de chambre à l'hôtel (dates, type de chambre).",["đặt phòng","đêm","phòng đôi"],"Tôi muốn đặt phòng đôi trong ba đêm, từ ngày mười lăm tháng mười hai.","Je voudrais réserver une chambre double pour trois nuits à partir du 15 décembre."],
 s:["Demande à voix haute le prix d'une chambre et si le petit-déjeuner est inclus.",["bao nhiêu","phòng","ăn sáng"],"Phòng này bao nhiêu một đêm? Có ăn sáng không?","Combien coûte cette chambre la nuit ? Le petit-déjeuner est-il inclus ?"]
});
S(73,{
 r:["Mua áo ở Bến Thành","Lan vào cửa hàng mua áo. Cô thử một cái áo màu đỏ, nhưng hơi chật. Chị bán hàng đưa cái cỡ lớn hơn, vừa lắm. Giá hơi mắc, Lan trả giá, chị bớt mười ngàn. Lan trả tiền mặt và lấy tiền thối.","Lan entre dans une boutique pour acheter une chemise. Elle essaie une chemise rouge, un peu serrée. La vendeuse lui donne la taille au-dessus, elle lui va parfaitement. Le prix est un peu élevé, Lan marchande, la vendeuse baisse de 10 000. Lan paie en espèces et récupère la monnaie.",
  [["Problème avec la première chemise :",["un peu serrée","trop grande","trop longue"],0],["Prix :",["la vendeuse baisse de 10 000","pas de remise","double prix"],0],["Paiement :",["en espèces","par carte","par virement"],0]]],
 l:["Cho tôi xem cái túi này. Giá bao nhiêu vậy cô? Hơi mắc, bớt cho tôi được không? Tôi lấy hai cái nếu cô giảm giá.","Montrez-moi ce sac. Combien coûte-t-il, madame ? C'est un peu cher, pouvez-vous baisser le prix ? J'en prends deux si vous faites une remise.",
  [["Il veut voir :",["un sac","une chemise","un livre"],0],["Il trouve le prix :",["un peu cher","bon marché","gratuit"],0],["Il propose :",["d'acheter deux sacs avec remise","de partir","de payer double"],0]]],
 w:["Écris un petit dialogue d'achat (3 répliques) avec « mắc », « bớt », « thử ».",["mắc","bớt","thử"],"— Cái này mắc quá, bớt cho con nha. — Con thử đi. — Dạ vừa, con lấy.","— C'est trop cher, faites-moi une remise. — Essaie-le. — Il me va, je le prends."],
 s:["Marchande à voix haute un vêtement dans une boutique.",["mắc","bớt","lấy"],"Cái này mắc quá, bớt cho con nha, con lấy hai cái.","C'est trop cher, faites-moi une remise, j'en prends deux."]
});
S(74,{
 r:["Hồ sơ xin việc","Anh Minh là kỹ sư, làm ở một công ty lớn nhưng muốn xin việc ở bệnh viện làm kỹ thuật. Anh gửi hồ sơ, rồi được mời phỏng vấn với giám đốc. Lương không cao, nhưng đồng nghiệp ở đó rất thân thiện.","Anh Minh est ingénieur dans une grande société mais veut postuler à l'hôpital pour un poste technique. Il envoie son dossier puis est invité à un entretien avec le directeur. Le salaire n'est pas élevé, mais les collègues y sont très sympathiques.",
  [["Métier de Minh :",["ingénieur","médecin","avocat"],0],["Ce qu'il fait :",["postuler à l'hôpital","ouvrir un restaurant","partir à l'étranger"],0],["À propos des collègues :",["ils sont sympathiques","ils sont froids","ils sont absents"],0]]],
 l:["Ba tôi là nông dân, mẹ tôi là giáo viên. Anh tôi làm tài xế, em gái tôi làm y tá. Chị dâu tôi là đầu bếp ở một nhà hàng.","Mon père est agriculteur, ma mère enseignante. Mon frère est chauffeur, ma petite sœur infirmière. Ma belle-sœur est cheffe cuisinière dans un restaurant.",
  [["Père :",["agriculteur","chauffeur","médecin"],0],["Sœur :",["infirmière","enseignante","avocate"],0],["Belle-sœur :",["cheffe cuisinière","institutrice","ouvrière"],0]]],
 w:["Présente ton métier et celui de deux proches.",["làm","là","tôi"],"Tôi làm bác sĩ. Mẹ tôi là giáo viên. Anh tôi làm kỹ sư.","Je suis médecin. Ma mère est enseignante. Mon frère est ingénieur."],
 s:["Présente-toi professionnellement à voix haute (métier, lieu, ancienneté).",["tôi","làm","năm"],"Tôi làm bác sĩ ở bệnh viện được ba năm.","Je suis médecin à l'hôpital depuis trois ans."]

S(75,{
 r:["Một ngày ở Bến Tre","Từ sáng sớm, cả nhóm đi xuồng trên rạch giữa những hàng dừa. Hai bên bờ có nhiều vườn chôm chôm, măng cụt và sầu riêng. Chủ vườn mời ăn trái cây tươi và uống nước dừa. Chiều về, muỗi bắt đầu nhiều nên ai cũng xịt thuốc.","Dès l'aube, le groupe parcourt en pirogue un canal entre des rangées de cocotiers. Sur les deux rives il y a de nombreux vergers de ramboutans, mangoustans et durians. Le propriétaire les invite à manger des fruits frais et à boire de l'eau de coco. Le soir, les moustiques se multiplient et tout le monde met de l'anti-moustiques.",
  [["Transport :",["pirogue","moto","bus"],0],["Fruits :",["chôm chôm, măng cụt, sầu riêng","pommes","raisins"],0],["Le soir :",["beaucoup de moustiques","froid","tempête"],0]]],
 l:["Con trâu đi trên ruộng lúa, con chim đậu bên bờ kênh. Xa xa có chiếc ghe chở dừa. Trên mặt nước nở nhiều hoa sen và lục bình.","Le buffle marche dans la rizière, un oiseau se pose au bord du canal. Au loin, une barque transporte des noix de coco. À la surface de l'eau fleurissent lotus et jacinthes d'eau.",
  [["Animal dans la rizière :",["buffle","grenouille","chien"],0],["La barque transporte :",["des noix de coco","du riz","des poissons"],0],["Sur l'eau :",["lotus et jacinthes","bateaux de pêche","rien"],0]]],
 w:["Décris un paysage du Delta en 3 phrases avec des mots de l'unité.",["sông","vườn","ghe"],"Dòng sông rộng và chậm. Hai bên có nhiều vườn dừa. Những chiếc ghe chở trái cây qua lại.","Le fleuve est large et lent. Sur les deux rives il y a beaucoup de vergers de cocotiers. Des barques transportent des fruits."],
 s:["Dis à voix haute quel fruit tu préfères et pourquoi.",["thích","chôm chôm","vì"],"Tôi thích chôm chôm vì ngọt và mát.","J'aime le ramboutan car il est sucré et rafraîchissant."]
});
S(76,{
 r:["Đám cưới của Lan","Lan sắp kết hôn với người yêu. Bạn bè và hàng xóm được mời tới tiệc cưới. Ai cũng mang quà tới chúc mừng. Trước đám cưới, Lan tâm sự với bạn thân vì hơi lo. Bạn thân giúp đỡ cô rất nhiều.","Lan va bientôt se marier avec son petit ami. Les amis et voisins sont invités au banquet. Tout le monde apporte des cadeaux pour les féliciter. Avant le mariage, Lan se confie à sa meilleure amie car elle est un peu inquiète. Son amie l'aide beaucoup.",
  [["Qui est invité ?",["amis et voisins","seulement la famille","personne"],0],["Les invités apportent :",["des cadeaux","de l'argent seulement","rien"],0],["Lan se confie à :",["sa meilleure amie","son patron","sa voisine"],0]]],
 l:["Hai vợ chồng hay cãi nhau nhưng luôn làm hòa nhanh. Cuối tuần họ mời bạn bè đến nhà tụ họp và nấu ăn cùng nhau.","Ce couple se dispute souvent mais se réconcilie toujours vite. Le week-end ils invitent des amis à la maison pour se réunir et cuisiner ensemble.",
  [["Le couple :",["se dispute puis se réconcilie","ne se parle jamais","se sépare"],0],["Le week-end :",["ils invitent des amis","ils voyagent","ils dorment"],0],["Activité :",["cuisiner ensemble","jouer au foot","regarder la télé"],0]]],
 w:["Écris une invitation à un ami pour une fête ou un repas (3 phrases).",["mời","tiệc","nha"],"Cuối tuần này mình mời bạn đến tiệc nha. Bạn mang bạn gái theo cũng được. Hẹn gặp bạn.","Ce week-end je t'invite à la fête. Tu peux venir avec ta copine. À bientôt."],
 s:["Invite oralement un voisin à un repas, de façon polie.",["mời","ăn cơm","nha"],"Dạ, mời anh qua nhà em ăn cơm tối nay nha.","Je vous invite à venir dîner chez moi ce soir."]
});
S(77,{
 r:["Ngày thi cuối kỳ","Sinh viên đại học đang ôn bài cho kỳ thi. Môn nào cũng có bài tập và bài kiểm tra. Thầy cô dặn mang từ điển và sách giáo khoa. Nếu điểm cao, sinh viên có thể xin học bổng và nhận bằng cấp sau khi tốt nghiệp.","Les étudiants révisent pour l'examen. Chaque matière a ses devoirs et ses contrôles. Les professeurs recommandent d'apporter un dictionnaire et le manuel. Avec de bonnes notes, les étudiants peuvent demander une bourse et obtenir leur diplôme après la remise des diplômes.",
  [["Qu'apporter à l'examen ?",["dictionnaire et manuel","téléphone","nourriture"],0],["Avec de bonnes notes :",["demander une bourse","abandonner","redoubler"],0],["Après les études :",["obtenir le diplôme","voyager","se marier"],0]]],
 l:["Cô giáo hỏi bài, em đậu bài kiểm tra tiếng Việt với điểm tám. Bạn Hùng thì rớt vì chưa ôn kỹ, phải thi lại.","La professeure interroge sur la leçon, j'ai réussi le contrôle de vietnamien avec 8. Hùng, lui, a échoué car il n'avait pas assez révisé, il doit repasser l'examen.",
  [["Note de l'élève :",["8","5","10"],0],["Hùng :",["a échoué","a réussi","est absent"],0],["Il doit :",["repasser l'examen","abandonner","partir"],0]]],
 w:["Décris ton parcours scolaire ou tes études en 3 phrases.",["học","trường","tốt nghiệp"],"Tôi học ở trường y. Tôi tốt nghiệp năm ngoái. Bây giờ tôi làm bác sĩ.","J'ai étudié à la faculté de médecine. J'ai obtenu mon diplôme l'an dernier. Maintenant je suis médecin."],
 s:["Dis à voix haute ce que tu étudies en ce moment et pourquoi.",["học","vì","tiếng Việt"],"Tôi học tiếng Việt vì gia đình tôi ở Sài Gòn.","J'apprends le vietnamien car ma famille est à Sài Gòn."]
});
S(78,{
 r:["Bữa cơm của má","Má ướp thịt bò với tỏi và hành, rồi xào cùng rau muống. Cá lóc thì má kho với nước mắm và đường, nêm vừa ăn. Còn tôm thì má luộc hoặc hấp cho ngọt. Cả nhà ngồi ăn cơm, ai cũng khen má nấu ngon.","Maman marine le bœuf avec de l'ail et des oignons puis le fait sauter avec du liseron d'eau. Le poisson tête-de-serpent, elle le braise avec du nước mắm et du sucre, assaisonné juste comme il faut. Quant aux crevettes, elle les fait bouillir ou cuire à la vapeur pour qu'elles soient sucrées. Toute la famille mange, tout le monde félicite maman.",
  [["Pour le bœuf :",["mariné puis sauté","bouilli","grillé"],0],["Le poisson est :",["braisé","frit","cru"],0],["Les crevettes :",["bouillies ou à la vapeur","grillées","crues"],0]]],
 l:["Con thái hành, băm tỏi rồi ướp thịt. Xong thì chiên cho vàng. Nấu nước dùng với gừng, nêm gia vị cho vừa miệng.","Coupe l'oignon, hache l'ail puis marine la viande. Ensuite fais-la frire jusqu'à ce qu'elle soit dorée. Prépare le bouillon avec du gingembre et assaisonne les épices à ton goût.",
  [["D'abord :",["couper et hacher","frire","bouillir"],0],["Puis :",["frire la viande","manger","vendre"],0],["Pour le bouillon :",["du gingembre","du sucre","du lait"],0]]],
 w:["Écris une mini-recette en 4 étapes avec des verbes de cuisson.",["ướp","xào","nêm"],"Đầu tiên ướp thịt với tỏi. Sau đó xào thịt với hành. Nêm nước mắm cho vừa. Ăn với cơm.","D'abord marine la viande avec de l'ail. Ensuite fais-la sauter avec des oignons. Assaisonne avec du nước mắm. Mange avec du riz."],
 s:["Explique à voix haute comment tu prépares un plat simple.",["nấu","đầu tiên","sau đó"],"Đầu tiên tôi nấu cơm. Sau đó tôi xào rau và chiên cá.","D'abord je cuis le riz. Ensuite je fais sauter des légumes et frire du poisson."]
});
S(79,{
 r:["Cuối tuần của tôi","Cuối tuần tôi thích đi bơi vào buổi sáng và chạy bộ ở công viên. Buổi tối tôi xem phim hoặc nghe đờn ca tài tử với ba. Tháng sau, cả nhà tôi sẽ đi coi cải lương và chụp hình ở nhà hát.","Le week-end j'aime nager le matin et courir au parc. Le soir je regarde un film ou j'écoute de la musique đờn ca tài tử avec papa. Le mois prochain, toute la famille ira voir du cải lương et prendra des photos au théâtre.",
  [["Activité du matin :",["nager","dormir","cuisiner"],0],["Le soir avec papa :",["đờn ca tài tử","football","karaoké"],0],["Le mois prochain :",["voir du cải lương","partir en voyage","déménager"],0]]],
 l:["Anh thích bóng đá và câu cá. Em thích hát karaoke và đi dạo. Cuối tuần cả hai đi du lịch, chụp hình rồi thư giãn.","Il aime le foot et la pêche. J'aime le karaoké et me promener. Le week-end tous deux voyagent, prennent des photos et se détendent.",
  [["Il aime :",["foot et pêche","musique et cinéma","lecture"],0],["Elle aime :",["karaoké et promenade","football","natation"],0],["Ensemble :",["voyager et se détendre","travailler","étudier"],0]]],
 w:["Écris tes loisirs de la semaine (3 phrases).",["thích","cuối tuần","đi"],"Tôi thích đi bơi. Cuối tuần tôi đi dạo. Tối tôi coi phim.","J'aime nager. Le week-end je me promène. Le soir je regarde un film."],
 s:["Dis à voix haute quels sont tes loisirs favoris.",["sở thích","thích","tôi"],"Sở thích của tôi là chạy bộ và chụp hình.","Mes loisirs sont la course à pied et la photographie."]
});
S(80,{
 r:["Gọi video với má","Tối qua con nhắn tin Zalo cho má nhưng má không trả lời vì hết pin. Con chờ má sạc xong rồi gọi video. Má đăng nhập tài khoản rất chậm, nhưng cuối cùng cũng thấy mặt con trên màn hình. Má khoe vừa tải ứng dụng mới.","Hier soir je t'ai écrit sur Zalo mais maman n'a pas répondu car sa batterie était vide. J'ai attendu qu'elle recharge puis j'ai appelé en visio. Maman s'est connectée très lentement à son compte, mais a fini par voir mon visage à l'écran. Elle a dit fièrement qu'elle venait de télécharger une nouvelle application.",
  [["Pourquoi maman n'a-t-elle pas répondu ?",["batterie vide","elle dormait","pas de réseau"],0],["Ce que fait maman à la fin :",["elle voit son enfant à l'écran","elle raccroche","elle éteint"],0],["Elle a :",["téléchargé une nouvelle application","acheté un téléphone","cassé l'écran"],0]]],
 l:["Con ơi, con nhớ đổi mật khẩu wifi nha. Nhà mình hay bị mất mạng. Con đừng chia sẻ mật khẩu cho người lạ.","Mon enfant, n'oublie pas de changer le mot de passe du wifi. Chez nous le réseau saute souvent. Ne partage pas le mot de passe avec des inconnus.",
  [["À changer :",["le mot de passe wifi","le téléphone","l'écran"],0],["Problème :",["perte de réseau","batterie","prix"],0],["Interdit :",["partager le mot de passe","utiliser le wifi","regarder des vidéos"],0]]],
 w:["Écris un message court (Zalo) à un proche pour dire que tu vas l'appeler en vidéo.",["con","gọi","tối nay"],"Má ơi, tối nay con gọi video cho má nha. Má nhớ sạc điện thoại.","Maman, ce soir je t'appelle en visio, d'accord. Pense à recharger ton téléphone."],
 s:["Propose à voix haute un appel vidéo à ta famille.",["gọi video","nha","tối"],"Tối nay mình gọi video nha.","Ce soir on fait un appel vidéo, d'accord."]
});
S(81,{
 r:["Tiết kiệm hay đầu tư?","Lan muốn đầu tư vào cổ phiếu để có lợi nhuận, nhưng chồng cô sợ lỗ. Họ xem lại thu nhập, chi phí và lãi suất vay ngân hàng. Cuối cùng, họ quyết định tiết kiệm trước và chỉ đầu tư một phần nhỏ.","Lan veut investir en actions pour dégager du profit, mais son mari a peur de perdre. Ils examinent leurs revenus, leurs dépenses et le taux d'emprunt bancaire. Finalement, ils décident d'épargner d'abord et de n'investir qu'une petite partie.",
  [["Le mari a peur de :",["perdre de l'argent","gagner trop","voyager"],0],["Ils examinent :",["revenus, dépenses et taux","la météo","leur maison"],0],["Décision :",["épargner puis investir un peu","tout investir","tout dépenser"],0]]],
 l:["Nền kinh tế đang tăng trưởng, xuất khẩu tăng nhưng nhập khẩu cũng cao. Doanh nghiệp lo chi phí và thuế. Thị trường biến động mạnh.","L'économie est en croissance, les exportations augmentent mais les importations aussi. Les entreprises s'inquiètent des coûts et des impôts. Le marché est très volatil.",
  [["L'économie :",["en croissance","en récession","stable"],0],["Les entreprises craignent :",["coûts et impôts","manque de clients","la météo"],0],["Le marché :",["volatil","calme","fermé"],0]]],
 w:["Donne ton avis en 3 phrases sur épargne vs investissement.",["tiết kiệm","đầu tư","theo tôi"],"Theo tôi, nên tiết kiệm trước. Sau đó đầu tư một phần nhỏ. Quan trọng là hiểu rủi ro.","À mon avis, il faut épargner d'abord. Ensuite investir une petite partie. L'important est de comprendre le risque."],
 s:["Dis à voix haute si tu préfères épargner ou investir et pourquoi.",["tiết kiệm","rủi ro","vì"],"Tôi muốn tiết kiệm vì tôi không thích rủi ro.","Je préfère épargner car je n'aime pas le risque."]
});
S(82,{
 r:["Chính sách mới","Chính phủ vừa ban hành chính sách hỗ trợ người nghèo và người thất nghiệp. Quốc hội thảo luận về luật an sinh xã hội. Nhiều công dân tham gia tranh luận, trong khi các tổ chức tình nguyện kêu gọi giúp đỡ cộng đồng.","Le gouvernement vient de promulguer une politique d'aide aux pauvres et aux chômeurs. L'Assemblée nationale discute de la loi sur la protection sociale. De nombreux citoyens participent au débat, tandis que des organisations bénévoles appellent à aider la communauté.",
  [["Public visé :",["pauvres et chômeurs","entreprises","touristes"],0],["L'Assemblée :",["discute d'une loi sociale","ferme","voyage"],0],["Les bénévoles :",["appellent à aider","manifestent","se taisent"],0]]],
 l:["Dân số tăng nhanh, bất bình đẳng và thất nghiệp cũng gia tăng. Dư luận cho rằng cần chính sách phúc lợi tốt hơn và chống tham nhũng.","La population augmente vite, les inégalités et le chômage aussi. L'opinion publique estime qu'il faut une meilleure politique sociale et lutter contre la corruption.",
  [["Problèmes :",["inégalités et chômage","pénurie d'eau","guerre"],0],["Opinion publique :",["meilleure protection sociale","moins de taxes","plus de touristes"],0],["À combattre :",["la corruption","la pluie","les vacances"],0]]],
 w:["Rédige 3 phrases formelles sur un problème social.",["chính phủ","cần","vấn đề"],"Thất nghiệp là một vấn đề lớn. Chính phủ cần có chính sách phù hợp. Cộng đồng cũng cần giúp đỡ.","Le chômage est un gros problème. Le gouvernement doit avoir une politique adaptée. La communauté doit aussi aider."],
 s:["Donne ton avis oral sur un enjeu social.",["theo tôi","cần","xã hội"],"Theo tôi, xã hội cần quan tâm hơn đến người nghèo.","À mon avis, la société doit s'intéresser davantage aux pauvres."]
});
S(83,{
 r:["Hai chị em","Chị Hai hiền và kiên nhẫn, luôn chu đáo với mọi người. Em gái thì nóng tính nhưng rất hào phóng và hài hước. Hai người thường tranh luận vì chị hơi cố chấp, còn em hơi nhạy cảm. Dù vậy, cả hai đều rất thương nhau.","Chị Hai est douce et patiente, toujours attentionnée. Sa petite sœur est irascible mais très généreuse et drôle. Les deux se disputent souvent car l'aînée est un peu têtue et la cadette un peu sensible. Malgré cela, elles s'aiment beaucoup.",
  [["Chị Hai est :",["douce et patiente","irascible","avare"],0],["La cadette est :",["irascible mais généreuse","timide","égoïste"],0],["Malgré les disputes :",["elles s'aiment","elles s'ignorent","elles se détestent"],0]]],
 l:["Ông chú tôi keo kiệt và ích kỷ, ai cũng ngại. Còn cô tôi bao dung, trung thực và luôn lạc quan. Cô được cả họ quý mến.","Mon oncle est avare et égoïste, tout le monde le redoute. Ma tante est indulgente, honnête et toujours optimiste. Toute la famille l'apprécie.",
  [["L'oncle :",["avare et égoïste","généreux","timide"],0],["La tante :",["indulgente et optimiste","irascible","timide"],0],["Avis de la famille :",["elle est appréciée","elle est critiquée","elle est ignorée"],0]]],
 w:["Décris le caractère d'une personne de ta famille en 3 phrases.",["rất","hơi","nhưng"],"Má tôi rất hiền và chu đáo. Ba tôi hơi nóng tính nhưng hào phóng. Anh tôi hài hước.","Ma mère est très douce et attentionnée. Mon père est un peu irascible mais généreux. Mon frère est drôle."],
 s:["Décris à voix haute ton propre caractère avec 3 adjectifs.",["tôi","hơi","khá"],"Tôi khá kiên nhẫn, hơi nhút nhát nhưng lạc quan.","Je suis assez patient, un peu timide mais optimiste."]
});
S(84,{
 r:["Tranh chấp hợp đồng","Hai công ty tranh chấp về điều khoản bồi thường trong hợp đồng. Bên A cho rằng bên B vi phạm cam kết, còn bên B có bằng chứng và nhân chứng để khiếu nại. Vụ việc được chuyển lên tòa án, và bản án sẽ được tuyên vào tháng sau.","Deux sociétés sont en litige sur la clause d'indemnisation d'un contrat. La partie A estime que B a enfreint son engagement, tandis que B a des preuves et des témoins pour déposer une plainte. L'affaire est portée devant le tribunal et le jugement sera rendu le mois prochain.",
  [["Objet du litige :",["clause d'indemnisation","prix","localisation"],0],["B dispose de :",["preuves et témoins","argent","armes"],0],["Jugement :",["le mois prochain","demain","dans un an"],0]]],
 l:["Luật quy định rõ quyền và trách nhiệm của công dân. Ai vi phạm sẽ bị xử phạt. Muốn khiếu nại, bạn phải nộp bằng chứng hợp pháp.","La loi définit clairement les droits et responsabilités des citoyens. Quiconque enfreint sera sanctionné. Pour déposer une plainte, il faut fournir des preuves légales.",
  [["La loi définit :",["droits et responsabilités","taxes","tarifs"],0],["Sanction pour :",["celui qui enfreint","celui qui vote","celui qui voyage"],0],["Pour une plainte :",["fournir des preuves légales","payer","attendre"],0]]],
 w:["Écris 3 phrases formelles sur un droit ou une obligation.",["quyền","phải","theo luật"],"Mọi công dân có quyền bình đẳng. Theo luật, người vi phạm phải chịu trách nhiệm. Mọi người phải tôn trọng pháp luật.","Tous les citoyens ont droit à l'égalité. Selon la loi, le contrevenant doit assumer sa responsabilité. Chacun doit respecter la loi."],
 s:["Explique oralement ce qu'est un contrat et une clause.",["hợp đồng","điều khoản","ký kết"],"Hợp đồng là văn bản ký kết giữa hai bên, trong đó có nhiều điều khoản.","Un contrat est un document signé entre deux parties, avec de nombreuses clauses."]
});
S(85,{
 r:["Đồng bằng sông Cửu Long","Biến đổi khí hậu khiến nước biển dâng và hạn mặn lan rộng ở đồng bằng sông Cửu Long. Nông dân gặp khó khăn vì ruộng lúa bị nhiễm mặn. Các nhà khoa học đề xuất dùng giống lúa mới, phát triển năng lượng tái tạo và bảo tồn hệ sinh thái.","Le changement climatique provoque la montée des eaux et la salinisation dans le delta du Mékong. Les agriculteurs sont en difficulté car les rizières sont touchées par le sel. Les scientifiques proposent d'utiliser de nouvelles variétés de riz, de développer les énergies renouvelables et de préserver l'écosystème.",
  [["Problème :",["salinisation et montée des eaux","manque de soleil","trop de pluie"],0],["Victimes :",["les agriculteurs","les touristes","les pêcheurs de perles"],0],["Solutions :",["nouvelles variétés, renouvelables, préservation","fermer les écoles","interdire le riz"],0]]],
 l:["Nhiệt độ toàn cầu tăng làm thiên tai và lũ lụt nhiều hơn. Chúng ta cần tái chế, giảm khí thải và dùng pin mặt trời.","La température mondiale augmente, ce qui multiplie catastrophes naturelles et inondations. Il faut recycler, réduire les émissions et utiliser des panneaux solaires.",
  [["Conséquence :",["plus de catastrophes et d'inondations","moins de pluie","plus de neige"],0],["Solutions :",["recycler et énergie solaire","construire plus de routes","abattre des arbres"],0],["À réduire :",["les émissions","les écoles","les ponts"],0]]],
 w:["Propose 3 actions écologiques en vietnamien.",["tái chế","giảm","nên"],"Chúng ta nên tái chế rác. Chúng ta cần giảm khí thải. Nên dùng năng lượng sạch.","Nous devrions recycler les déchets. Nous devons réduire les émissions. Il faut utiliser des énergies propres."],
 s:["Explique oralement un problème environnemental du Delta.",["hạn mặn","nước biển dâng","ảnh hưởng"],"Hạn mặn và nước biển dâng ảnh hưởng nhiều đến nông dân.","La salinisation et la montée des eaux touchent beaucoup les agriculteurs."]
});
S(86,{
 r:["Một ngày ở bảo tàng","Chúng tôi ghé bảo tàng lịch sử xem hội họa, điêu khắc và kiến trúc cổ. Hướng dẫn viên kể về các triều đại và di sản của đất nước. Sau đó, chúng tôi đi thăm chùa và xem lễ hội truyền thống với dân ca.","Nous passons au musée d'histoire voir de la peinture, de la sculpture et de l'architecture ancienne. Le guide raconte les dynasties et le patrimoine du pays. Ensuite nous visitons une pagode et assistons à un festival traditionnel avec des chants populaires.",
  [["Au musée :",["peinture, sculpture, architecture","dinosaures","voitures"],0],["Le guide parle :",["des dynasties et du patrimoine","du climat","de la bourse"],0],["Après :",["pagode et festival","plage","cinéma"],0]]],
 l:["Nhà văn viết tiểu thuyết và truyện ngắn về lịch sử. Nhà thơ viết thơ về phong tục và tín ngưỡng. Hai người cùng bảo tồn truyền thống văn học.","L'écrivain écrit des romans et nouvelles sur l'histoire. Le poète écrit des poèmes sur les coutumes et croyances. Les deux préservent la tradition littéraire.",
  [["L'écrivain :",["romans et nouvelles historiques","chansons","pièces de théâtre"],0],["Le poète :",["poèmes sur coutumes et croyances","romans policiers","contes pour enfants"],0],["Ensemble :",["préserver la tradition littéraire","voyager","vendre des livres"],0]]],
 w:["Décris un lieu culturel que tu aimerais visiter (3 phrases).",["tôi","muốn","chùa"],"Tôi muốn đi thăm chùa ở Huế. Chùa có kiến trúc cổ rất đẹp. Tôi sẽ chụp hình.","Je voudrais visiter une pagode à Huế. Elle a une très belle architecture ancienne. Je prendrai des photos."],
 s:["Présente oralement une tradition ou un festival du Vietnam.",["lễ hội","truyền thống","mọi người"],"Lễ hội là truyền thống đẹp, mọi người cùng hát dân ca và ăn uống.","Le festival est une belle tradition, tout le monde chante des chants populaires et mange ensemble."]
});
S(87,{
 r:["Lời khuyên của ông","Ông tôi nói: « Làm việc phải sớm, đừng nước đến chân mới nhảy ». Ông còn bảo: « Chín người mười ý, nghe nhiều rồi hãy quyết ». Khi tôi sang nước khác, ông dặn: « Nhập gia tùy tục, đừng ếch ngồi đáy giếng ».","Mon grand-père dit : « Il faut travailler tôt, n'attends pas le dernier moment. » Il ajoute : « Autant de têtes autant d'avis, écoute beaucoup avant de décider. » Quand je suis parti à l'étranger, il m'a conseillé : « À Rome fais comme les Romains, ne vis pas comme une grenouille au fond du puits. »",
  [["Premier conseil :",["ne pas attendre le dernier moment","manger beaucoup","dormir tôt"],0],["Deuxième :",["écouter plusieurs avis","parler fort","voyager"],0],["Troisième :",["s'adapter et s'ouvrir","rester chez soi","fuir"],0]]],
 l:["Anh ấy nói một đằng làm một nẻo, lại ăn cháo đá bát nên không ai tin. Còn chị ấy thì đồng cam cộng khổ với bạn bè, luôn có công mài sắt có ngày nên kim.","Il dit une chose et en fait une autre, en plus il manque de gratitude, donc personne ne lui fait confiance. Elle, en revanche, partage joies et peines avec ses amis, et croit que la persévérance finit par payer.",
  [["Lui :",["dit une chose, en fait une autre","est fidèle","est généreux"],0],["Elle :",["partage joies et peines","est avare","est paresseuse"],0],["Conclusion :",["il n'est pas digne de confiance","tout va bien","il est un modèle"],0]]],
 w:["Écris 2 phrases en utilisant chacune un idiome de l'unité dans une situation réelle.",["như","nhập gia tùy tục","chín người mười ý"],"Đúng là nhập gia tùy tục. Như người ta thường nói, chín người mười ý.","C'est bien vrai : à Rome fais comme les Romains. Comme on dit, autant de têtes autant d'avis."],
 s:["Utilise à voix haute un idiome de l'unité pour commenter une situation.",["đúng là","chín người mười ý","mỗi người"],"Đúng là chín người mười ý, mỗi người một cách nghĩ.","C'est vrai, autant de têtes autant d'avis, chacun pense à sa façon."]

S(88,{
 r:["Một buổi tư vấn dinh dưỡng","Bác sĩ nhi khoa chẩn đoán bé bị thừa cân, chỉ số khối cơ thể cao hơn mức bình thường. Trong tiền sử gia đình có người tiểu đường và cao huyết áp. Bác sĩ tư vấn về dinh dưỡng, giải thích tác dụng phụ của việc ăn nhiều đường, và hẹn tái khám sau một tháng.","Le pédiatre diagnostique un surpoids chez l'enfant, son IMC est supérieur à la normale. Dans les antécédents familiaux il y a du diabète et de l'hypertension. Le médecin donne des conseils nutritionnels, explique les conséquences d'une consommation élevée de sucre et fixe une consultation de suivi dans un mois.",
  [["Diagnostic :",["surpoids","malnutrition","asthme"],0],["Antécédents familiaux :",["diabète et hypertension","cancer","aucun"],0],["Suivi :",["dans un mois","dans un an","jamais"],0]]],
 l:["Bệnh nhân bị nhiễm trùng nên được điều trị bằng kháng sinh. Bác sĩ dặn không dùng thuốc nếu dị ứng, nhớ tác dụng phụ và đến tái khám đúng hẹn. Nếu nặng thì phải phẫu thuật.","Le patient a une infection et est donc traité par antibiotiques. Le médecin recommande de ne pas prendre le médicament en cas d'allergie, de penser aux effets secondaires et de revenir au rendez-vous. Si c'est grave, il faudra opérer.",
  [["Traitement :",["antibiotiques","chirurgie","vaccin"],0],["À surveiller :",["allergie et effets secondaires","météo","régime"],0],["Si grave :",["chirurgie","repos","aucun traitement"],0]]],
 w:["Écris 3 phrases d'une consultation (diagnostic, traitement, suivi).",["chẩn đoán","điều trị","tái khám"],"Tôi chẩn đoán bé bị viêm phổi. Tôi điều trị bằng kháng sinh. Hẹn tái khám sau một tuần.","Je diagnostique une pneumonie chez l'enfant. Je le traite par antibiotiques. Rendez-vous de suivi dans une semaine."],
 s:["Joue le médecin : explique à voix haute à un parent le surpoids de son enfant.",["thừa cân","dinh dưỡng","tư vấn"],"Cháu bị thừa cân. Tôi sẽ tư vấn dinh dưỡng cho gia đình.","L'enfant est en surpoids. Je vais conseiller la famille sur la nutrition."]
});
S(89,{
 r:["Cuộc họp cổ đông","Giám đốc báo cáo doanh thu năm nay tăng nhưng lợi nhuận ròng giảm vì chi phí cao. Cổ đông hỏi về chiến lược thương hiệu, thị phần và đối thủ cạnh tranh. Công ty dự định huy động vốn và ký kết hợp đồng với đối tác mới sau khi kiểm toán xong.","Le directeur indique que le chiffre d'affaires de l'année a augmenté mais que le bénéfice net a baissé à cause de coûts élevés. Les actionnaires interrogent sur la stratégie de marque, la part de marché et la concurrence. L'entreprise prévoit de lever des fonds et de signer un contrat avec un nouveau partenaire après l'audit.",
  [["Bénéfice net :",["a baissé","a augmenté","est stable"],0],["Questions des actionnaires :",["stratégie, part de marché, concurrence","météo","logo"],0],["Après l'audit :",["lever des fonds et signer","fermer","fusionner"],0]]],
 l:["Công ty sáp nhập với một đối tác lớn để mở rộng chuỗi cung ứng. Bộ phận kế toán chuẩn bị báo cáo tài chính, còn kiểm toán sẽ bắt đầu tuần sau.","L'entreprise fusionne avec un grand partenaire pour étendre sa chaîne d'approvisionnement. Le service comptable prépare le rapport financier, l'audit commencera la semaine prochaine.",
  [["Opération :",["fusion","faillite","fermeture"],0],["Comptabilité :",["prépare le rapport","part en vacances","est supprimée"],0],["Audit :",["la semaine prochaine","hier","jamais"],0]]],
 w:["Écris un mini-rapport (3 phrases) sur les résultats d'une entreprise.",["doanh thu","lợi nhuận","tăng"],"Doanh thu quý này tăng mười phần trăm. Lợi nhuận giảm nhẹ vì chi phí cao. Công ty sẽ điều chỉnh chiến lược.","Le chiffre d'affaires du trimestre a augmenté de 10 %. Le bénéfice a légèrement baissé à cause des coûts élevés. L'entreprise ajustera sa stratégie."],
 s:["Résume à voix haute une situation d'entreprise en deux phrases.",["doanh thu","tăng","chiến lược"],"Doanh thu tăng nhưng công ty cần điều chỉnh chiến lược.","Le chiffre d'affaires augmente mais l'entreprise doit ajuster sa stratégie."]

S(90,{
 r:["Bữa cơm ở nhà bà","Cô bước rón rén vào nhà bà, mỉm cười chào rồi thì thầm với em. Bà ngồi ngắm hoa ngoài sân, thấy cô liền mời: « Con vô xơi cơm với bà nha ». Cô khen món cá kho ngon, còn em trai thì chê hơi mặn, bị mẹ nhắc nhở.","Elle entre à pas de loup chez grand-mère, sourit en saluant puis chuchote à son petit frère. Grand-mère est assise à contempler les fleurs dans la cour ; la voyant, elle l'invite : « Entre manger avec moi. » Elle complimente le poisson braisé, tandis que le petit frère le trouve un peu trop salé et se fait reprendre par sa mère.",
  [["Comment entre-t-elle ?",["à pas de loup","en courant","en criant"],0],["Grand-mère :",["contemple les fleurs puis l'invite","dort","cuisine"],0],["Le petit frère :",["trouve le plat trop salé","adore tout","refuse de manger"],0]]],
 l:["Ông nội đã qua đời cách đây hai năm. Cả nhà vẫn nhớ ông và hay kể chuyện về ông. Bà thì ngồi lặng lẽ, thỉnh thoảng nức nở nhớ ông.","Grand-père est décédé il y a deux ans. Toute la famille pense encore à lui et raconte souvent des histoires sur lui. Grand-mère, elle, s'assoit en silence et parfois sanglote en pensant à lui.",
  [["Le grand-père :",["est décédé","est malade","voyage"],0],["La famille :",["raconte des histoires sur lui","l'oublie","est fâchée"],0],["Grand-mère :",["sanglote parfois","rit toujours","dort"],0]]],
 w:["Écris 3 phrases en variant les verbes de regard ou de parole (nhìn, ngắm, liếc, thì thầm...).",["nhìn","ngắm","thì thầm"],"Tôi nhìn ra cửa sổ. Tôi ngắm hoa ngoài sân. Em tôi thì thầm điều gì đó.","Je regarde par la fenêtre. Je contemple les fleurs dans la cour. Mon petit frère chuchote quelque chose."],
 s:["Invite à voix haute un aîné à manger de façon très polie.",["xơi","mời","bà"],"Bà xơi cơm đi ạ, con mời bà.","Grand-mère, mangez, je vous en prie."]
});

function norm(s){
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().replace(/[.,!?;:"“”«»'’()\-–—…]/g,' ').trim().replace(/\s+/g,' ');
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- affichage : thème & taille du texte ---------- */
function getPref(k,d){ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } }
function applyDisplay(){
  let th=getPref('vn_theme',''); if(!th) th=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  document.documentElement.setAttribute('data-theme',th);
  const fs=parseFloat(getPref('vn_fs','1')); document.documentElement.style.fontSize=(16*fs)+'px';
}
function toggleTheme(){ const th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; try{ localStorage.setItem('vn_theme',th); }catch(e){} applyDisplay(); renderSidebar(); }
function changeFs(d){ let fs=parseFloat(getPref('vn_fs','1')); fs=Math.min(1.4,Math.max(0.85,Math.round((fs+d)*100)/100)); try{ localStorage.setItem('vn_fs',String(fs)); }catch(e){} applyDisplay(); renderSidebar(); }
applyDisplay();

function renderSidebar(){
  const wrap = document.getElementById('unitListWrap');
  wrap.innerHTML = '';
  const dr=document.createElement('div'); dr.className='disp-row';
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  dr.innerHTML=`<button onclick="toggleTheme()">${dark?'☀️ Mode clair':'🌙 Mode sombre'}</button><button onclick="changeFs(-0.1)" aria-label="Réduire le texte">A−</button><button onclick="changeFs(0.1)" aria-label="Agrandir le texte">A+</button>`;
  wrap.appendChild(dr);
  wrap.insertAdjacentHTML('beforeend',wotdHTML()+goalHTML());
  const levels = [...new Set(units.map(u=>u.level))].sort((a,b)=>a-b);
  levels.forEach(lvl=>{
    const label = document.createElement('div');
    label.className = 'level-label';
    label.textContent = levelNames[lvl];
    wrap.appendChild(label);
    const track = document.createElement('div');
    track.className = 'river-track';
    if(lvl===1){ const z=document.createElement('button'); z.className='unit-item'+(currentView==='tones'?' active':''); z.innerHTML='Unité 0 — Tons & prononciation du Sud<small>Thanh điệu · 6 tons, sons du Sud, exercices</small>'; z.onclick=()=>setView('tones'); track.appendChild(z); }
    units.filter(u=>u.level===lvl).forEach(u=>{
      const btn = document.createElement('button');
      btn.className = 'unit-item' + (currentView==='unit' && u.id===currentUnit?' active':'') + (doneUnits.has(u.id)?' done':'');
      btn.innerHTML = `Unité ${u.num} — ${u.title}<small>${u.sub}</small>` + (doneUnits.has(u.id)?'<span class="unit-check">✓</span>':'');

function mcqGroup(key, arr){
  return arr.map((m,i)=>{
    const id = key+i; reg(id,{type:'mcq',a:m.a,q:m.q,options:m.options});
    return `<div class="exercise"><div class="q">${i+1}. ${m.q}</div><div class="options">${
      m.options.map((o,j)=>`<button class="opt-btn" data-ex="${id}" onclick="checkQ('${id}',${j})">${o}</button>`).join('')
    }</div></div>`;
  }).join('');
}
function variants(vn){
  return String(vn).split(/\s*\/\s*|\s*;\s*/).map(s=>s.replace(/\(.*?\)/g,'').trim()).filter(Boolean);
}
function pickVocab(u,n,salt){
  const ok = u.vocab.filter(v=>v.vn && !/[…]|\.\.\./.test(v.vn) && v.vn.trim().split(/\s+/).length<=4 && v.fr);
  const out=[], used=new Set(); if(!ok.length) return out;
  const step = Math.max(1, Math.floor(ok.length/n));
  for(let k=0;k<n*3 && out.length<Math.min(n,ok.length);k++){
    const idx = (salt + k*step) % ok.length;
    if(!used.has(idx)){ used.add(idx); out.push(ok[idx]); }
  }
  return out;
}
function dictationBlock(u){
  return pickVocab(u,3,0).map((v,i)=>{
    const id='dict'+i; reg(id,{type:'text',kind:'dict',answers:variants(v.vn),full:v.vn,fb:'dfb'+i,inp:id});
    return `<div class="exercise"><div class="q">${i+1}. <button class="big-audio-btn" style="margin-bottom:0" onclick="speak(_tts[${T(v.vn)}])">🔊 Écouter</button> <button class="ghost-btn" onclick="speak(_tts[${T(v.vn)}],0.6)">🐢 Lent</button></div>
      <div class="fill-row"><input type="text" id="${id}" placeholder="Écris ce que tu entends…" autocapitalize="off" autocomplete="off"><button class="check-btn" onclick="checkText('${id}')">Vérifier</button></div>
      <div class="fb" id="dfb${i}"></div></div>`;
  }).join('');
}
function translationBlock(u){
  const sal = Math.max(1, Math.floor(u.vocab.length/3));
  return pickVocab(u,3,sal).map((v,i)=>{
    const id='trad'+i; reg(id,{type:'text',kind:'trad',fr:v.fr,answers:variants(v.vn),full:v.vn,fb:'tfb'+i,inp:id});
    return `<div class="exercise"><div class="q">${i+1}. Comment dit-on « ${v.fr} » ?</div>
      <div class="fill-row"><input type="text" id="${id}" placeholder="En vietnamien…" autocapitalize="off" autocomplete="off"><button class="check-btn" onclick="checkText('${id}')">Vérifier</button></div>
      <div class="fb" id="tfb${i}"></div></div>`;
  }).join('');
}

  const id='write0'; reg(id,{type:'write',keys:w.keys,model:w.model});

function newToneQ(){ const s=Math.floor(Math.random()*TONE_SETS.length), i=Math.floor(Math.random()*6); _tq.cur={s:s,i:i,w:TONE_SETS[s][i]}; _tq.done=false; _tq.fb=''; }
function answerTone(i){
  if(_tq.done) return; markStudy(); _tq.done=true; _tq.ans++;
  const c=_tq.cur.i, merged=(i===3&&c===4)||(i===4&&c===3);
  if(i===c||merged){ _tq.ok++; _tq.fb='✓ '+_tq.cur.w+' = '+TONE_NAMES[c]+(merged&&i!==c?' (au Sud hỏi et ngã sonnent pareil)':''); }

function newSpell(){ const q=SPELL[Math.floor(Math.random()*SPELL.length)]; const o=q[1].map((w,i)=>[w,i===q[2]]); if(Math.random()<.5) o.reverse(); _tq.sp={fr:q[0],opts:o.map(x=>x[0]),ok:o.findIndex(x=>x[1])}; _tq.spDone=false; _tq.spFb=''; }
function answerSpell(i){

  _tq.spFb=(good?'✓ ':'✗ Réponse : ')+_tq.sp.opts[_tq.sp.ok]; renderTones();

}

function answerErr(j){
  if(_er.done) return; markStudy();

function doSearch(q){

const BOX_DAYS=[0,1,3,7,14,30,60];
let _cards={state:'home',queue:[],i:0,flipped:false,ok:0,again:0,requeued:{}};
function dayNum(){ return Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000); }
function loadSRS(){ try{ return JSON.parse(localStorage.getItem('vn_srs')||'{}'); }catch(e){ return {}; } }
function saveSRS(s){ try{ localStorage.setItem('vn_srs',JSON.stringify(s)); }catch(e){} }
function getSet(){ let s={}; try{ s=JSON.parse(localStorage.getItem('vn_cards_set')||'{}'); }catch(e){} return {level:s.level||'all',dir:s.dir||'vf',newPerDay:s.newPerDay||10}; }
function setSet(k,v){ const s=getSet(); s[k]=(k==='newPerDay')?parseInt(v):v; try{ localStorage.setItem('vn_cards_set',JSON.stringify(s)); }catch(e){} renderMain(); }
function allCards(levelFilter){
  const out=[];
  const inNotes=new Set(loadNotes().map(x=>x.vn));
  units.forEach(u=>{
    if(isTest(u)) return;
    if(levelFilter==='carnet') return;
    if(levelFilter==='done' && !doneUnits.has(u.id)) return;
    if(levelFilter && levelFilter!=='all' && levelFilter!=='done' && String(u.level)!==String(levelFilter)) return;
    u.vocab.forEach(v=>{ if(v.note && /^unité \d+$/i.test(v.note.trim())) return; if(inNotes.has(v.vn) && (!levelFilter||levelFilter==='all')) return; out.push({key:u.id+'|'+v.vn,u:u,v:v}); });
  });
  if(!levelFilter||levelFilter==='all'||levelFilter==='carnet') loadNotes().forEach(x=>out.push({key:x.k||('carnet|'+x.vn),u:x.src?{num:(units.find(z=>z.id===x.src)||{}).num||'✎',title:'Mon carnet',id:x.src}:{num:'✎',title:'Mon carnet',id:0},v:x}));
  return out;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function cardStats(){
  const set=getSet(), srs=loadSRS(), today=dayNum(), cards=allCards(set.level);
  const due=cards.filter(c=>srs[c.key] && srs[c.key].d<=today).length;
  const learned=cards.filter(c=>srs[c.key] && srs[c.key].b>=4).length;
  const seen=cards.filter(c=>srs[c.key]).length;
  const newDone=(srs.__new && srs.__new.day===today)?srs.__new.n:0;
  const newLeft=Math.max(0,Math.min(set.newPerDay-newDone,cards.length-seen));
  return {total:cards.length,due:due,learned:learned,seen:seen,newLeft:newLeft};
}
function startSession(){
  const set=getSet(), srs=loadSRS(), today=dayNum(), cards=allCards(set.level);
  const due=shuffle(cards.filter(c=>srs[c.key] && srs[c.key].d<=today));
  const newDone=(srs.__new && srs.__new.day===today)?srs.__new.n:0;
  const fresh=cards.filter(c=>!srs[c.key]).slice(0,Math.max(0,set.newPerDay-newDone));
  _cards={state:'run',queue:[...due,...fresh],i:0,flipped:false,ok:0,again:0,requeued:{}};
  renderMain();
}
function flipCard(){ if(_cards.state!=='run') return; _cards.flipped=true; renderMain(); const c=_cards.queue[_cards.i]; if(c && getSet().dir!=='audio') speak(c.v.vn.split(' / ')[0]); }
function gradeCard(g){
  if(_cards.state!=='run' || !_cards.flipped) return;
  markStudy();
  const c=_cards.queue[_cards.i], srs=loadSRS(), today=dayNum();
  const isNew=!srs[c.key];
  const rec=srs[c.key]||{b:0,d:today};
  if(g===0){
    rec.b=1; rec.d=today; _cards.again++;
    const n=_cards.requeued[c.key]||0;
    if(n<2){ _cards.requeued[c.key]=n+1; _cards.queue.push(c); }
  } else {
    rec.b=Math.min(6,Math.max(1,rec.b)+(g===2?2:1)); rec.d=today+BOX_DAYS[rec.b]; _cards.ok++;
  }
  srs[c.key]=rec;
  if(isNew){ const cur=(srs.__new && srs.__new.day===today)?srs.__new.n:0; srs.__new={day:today,n:cur+1}; }
  saveSRS(srs);
  _cards.i++; _cards.flipped=false;
  if(_cards.i>=_cards.queue.length) _cards.state='done';
  renderMain();
  if(_cards.state==='run' && getSet().dir==='audio'){ const n=_cards.queue[_cards.i]; if(n) speak(n.v.vn.split(' / ')[0]); }
}

let _dlg=null;
function exampleFor(c){
  if(!_dlg){ _dlg=[]; units.forEach(u=>(u.dialogue||[]).forEach(l=>_dlg.push({uid:u.id,vn:l.vn,fr:l.fr}))); }
  let w=c.v.vn.split(' / ')[0].replace(/\(.*?\)/g,'').trim();
  if(w.length<2||/[…]|\.\.\./.test(w)) return null;
  let re; try{ re=new RegExp('(^|[^\\p{L}])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^\\p{L}])','iu'); }catch(e){ return null; }
  const hits=_dlg.filter(l=>l.vn!==c.v.vn&&re.test(l.vn)&&l.vn.length<110);
  if(!hits.length) return null;
  hits.sort((a,b)=>((a.uid===c.u.id?0:1)-(b.uid===c.u.id?0:1))||a.vn.length-b.vn.length);
  return hits[0];
}

/* dictée / traduction */
function checkText(id){
  const e=_ex[id]; if(!e||e.done) return;
  const input=document.getElementById(e.inp), fb=document.getElementById(e.fb);
  if(!input.value.trim()){ fb.textContent='Écris ta réponse d\'abord.'; fb.className='fb bad-fb'; return; }
  e.done=true; input.disabled=true;
  const v=norm(input.value);
  const ok=e.answers.some(a=>norm(a)===v);
  const exact=e.answers.some(a=>a.trim().toLowerCase()===input.value.trim().toLowerCase());
  input.classList.add(ok?'correct':'wrong');
  if(ok && exact) fb.textContent='✓ Parfait, tons compris !';
  else if(ok) fb.textContent=`✓ Bien ! Attention aux tons : ${e.full}`;
  else fb.textContent=`✗ Réponse attendue : ${e.full}`;
  fb.className='fb '+(ok?'ok-fb':'bad-fb');
  if(!ok){ if(e.kind==='dict') logErr({t:'dict',w:e.full,ans:e.full}); else if(e.kind==='trad') logErr({t:'trad',fr:e.fr,ans:e.full}); }
  award(ok);
}

  const res=e.keys.map(k=>({k, ok:padded.includes(' '+norm(k)+' ')}));
  const found=res.filter(r=>r.ok).length;
  const need=Math.ceil(res.length*0.6);
  document.getElementById('wres').innerHTML=`<div class="keys-result">${res.map(r=>`<span class="kbadge ${r.ok?'ok':'ko'}">${r.ok?'✓':'✗'} ${r.k}</span>`).join('')}</div>
    <div class="fb ${found>=need?'ok-fb':'bad-fb'}">${found} / ${res.length} éléments attendus utilisés${found>=need?' — bien joué !':' — compare avec le modèle ci-dessous et réessaie à l\'oral ou par écrit.'}</div>`;
  award(found>=need);
}
/* expression orale */
let _mr=null,_stream=null,_sr=null,_chunks=[];
function stopMedia(){
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  try{ if(_sr) _sr.abort(); }catch(e){}
  try{ if(_mr && _mr.state!=='inactive') _mr.stop(); }catch(e){}
  try{ if(_stream) _stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  _sr=null; _mr=null; _stream=null;
}
async function toggleRecord(id){
  const btn=document.getElementById('recbtn'+id), st=document.getElementById('recst'+id);
  if(_mr && _mr.state==='recording'){ _mr.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ st.textContent="L'enregistrement n'est pas disponible sur ce navigateur : entraîne-toi à voix haute puis utilise l'auto-évaluation."; return; }
  try{
    stopMedia();
    _stream = await navigator.mediaDevices.getUserMedia({audio:true});
    _chunks=[]; _mr = new MediaRecorder(_stream);
    _mr.ondataavailable = e=>{ if(e.data.size) _chunks.push(e.data); };
    _mr.onstop = ()=>{
      const blob = new Blob(_chunks,{type:_mr.mimeType||'audio/mp4'});
      const url = URL.createObjectURL(blob);
      document.getElementById('recau'+id).innerHTML = `<audio class="rec-audio" controls src="${url}"></audio>`;
      st.textContent = 'Réécoute-toi et compare avec le modèle (tons, rythme, finales).';
      btn.classList.remove('on'); btn.textContent = "🎙️ Refaire un enregistrement";
      try{ _stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    };
    _mr.start(); btn.classList.add('on'); btn.textContent='⏹ Arrêter'; st.textContent='🔴 Enregistrement… parle, puis clique sur Arrêter.';
  }catch(err){ st.textContent="Micro refusé ou indisponible. Tu peux t'entraîner à voix haute et t'auto-évaluer."; }
}
function recognize(id){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  const st=document.getElementById('recst'+id);
  if(!SR){ st.textContent='Reconnaissance vocale indisponible ici.'; return; }
  stopMedia();
  try{
    const r = new SR(); _sr=r; r.lang='vi-VN'; r.interimResults=false; r.maxAlternatives=3;
    st.textContent='🎙️ Je t\'écoute… parle maintenant.';
    r.onresult = e=>{
      const alts=[...e.results[0]].map(a=>a.transcript);
      const targets=_ex[id].targets; let best=0, bestT=alts[0];
      alts.forEach(t=>{ const toks=new Set(norm(t).split(' ')); const sc=targets.length? targets.filter(w=>toks.has(w)).length/targets.length : 0; if(sc>=best){best=sc;bestT=t;} });
      const pct=Math.round(best*100);
      st.innerHTML = `Reconnu : « <b>${esc(bestT)}</b> » — correspondance avec le modèle : <b>${pct} %</b>. ${pct>=60?'Très bien !':'Réécoute le modèle et réessaie.'} <span class="mini">(la reconnaissance reste approximative, surtout pour les tons)</span>`;
      if(pct>=60) selfRate(id,true);
    };
    r.onerror = e=>{ st.textContent='Reconnaissance indisponible ('+e.error+'). Utilise plutôt « M\'enregistrer » ou l\'auto-évaluation.'; };
    r.start();
  }catch(err){ st.textContent='Reconnaissance indisponible. Utilise « M\'enregistrer ».'; }
}
function selfRate(id, ok){
  const e=_ex[id]; if(!e||e.done) return; e.done=true;
  const fb=document.getElementById('selffb'+id);
  fb.textContent = ok ? '✓ Noté — continue comme ça !' : '↻ Pas de souci : réécoute le modèle et recommence quand tu veux.';
  fb.className='fb '+(ok?'ok-fb':'bad-fb');
  document.querySelectorAll('#self'+id+' button').forEach(b=>b.disabled=true);
  award(ok);
}

function renderAll(){
  renderSidebar();
  renderMain();
}

document.getElementById('menuBtn').onclick = ()=>{
  document.getElementById('sidebar').classList.toggle('open');
};

if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=>{ window.speechSynthesis.getVoices(); };
}

renderAll();

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('Service worker registration failed:', err);
    });
  });
}
